version: 2

project_name: trackfw

builds:
  - main: ./cmd/trackfw
    binary: trackfw
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # D2 (ML-1A v8): win32/arm64 was previously ignored because gen-platform-manifests.sh
    # already listed it. Go cross-compiles windows/arm64 cleanly with CGO_ENABLED=0.
    # check-platform-matrix-parity.sh gates that .goreleaser.yaml and
    # gen-platform-manifests.sh always agree — divergence is now caught at make quality time.
    ldflags:
      - -s -w -X 'github.com/kgsaran/trackfw/internal/version.Version={{.Version}}'

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  # prerelease: auto — GoReleaser derives the prerelease flag from the tag suffix.
  # Any tag matching GoReleaser's semver pre-release pattern (e.g. v8.0.0-rc1, v8.0.0-beta.1)
  # is published as a GitHub pre-release, NOT as the stable `latest` release.
  # Without this key, GoReleaser defaults to false, meaning rc tags publish as stable and
  # become `latest` via the GitHub Releases API — measured 2026-09-16: v8.0.0-rc1 served
  # as `latest` for 3 days. `true` would demote stable releases, breaking the stable channel;
  # `auto` is the correct value. Consistent with `brews.skip_upload: auto` already in use.
  # Enforced by scripts/check-goreleaser-prerelease.sh (gate, parity-rest).
  prerelease: auto
  extra_files:
    - glob: scripts/install.sh

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge"

brews:
  - name: trackfw
    homepage: "https://github.com/kgsaran/trackfw"
    description: "Governed software delivery framework: ADR → REQ → ROADMAP → kanban"
    license: "MIT"
    repository:
      owner: kgsaran
      name: homebrew-trackfw
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    install: |
      bin.install "trackfw"
    test: |
      assert_match "trackfw", shell_output("#{bin}/trackfw version")
    skip_upload: auto
