name: Gates locais do fork

# 🔴 ARQUIVO NOVO, SÓ NOSSO — de propósito.
#
# Os 7 workflows existentes são COMPARTILHADOS com o upstream (derivado por
# `git ls-tree`, não por `git cat-file`: o MSYS converte `ref:.caminho` quando o
# caminho começa com ponto, e a checagem devolve "só nosso" para arquivo que é
# dele). Acrescentar um job a qualquer um deles criaria divergência de produto
# que todo merge futuro pagaria — hoje ela é ZERO. Adição não é divergência.
#
# POR QUE `push` E `pull_request`, e nunca `workflow_dispatch`: disparo manual é
# exatamente o defeito que este workflow existe para fechar. Medido em
# 2026-09-10: 10 scripts em `scripts/` são só nossos e NENHUM era invocado por
# automação nenhuma. O `check-upstream-content.sh` ficou vermelho por semanas com
# 7 arquivos de governança do upstream em `docs/`, e só apareceu porque alguém o
# rodou à mão numa auditoria de outra REQ.
#
# Ver REQ-2026-09-10-o-check-upstream-content-nao-roda-em-lugar-nenhum.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates-locais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 🔴 Histórico completo: dois dos gates derivam por comparação com o
          # upstream. Com clone raso a ref não resolve — e eles falham FECHADOS,
          # que é o comportamento certo, mas transformaria este job num vermelho
          # permanente por motivo errado.
          fetch-depth: 0

      - name: Buscar o upstream
        # Sem isto, `upstream/main` não existe no runner e os gates que dependem
        # dela reprovam dizendo isso. Falham fechados de propósito: verde por não
        # conseguir checar seria pior.
        run: |
          git remote add upstream https://github.com/kgsaran/trackfw.git || true
          git fetch --no-tags upstream main

      - name: Identidade do git
        # 🔴 OBRIGATORIO. O check-upstream-sync-falsify exercita o
        # upstream-sync.sh, que faz `git merge --no-commit --no-ff`. Mesmo SEM
        # commitar, o git exige identidade e falha com "Committer identity
        # unknown". O runner nao traz uma; a maquina de desenvolvimento traz, e
        # por isso o gate passava local e reprovava aqui.
        #
        # Levou QUATRO camadas de stderr descartado para esta mensagem aparecer:
        # o worktree cravado em /c, o merge que ignorava o exit code, o sync que
        # descartava a saida, e o gate que descartava a do sync.
        run: |
          git config user.email "ci@localhost"
          git config user.name "CI"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 🔴 Sem setup-node, setup-python, `npm ci` e `pip install` desde 2026-09-16.
      # Existiam para o check-subcommand-parity, que invocava os CLIs de Node e
      # Python. A v8.0.0 do upstream (#365) removeu as duas reimplementacoes, o
      # gate foi retirado, e nenhum gate nosso usa mais runtime alem do Go. O
      # self-test do ratchet abaixo usa o python3 que o ubuntu-latest ja traz.
      # Ver REQ-2026-09-16-gates-so-nossos-depois-da-v8.

      - name: Compilar o binário da árvore
        # O gate mede com o binário DESTA árvore, nunca com o do PATH — um
        # `trackfw` instalado é outra instalação, e já reportou 15 violações que
        # eram zero.
        run: go build -o bin/trackfw ./cmd/trackfw

      - name: Gates locais do fork
        run: bash scripts/run-local-gates.sh

      - name: Self-test do ratchet de Windows do upstream
        # 🔴 Sem este passo o self-test NAO roda em lugar nenhum do nosso CI. O `Makefile` o
        # chama no `parity-rest`, mas o nosso `parity-other-gates` morre na linha 78, antes de
        # chegar a ele (check-roadmap-barrier-contract.sh, sobre o snapshot congelado que nao
        # regeneramos).
        #
        # O script e do upstream e o arquivo e COMPARTILHADO: aqui ele so e EXECUTADO, nunca
        # editado. A divergencia de produto continua zero.
        #
        # 🔴 Guarda de vacuidade sobre o denominador: o self-test sai 0 quando nenhum caso
        # falha, e isso inclui o caso de nenhum caso rodar. Zero PASS nao e verde.
        #
        # 🔴 stop-commands: os casos sinteticos do self-test imprimem `::error::` de proposito
        # (exercitam os caminhos de erro do ratchet), e o GitHub converte cada um em anotacao.
        # Medido no run 34596903146: 10 anotacoes "failure" num job VERDE. Durante o self-test
        # os comandos ficam desligados; se ele reprovar, o passo emite UM erro, este aqui.
        #
        # Ver ROADMAP-2026-09-10-baselines-de-suite-nunca-foram-versionados, ML-1A.
        run: |
          set -o pipefail
          token="selftest-$(date +%s)-$RANDOM"
          echo "::stop-commands::${token}"
          rc=0
          python3 scripts/check-windows-known-failures.py --self-test 2>&1 | tee "$RUNNER_TEMP/ratchet-self-test.txt" || rc=$?
          echo "::${token}::"
          if [ "$rc" -ne 0 ]; then
            echo "::error::self-test do ratchet REPROVOU (exit $rc) — ver as linhas SELF-TEST FAIL acima"
            exit "$rc"
          fi
          if ! grep -qE '^Self-test summary: [1-9][0-9]* PASS, 0 FAIL$' "$RUNNER_TEMP/ratchet-self-test.txt"; then
            echo "::error::self-test do ratchet sem denominador valido: esperava 'Self-test summary: N PASS, 0 FAIL' com N > 0"
            exit 1
          fi

      - name: trackfw validate
        run: ./bin/trackfw validate

      - name: Divergência de produto tem de ser ZERO
        # O invariante do fork: arquivo COMPARTILHADO que difere. Adição não
        # conta — os scripts só nossos não são divergência.
        run: |
          set -euo pipefail
          div=0
          for f in $(git diff --name-only HEAD upstream/main -- internal npm pypi cmd .github Makefile); do
            if git cat-file -e "HEAD:$f" 2>/dev/null && git cat-file -e "upstream/main:$f" 2>/dev/null; then
              echo "  DIVERGE (compartilhado): $f"
              div=$((div + 1))
            fi
          done
          echo "arquivos compartilhados que diferem: $div"
          if [ "$div" -gt 0 ]; then
            echo "::error::divergencia de produto deixou de ser zero"
            exit 1
          fi
