name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: go test -timeout 2m ./...
        env:
          TRACKFW_DISABLE_EXTERNAL_COMMANDS: "1"
      - run: go vet ./...
      - run: go build ./...
      - run: npm ci --ignore-scripts
        working-directory: npm
      - run: npm test
        working-directory: npm
      - run: python -m pip install build pytest
      # Instala o pacote (e suas dependências declaradas em pypi/pyproject.toml,
      # ex. PyYAML) para que os testes tenham as libs de runtime disponíveis —
      # mesmo padrão já em uso em quality.yml.
      - run: python -m pip install pypi/
      - run: python -m pytest pypi/tests -q
      - run: python -m build pypi
      # Subconjunto reduzido intencional (3 dos 15 scripts de `make parity`),
      # não os 15 completos de quality.yml — decisão registrada em
      # docs/req/REQ-2026-08-04-job-parity-do-ci-so-roda-4-de-14-scripts-do-make-parity-falsificacao-e-identity-parity-nunca-rodam-em-ci.md
      # (título referencia a contagem de 14 scripts vigente à data da REQ;
      # check-attention-scripts-parity.sh elevou para 15 em 2026-08-05).
      # Tags só são criadas (conforme CLAUDE.md "Protocolo de Release") a
      # partir de um commit já mergeado na main, e quality.yml roda `make
      # parity` completo (15 scripts) em todo push para main — logo, quando
      # esta tag dispara, os 15 scripts já rodaram verdes nesse exato commit.
      # Rodar os 15 de novo aqui seria redundância completa (~4min medidos
      # localmente) sem ganho de sinal, só atraso na publicação de release.
      # Este smoke check reduzido existe apenas como defesa contra o caso
      # excepcional de alguém criar uma tag manualmente sobre um commit que
      # nunca passou por quality.yml (ex: tag em branch fora de main).
      - run: scripts/check-cli-parity.sh
      - run: scripts/check-validate-parity.sh
      - run: scripts/check-static-assets.sh

  release:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  publish-npm:
    needs: [quality, release]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Copia README para o pacote npm
        run: cp ../README.md README.md

      - name: Atualiza versão no package.json
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publica no npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    needs: [quality, release]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pypi
    environment:
      name: pypi
      url: https://pypi.org/project/trackfw/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instala build
        run: pip install build

      - name: Atualiza versão no pyproject.toml
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml

      - name: Copia README para o pacote PyPI
        run: cp ../README.md README.md

      - name: Build do pacote
        run: python -m build

      - name: Publica no PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi/dist/

  # verify-channels — AC4: partial publication failure is detectable.
  # Runs after BOTH publish-npm and publish-pypi, even if one of them failed (if: always()).
  # v7.6.0 published GitHub and PyPI successfully but left npm behind due to an expired
  # credential — both jobs showed green and the missing channel was only noticed later.
  # This job makes the failure visible: it checks all three channels by name and exits
  # non-zero with a named message for each missing channel.
  #
  # Note: the npm registry and PyPI may need a short propagation window after publishing.
  # The 45-second sleep covers normal propagation; transient failures should be re-run.
  verify-channels:
    name: Verify all release channels
    needs: [publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Wait for registry propagation
        run: sleep 45

      - name: Verify GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "ok: GitHub release v$VERSION is live"
          else
            echo "FAIL: GitHub release v$VERSION not found — goreleaser may have failed" >&2
            exit 1
          fi

      - name: Verify npm channel
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if npm view "trackfw@$VERSION" version > /dev/null 2>&1; then
            echo "ok: npm trackfw@$VERSION is live"
          else
            echo "FAIL: npm trackfw@$VERSION not found — publish-npm may have failed or credential expired" >&2
            exit 1
          fi

      - name: Verify PyPI channel
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          FOUND=$(python3 -c "
import urllib.request, json, sys
url = 'https://pypi.org/pypi/trackfw/json'
try:
    data = json.loads(urllib.request.urlopen(url, timeout=15).read())
    releases = data.get('releases', {})
    sys.exit(0 if '$VERSION' in releases else 1)
except Exception as e:
    print(f'query failed: {e}', file=sys.stderr)
    sys.exit(1)
" 2>&1) && STATUS=0 || STATUS=$?
          if [[ "$STATUS" -eq 0 ]]; then
            echo "ok: PyPI trackfw $VERSION is live"
          else
            echo "FAIL: PyPI trackfw $VERSION not found — publish-pypi may have failed$( [[ -n "$FOUND" ]] && echo " ($FOUND)" )" >&2
            exit 1
          fi
