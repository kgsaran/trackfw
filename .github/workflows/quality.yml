name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -timeout 2m ./...
        env:
          TRACKFW_DISABLE_EXTERNAL_COMMANDS: "1"
      - run: go vet ./...
      - run: go build ./...
      - run: scripts/check-static-assets.sh
      - run: scripts/check-integration-assets.sh

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run smoke
      - run: npm pack --dry-run

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: scripts/smoke-integration-packages.sh

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build pytest
      # Instala o pacote (e suas dependências declaradas em pypi/pyproject.toml,
      # ex. PyYAML) para que os testes tenham as libs de runtime disponíveis.
      # Os testes importam do código-fonte via sys.path (não do pacote
      # instalado), então isso não sombreia o que está sendo testado — apenas
      # resolve dependências sem hardcodar nomes aqui (zero drift: nova dep
      # em pyproject.toml passa a ser instalada automaticamente).
      - run: python -m pip install pypi/
      - run: python -m pytest pypi/tests -q
      - run: python -m build pypi
      - run: python -m pip install --force-reinstall pypi/dist/*.whl
      - run: trackfw --version
      - run: |
          tmp_dir=$(mktemp -d)
          cd "$tmp_dir"
          trackfw validate --json

  windows-integrations-resolve:
    # Guard de regressão: o bug de path Windows (manager.js:31, manager.go:398)
    # é invisível em ubuntu-latest porque path.normalize / filepath.Clean não
    # convertem "/" → "\" no Linux.  Este job é o único guard honesto.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Go — integrations resolve (Windows)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./internal/integrations/... -run TestResolveWindowsCrossplatform -v
        env:
          TRACKFW_DISABLE_EXTERNAL_COMMANDS: "1"

      - name: Node — integrations resolve (Windows)
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
        working-directory: npm
      - run: node --test tests/integrations_resolve.test.js
        working-directory: npm

      - name: Python — integrations resolve (Windows)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest pypi/tests/test_integrations_resolve.py -v

  parity:
    runs-on: ubuntu-latest
    needs: [go, node, python, package-smoke, windows-integrations-resolve]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
        working-directory: npm
      # Instala o pacote (e suas dependências declaradas em pypi/pyproject.toml,
      # ex. PyYAML) para que os scripts de paridade, que invocam o CLI Python a
      # partir do código-fonte via PYTHONPATH, tenham as libs de runtime
      # disponíveis. PYTHONPATH é preposto ao sys.path, então o código
      # importado continua sendo o do repositório — só as deps de runtime vêm
      # do pacote instalado. Mesmo padrão do job `python` (zero drift: nomes
      # de dependência não são hardcodados aqui).
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pypi/
      # `make parity` roda os 15 scripts de scripts/check-*.sh (inclui os 101
      # cenários de falsificação de check-gates-falsify.sh e o
      # check-identity-parity.sh) em vez de uma lista manual parcial — ver
      # docs/req/REQ-2026-08-04-job-parity-do-ci-so-roda-4-de-14-scripts-do-make-parity-falsificacao-e-identity-parity-nunca-rodam-em-ci.md.
      # Tempo local medido em 2026-08-05 (Apple Silicon): ~4m15s total, dos
      # quais check-gates-falsify.sh sozinho responde por ~3m05s. Mantido
      # sequencial (sem job paralelo) porque o total fica abaixo de dois
      # dígitos de minutos e o job `parity` já roda depois de
      # go/node/python/package-smoke/windows-integrations-resolve (needs:
      # acima), então não é o gargalo do pipeline de PR.
      - run: make parity
        env:
          TRACKFW_DISABLE_EXTERNAL_COMMANDS: "1"
