name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -timeout 2m ./...
        env:
          TRACKFW_DISABLE_EXTERNAL_COMMANDS: "1"
      - run: go vet ./...
      - run: go build ./...
      - run: scripts/check-static-assets.sh
      - run: scripts/check-integration-assets.sh

  pr-closing-keyword:
    # Gate de palavra-chave de fechamento de issue no corpo do PR
    # (REQ-2026-09-02-prs-usam-palavra-chave-de-fechamento-em-portugues-e-nenhuma-
    # issue-fecha-automaticamente). So faz sentido no evento `pull_request`: e o
    # unico em que `github.event.pull_request.body` existe no payload. Em `push`
    # para a main o job e pulado inteiro pelo `if:` — nao ha corpo a medir, e o
    # script sairia 2 (not_evaluated), nunca 0 em silencio.
    #
    # O script le o corpo do proprio payload do evento (GITHUB_EVENT_PATH), com
    # `json.load` — nao usa `gh`, nao precisa de token, e nao depende de
    # `contents: read` alem do checkout.
    #
    # NAO adicionado a `required_status_checks` — decisao do arquiteto. Um gate
    # novo em obrigatorio bloqueia todo PR se nascer com defeito.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Autoteste do gate (falsificacao nas duas direcoes)
        run: scripts/check-pr-closing-keyword.sh --self-test
      - name: Corpo deste PR usa palavra-chave de fechamento em ingles
        run: scripts/check-pr-closing-keyword.sh

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run smoke
      - run: npm pack --dry-run

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: scripts/smoke-integration-packages.sh

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build pytest
      # Instala o pacote (e suas dependências declaradas em pypi/pyproject.toml,
      # ex. PyYAML) para que os testes tenham as libs de runtime disponíveis.
      # Os testes importam do código-fonte via sys.path (não do pacote
      # instalado), então isso não sombreia o que está sendo testado — apenas
      # resolve dependências sem hardcodar nomes aqui (zero drift: nova dep
      # em pyproject.toml passa a ser instalada automaticamente).
      - run: python -m pip install pypi/
      - run: python -m pytest pypi/tests -q
      - run: python -m build pypi
      - run: python -m pip install --force-reinstall pypi/dist/*.whl
      - run: trackfw --version
      - run: |
          tmp_dir=$(mktemp -d)
          cd "$tmp_dir"
          trackfw validate --json

  windows-integrations-resolve:
    # Guard de regressão: o bug de path Windows (manager.js:31, manager.go:398)
    # é invisível em ubuntu-latest porque path.normalize / filepath.Clean não
    # convertem "/" → "\" no Linux.  Este job é o único guard honesto.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Go — integrations resolve (Windows)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./internal/integrations/... -run TestResolveWindowsCrossplatform -v
        env:
          TRACKFW_DISABLE_EXTERNAL_COMMANDS: "1"

      - name: Node — integrations resolve (Windows)
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
        working-directory: npm
      - run: node --test tests/integrations_resolve.test.js
        working-directory: npm

      - name: Python — integrations resolve (Windows)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest pypi/tests/test_integrations_resolve.py -v

  windows-full-suites:
    # Camada 1 do instrumento de medição — ADR-2026-08-30-ci-de-windows-como-
    # instrumento-de-medicao-job-largo-que-nasce-vermelho-mais-sonda-sob-
    # demanda.md, decisão 1/2. As TRÊS suítes completas (go test ./...,
    # npm test, pytest pypi/tests) em windows-latest — sem invocação
    # dirigida (não confundir com o job windows-integrations-resolve acima,
    # que é intocado e continua sendo um guard estreito e honesto).
    #
    # NÃO CORRIGE nada (ADR decisão 7). O critério de aceite é que este job
    # REPROVE reproduzindo os defeitos da issue #216 — um job de Windows que
    # nasce verde não prova nada (foi assim que chegamos aqui).
    #
    # continue-on-error: true é TEMPORÁRIO (AC4) — só remover depois que TODAS
    # as REQs de correção dos 11 itens da issue #216 fecharem. Até lá este
    # job aparece como ⚠️, nunca ❌, e branch protection com "required status
    # checks" não trava PR por causa dele — decisão deliberada para não
    # paralisar trabalho não relacionado. Revisão obrigatória antes de
    # remover: confirmar que os 11 itens estão corrigidos E cobertos por
    # verificação que falhava antes (ADR decisão 7).
    #
    # AC12 — isolação de $HOME/USERPROFILE: pypi/tests/conftest.py e
    # internal/validator/main_test.go isolam via a env var HOME, que a
    # produção NÃO lê no Windows (verificado contra o stdlib: os.UserHomeDir
    # do Go usa exclusivamente %USERPROFILE% no branch "windows" — sem
    # fallback para $HOME —, e ntpath.expanduser do Python idem). Sem
    # mitigação, `go test ./...` escreveria de verdade no perfil do runner, e
    # o Go paraleliza pacotes por padrão: condição de corrida DENTRO da
    # mesma execução (Wave 0, hades-tf — ML-0A). Mitigação aplicada AQUI, no
    # job, não no produto nem nos arquivos de teste (fora do escopo desta
    # ML):
    #   1. USERPROFILE/HOME sobrescritos para um diretório sintético só nos
    #      passos que RODAM as suítes — não no job inteiro, para não
    #      desviar os caches do setup-go/setup-node/pip (por isso
    #      GOPATH/GOMODCACHE/GOCACHE/npm_config_cache/PIP_CACHE_DIR abaixo
    #      são fixados fora do home sintético, e valem para o job inteiro).
    #   2. `go test` roda com -p 1 -parallel 1 e `node --test` com
    #      --test-concurrency=1, eliminando a concorrência ENTRE
    #      pacotes/arquivos de teste que dividiriam o mesmo home sintético.
    #      pytest já é serial por padrão aqui (sem pytest-xdist configurado).
    # Isto NÃO corrige o defeito 2/6 (a produção continua ignorando $HOME em
    # runtime real — a suíte de reprodução, job windows-defect-reproduction
    # abaixo, é que precisa provar isso) — só torna a MEDIÇÃO reproduzível.
    # Um passo de precondição confirma que a isolação vale antes de rodar
    # qualquer suíte; se não valer, as suítes são puladas nesta execução e o
    # job reporta a razão em vez de produzir um resultado não confiável — a
    # suíte de reprodução roda de qualquer forma, independente deste job.
    #
    # RESIDUAL DECLARADO (AC12, sempre vale, não só quando a precondição
    # falha): mesmo com a precondição passando, a mitigação acima NÃO
    # produz isolação POR TESTE — todos os pacotes/arquivos de teste desta
    # execução compartilham UM ÚNICO diretório sintético, sequencialmente,
    # sem limpeza entre eles. Resíduo deixado por um teste pode interferir
    # em outro dentro da mesma execução (mesma classe de problema que a
    # Wave 0 mediu para a home real, só que num diretório descartável em
    # vez do perfil do runner). Uma falha nesta camada sem correspondência
    # clara a um item da issue #216 pode ser efeito colateral disto, não um
    # 12º defeito — triar como resíduo do instrumento antes de assumir
    # achado novo. Corrigir isolação por-teste em
    # pypi/tests/conftest.py e internal/validator/main_test.go (usar
    # USERPROFILE, não só HOME) está fora do escopo desta ML.
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Fixar caches fora do home sintético (AC12)
        # env: de JOB não aceita o contexto `runner` (só github, inputs, vars,
        # secrets, strategy, matrix, needs) — por isso este step grava em
        # $GITHUB_ENV, herdado por todos os steps seguintes do job, em vez de
        # um `env:` de job. Continua valendo para o job inteiro, como a AC12
        # exige (setup-go/setup-node/pip incluídos, não só as suítes).
        shell: pwsh
        run: |
          "GOPATH=$env:RUNNER_TEMP\gopath" >> $env:GITHUB_ENV
          "GOMODCACHE=$env:RUNNER_TEMP\gomodcache" >> $env:GITHUB_ENV
          "GOCACHE=$env:RUNNER_TEMP\gocache" >> $env:GITHUB_ENV
          "npm_config_cache=$env:RUNNER_TEMP\npm-cache" >> $env:GITHUB_ENV
          "PIP_CACHE_DIR=$env:RUNNER_TEMP\pip-cache" >> $env:GITHUB_ENV

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
        working-directory: npm
      - run: python -m pip install --upgrade pip pytest
      # Instala o pacote (e suas dependências declaradas em pypi/pyproject.toml,
      # ex. PyYAML>=6.0) para que a suíte pytest completa tenha as libs de
      # runtime disponíveis — mesmo padrão dos jobs `python` (linha 73) e
      # `parity` (linha 407) acima: zero drift, sem hardcodar nomes de
      # dependência aqui. Faltava aqui (ML-1D): o job só instalava pytest,
      # então `python -m pytest pypi/tests` falhava na COLETA de 40 módulos
      # com `ModuleNotFoundError: No module named 'yaml'` antes de exercitar
      # qualquer defeito real da issue #216 — resíduo do instrumento, não a
      # medição pretendida (ver comentário AC12 acima sobre residual do
      # instrumento vs. achado novo).
      - run: python -m pip install pypi/

      - name: Registrar início (AC10)
        shell: pwsh
        run: echo "started=$(Get-Date -AsUTC -Format o)" >> $env:GITHUB_ENV

      - name: Preparar diretório sintético de home (AC12)
        id: home
        shell: pwsh
        # ML-1D — este step é deliberadamente MÍNIMO: cria o diretório e nada
        # mais. A hipótese de que o home sintético vazio quebrava o `git` das
        # fixtures (sem `.gitconfig` global → "Author identity unknown" no
        # `git commit`) foi MEDIDA POR LEITURA e FALSIFICADA: todo helper que
        # commita de verdade nos 3 runtimes seta identidade LOCAL no próprio
        # repositório antes do primeiro commit
        # (internal/validator/validator_test.go:26 initGitRepo,
        # pypi/tests/test_credential_guard_integrity.py:27 _init_git_repo,
        # npm/tests/credential_guard_integrity.test.js:36), e os que exigem
        # config global limpa pinam GIT_CONFIG_GLOBAL num arquivo vazio próprio
        # (internal/commands/branch_prune_test.go:435 e equivalentes). Semear
        # identidade aqui não desbloquearia teste nenhum — só acrescentaria uma
        # variável não medida ao instrumento. Ver o step de sonda abaixo, que é
        # o que converte essa leitura em medição no Windows.
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "winhome"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "home=$dir" >> $env:GITHUB_OUTPUT

      - name: AC12 — confirmar que a isolação de HOME/USERPROFILE vale antes de rodar as suítes
        id: precondition
        shell: pwsh
        continue-on-error: true
        env:
          HOME: ${{ steps.home.outputs.home }}
          USERPROFILE: ${{ steps.home.outputs.home }}
        run: |
          $expected = $env:USERPROFILE
          $failed = $false
          $goHome = (go run scripts/windows-repro/go/checks.go home) 2>&1 | Out-String
          Write-Host "Go   os.UserHomeDir()      -> $($goHome.Trim())"
          if ($goHome.Trim() -ne $expected) { $failed = $true }
          $nodeHome = (node -e "console.log(require('os').homedir())") 2>&1 | Out-String
          Write-Host "Node os.homedir()          -> $($nodeHome.Trim())"
          if ($nodeHome.Trim() -ne $expected) { $failed = $true }
          $pyHome = (python -c "import os; print(os.path.expanduser('~'))") 2>&1 | Out-String
          Write-Host "Py   os.path.expanduser(~) -> $($pyHome.Trim())"
          if ($pyHome.Trim() -ne $expected) { $failed = $true }
          if ($failed) {
            Write-Host "::error::AC12 — a isolação de HOME/USERPROFILE não vale para pelo menos um runtime. Pulando as três suítes completas nesta execução (ver step 'Camada 1 pulada' abaixo)."
            exit 1
          }
          Write-Host "AC12 — isolação confirmada para os 3 runtimes."

      - name: ML-1D — sonda de `git` sob o home sintético (observacional)
        # O ML-1D nasceu da hipótese (REQ AC5) de que
        # `git symbolic-ref --short HEAD exited with null` e
        # `git not found in current $PATH` vinham DESTE job — do home sintético.
        # A leitura das fontes falsifica isso: as duas strings são emitidas por
        # fixtures que SUBSTITUEM o $PATH por um diretório curado contendo um
        # `git` SEM extensão — npm/src/ship/runner.js:124 (spawnSync devolve
        # status null = ENOENT) alcançado por npm/tests/ship.test.js:866,943
        # (`env: { PATH: tmpBin, ... }`), e pypi/tests/test_barrier.py:446, que
        # varre o $PATH procurando um arquivo literalmente chamado `git`. É a
        # classe do ML-1A (PATHEXT do Windows), resolvida em arquivo de TESTE —
        # nenhum $PATH configurado aqui as alcança, porque a fixture descarta o
        # $PATH do job.
        #
        # Esta sonda é o que torna essa conclusão FALSIFICÁVEL no Windows, já
        # que ela foi obtida por leitura: mede, sob exatamente o mesmo
        # HOME/USERPROFILE das três suítes, se o `git` resolve, se um
        # `init/add/commit` completa e se `symbolic-ref --short HEAD` responde.
        # Verde ⇒ o home sintético não é a causa (a conclusão acima se sustenta,
        # e as falhas de `git` devem ser triadas como fixture). Vermelho ⇒ existe
        # um bloqueio de ambiente que a leitura não viu, e o log diz qual.
        #
        # 🔴 continue-on-error + fora do `if:` das suítes, de propósito: esta
        # sonda NUNCA pode virar portão. O único portão de entrada das três
        # suítes continua sendo `steps.precondition.outcome` (AC12); encadear a
        # sonda ali faria testes serem PULADOS — exatamente o que o AC7 da REQ
        # proíbe. Com continue-on-error, o `conclusion` dela é success, então o
        # `success()` implícito do step "Camada 1 pulada" também fica intacto.
        #
        # Roda num repositório descartável em RUNNER_TEMP, FORA do home
        # sintético, para não deixar resíduo no diretório compartilhado pelas
        # suítes (residual declarado da AC12 acima).
        if: always() && steps.precondition.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          HOME: ${{ steps.home.outputs.home }}
          USERPROFILE: ${{ steps.home.outputs.home }}
        run: |
          # O wrapper `shell: pwsh` do GitHub prepende $ErrorActionPreference='stop', e no
          # PowerShell 7.4+ (o do windows-latest) $PSNativeCommandUseErrorActionPreference
          # e $true por padrao: um comando NATIVO que sai != 0 vira erro TERMINANTE. Sem
          # estas duas linhas, um `git commit` que falha mataria o script na hora e o
          # ::warning:: abaixo — a unica razao de esta sonda existir — nunca seria impresso,
          # exatamente na execucao em que ele importa.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $probe = Join-Path $env:RUNNER_TEMP "gitprobe"
          Remove-Item -Recurse -Force -Path $probe -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $probe | Out-Null
          Write-Host "git --version                 -> $((git --version) 2>&1)"
          Write-Host "git config --show-origin --get user.email:"
          Write-Host "  $((git config --show-origin --get user.email) 2>&1)"
          git -C $probe init --quiet
          Set-Content -Path (Join-Path $probe "a.txt") -Value "probe"
          git -C $probe add a.txt
          # Identidade LOCAL, igual ao que todo helper de fixture dos 3 runtimes
          # faz (initGitRepo / _init_git_repo / git(dir,'config',...)) — a sonda
          # mede a MESMA condição que as suítes, não uma mais permissiva.
          git -C $probe config user.email "probe@trackfw.invalid"
          git -C $probe config user.name "probe"
          $commit = (git -C $probe commit -m "probe") 2>&1 | Out-String
          Write-Host $commit
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::ML-1D — 'git commit' falhou sob o home sintético mesmo com identidade local. Existe bloqueio de ambiente que a leitura das fontes não previu: as falhas de git desta execucao NAO devem ser triadas como fixture antes de investigar isto."
          } else {
            $head = (git -C $probe symbolic-ref --short HEAD) 2>&1 | Out-String
            Write-Host "symbolic-ref --short HEAD     -> $($head.Trim())"
            Write-Host "ML-1D — nenhum bloqueio de ambiente detectado: sob este HOME/USERPROFILE o git resolve, commita e responde symbolic-ref. Resultado CONSISTENTE com causa de fixture para as falhas de git desta execucao — nao e prova de que toda falha de git seja de fixture."
          }

      - name: Go — suíte completa (camada 1, AC1)
        # always() && <condição>: sem always() aqui, o GitHub Actions
        # prepende success() implicitamente a qualquer if: sem função de
        # status (doc oficial) — então, quando o step Go falha, os steps
        # Node/Python seguintes eram pulados mesmo com
        # `steps.precondition.outcome == 'success'` == true, porque o
        # success() implícito já era falso (medido no PR #221, run
        # 33322373895: Go -> failure, Node/Python -> skipped). always()
        # substitui esse success() implícito por "sempre avalia minha
        # condição", preservando a precondição da AC12 como ÚNICO portão de
        # entrada — não é um always() cego (não roda quando a precondição
        # falhou).
        if: always() && steps.precondition.outcome == 'success'
        shell: pwsh
        env:
          HOME: ${{ steps.home.outputs.home }}
          USERPROFILE: ${{ steps.home.outputs.home }}
          TRACKFW_DISABLE_EXTERNAL_COMMANDS: "1"
        run: go test -p 1 -parallel 1 -timeout 20m ./...

      - name: Node — suíte completa (camada 1, AC1)
        # always() && <condição>: ver comentário no step "Go — suíte
        # completa" acima — mesmo motivo, mesma correção (ML-1C).
        if: always() && steps.precondition.outcome == 'success'
        shell: pwsh
        working-directory: npm
        env:
          HOME: ${{ steps.home.outputs.home }}
          USERPROFILE: ${{ steps.home.outputs.home }}
        # SEM argumento de caminho, de propósito: com Node 20/26 testados
        # localmente, `node --test tests/` (positional de diretório) falha
        # com MODULE_NOT_FOUND — parece tratar o positional como um módulo a
        # exigir, não como raiz de descoberta, nesta versão. `node --test`
        # (sem positional) usa a descoberta padrão a partir do cwd e achou os
        # MESMOS 839 testes que `npm test` (verificado localmente) — mesma
        # suíte completa, não um filtro (não é a regressão "sem invocação
        # dirigida" que a Wave 0 e o AC1 proíbem).
        run: node --test --test-concurrency=1

      - name: Python — suíte completa (camada 1, AC1)
        # always() && <condição>: ver comentário no step "Go — suíte
        # completa" acima — mesmo motivo, mesma correção (ML-1C).
        if: always() && steps.precondition.outcome == 'success'
        shell: pwsh
        env:
          HOME: ${{ steps.home.outputs.home }}
          USERPROFILE: ${{ steps.home.outputs.home }}
        run: python -m pytest pypi/tests -q

      - name: Camada 1 pulada — AC12 impediu execução segura
        if: steps.precondition.outcome != 'success'
        shell: pwsh
        run: |
          Write-Host "::warning::Camada 1 (as três suítes completas) foi pulada porque a precondição de isolação de HOME/USERPROFILE falhou (AC12). A suíte de reprodução de defeito (job windows-defect-reproduction) roda de qualquer forma e é o instrumento que precisa nascer vermelho. Residual: a isolação por-teste em pypi/tests/conftest.py e internal/validator/main_test.go continua vazia no Windows (usa `$HOME`, produção lê `USERPROFILE`) — corrigir esses dois arquivos está fora do escopo do ML-1A."

      - name: Registrar duração (AC10)
        if: always()
        shell: pwsh
        run: |
          $start = [DateTimeOffset]::Parse($env:started)
          $elapsed = [DateTimeOffset]::UtcNow - $start
          $msg = "Duração medida do job windows-full-suites: $($elapsed.ToString())"
          Write-Host $msg
          if ($env:GITHUB_STEP_SUMMARY) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## AC10 — tempo do job`n`n$msg" }

  windows-defect-reproduction:
    # Camada 2 do instrumento — ADR decisão 6/AC2/AC2b/AC3. Uma verificação
    # por defeito conhecido da issue #216, mapeada 1:1, exercitando o
    # caminho real de produção — sem mock. É ESTA que precisa nascer
    # vermelha: a Wave 0 (hades-tf, ML-0A) mediu que as três suítes completas
    # sozinhas (job windows-full-suites acima) só expõem 2 dos 11 itens com
    # confiança direta — entregar só elas produziria falsa sensação de
    # cobertura sobre os outros 9. Ver scripts/windows-repro/run.ps1 para o
    # mapeamento completo item a item (comentário de cabeçalho do arquivo).
    #
    # continue-on-error: true é TEMPORÁRIO (AC4), mesmo motivo e mesmo
    # critério de remoção do job windows-full-suites acima.
    #
    # NÃO CORRIGE nada (ADR decisão 7): uma verificação que passar quando
    # deveria reproduzir o defeito é achado (defeito ausente/já corrigido, ou
    # a verificação está errada) — nunca motivo para alterar código de
    # produto neste job.
    #
    # Independente do job windows-full-suites: não compartilha `needs`, não
    # depende do resultado dele. Roda mesmo se a camada 1 for pulada por
    # AC12.
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Fixar caches fora do home sintético (AC12)
        # Mesmo motivo do job windows-full-suites acima: env: de JOB não
        # aceita o contexto `runner` — só env: de step, with: e run: o
        # aceitam. Step de setup gravando em $GITHUB_ENV replica o efeito de
        # um env: de job (vale para todos os steps seguintes) sem violar o
        # schema.
        shell: pwsh
        run: |
          "GOPATH=$env:RUNNER_TEMP\gopath" >> $env:GITHUB_ENV
          "GOMODCACHE=$env:RUNNER_TEMP\gomodcache" >> $env:GITHUB_ENV
          "GOCACHE=$env:RUNNER_TEMP\gocache" >> $env:GITHUB_ENV
          "npm_config_cache=$env:RUNNER_TEMP\npm-cache" >> $env:GITHUB_ENV
          "PIP_CACHE_DIR=$env:RUNNER_TEMP\pip-cache" >> $env:GITHUB_ENV

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
        working-directory: npm
      - run: python -m pip install --upgrade pip
      # Instala o pacote (e suas dependências declaradas em pypi/pyproject.toml,
      # ex. PyYAML>=6.0) para que checks.py tenha as libs de runtime
      # disponíveis — mesmo padrão dos jobs `python` (linha 73), `parity`
      # (linha 407) e `windows-full-suites` (linha 219) acima: zero drift,
      # sem hardcodar nomes de dependência aqui. Faltava aqui (achado
      # bloqueante da barreira de qualidade, 2026-08-30): o job instalava
      # `pyyaml` por nome, desacoplado de pyproject.toml — uma segunda
      # dependência de runtime entrando no pacote sem editar esta linha faria
      # `import trackfw.cli` morrer com ModuleNotFoundError antes de alcançar
      # qualquer ponto medido pelos itens 1/4/5/6, reportando ABSENT por
      # vacuidade (mesmo mecanismo que o ML-1D já corrigiu na camada 1).
      - run: python -m pip install pypi/

      - name: Registrar início (AC10)
        shell: pwsh
        run: echo "started=$(Get-Date -AsUTC -Format o)" >> $env:GITHUB_ENV

      - name: Suíte de reprodução de defeito — 11 itens da issue #216 (AC2, AC2b, AC3)
        shell: pwsh
        run: pwsh -File scripts/windows-repro/run.ps1

      - name: Registrar duração (AC10)
        if: always()
        shell: pwsh
        run: |
          $start = [DateTimeOffset]::Parse($env:started)
          $elapsed = [DateTimeOffset]::UtcNow - $start
          $msg = "Duração medida do job windows-defect-reproduction: $($elapsed.ToString())"
          Write-Host $msg
          if ($env:GITHUB_STEP_SUMMARY) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## AC10 — tempo do job`n`n$msg" }

  parity:
    runs-on: ubuntu-latest
    needs: [go, node, python, package-smoke, windows-integrations-resolve]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
        working-directory: npm
      # Instala o pacote (e suas dependências declaradas em pypi/pyproject.toml,
      # ex. PyYAML) para que os scripts de paridade, que invocam o CLI Python a
      # partir do código-fonte via PYTHONPATH, tenham as libs de runtime
      # disponíveis. PYTHONPATH é preposto ao sys.path, então o código
      # importado continua sendo o do repositório — só as deps de runtime vêm
      # do pacote instalado. Mesmo padrão do job `python` (zero drift: nomes
      # de dependência não são hardcodados aqui).
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pypi/
      # `make parity` roda a lista completa de gates do alvo `parity` do
      # Makefile (inclui os 101 cenários de falsificação de
      # check-gates-falsify.sh, o check-identity-parity.sh e o
      # check-output-encoding-declared.sh) em vez de uma lista manual
      # parcial, deliberadamente — ver
      # docs/req/REQ-2026-08-04-job-parity-do-ci-so-roda-4-de-14-scripts-do-make-parity-falsificacao-e-identity-parity-nunca-rodam-em-ci.md.
      # MEDIDO NO RUNNER em 2026-09-03 (run 33679814232, decomposto por step):
      #   job parity                780 s   <- ~90% do tempo de parede de um PR
      #     check-gates-falsify.sh  610 s   <- 78,4% dos gates
      #     os outros 43 gates      170 s
      #   setup 20 s · build 1,5 s · post 0 s  (nenhum overhead a otimizar)
      #
      # ATENÇÃO — a nota anterior deste bloco está VENCIDA e fica registrada como
      # errada em vez de apagada: ela dizia, medida em 2026-08-05 na máquina local,
      # "~4m15s total" e "não é o gargalo do pipeline de PR". As duas metades
      # caducaram — são 13m23 no CI, e o parity É o gargalo. A decisão estava certa
      # quando foi tomada: o alvo tinha ~14 gates e hoje tem 46. O defeito foi nada
      # revalidar a premissa enquanto a população triplicava.
      #
      # Mantido sequencial por MEDIÇÃO, não por inércia
      # (docs/qualidade/2026-09-03-medicao-do-alvo-parity.md):
      #   - `make -j` NÃO SE APLICA: as 46 invocações são linhas de UMA receita, e
      #     make -j paraleliza targets, não linhas. E 5 rodadas concorrentes deram
      #     2,2-3,4x MAIS LENTO em 10 vCPU; o runner tem 4.
      #   - matriz de shards ganha só ~19% (13m23 -> ~10m50), porque o piso é o
      #     check-gates-falsify sozinho. Ele teria de cair a ~40% do job para o
      #     sharding render ~7 min; está em 75,9%.
      #   - e `parity` é required_status_check POR NOME com enforce_admins: matriz
      #     renomeia o check e bloquearia TODO PR. Prova viva na mesma lista:
      #     `python (3.10)` / `python (3.12)`.
      #
      # Os segundos estão no check-gates-falsify (610 de 780) e têm REQ própria:
      # REQ-2026-09-03-check-gates-falsify-e-610-dos-780-segundos-do-parity-...
      # Nenhum gate sai do parity: reduzir cobertura não é otimizar.
      # Próxima revisão desta premissa: revalidar quando o alvo passar de ~60 gates.
      - run: make parity
        env:
          TRACKFW_DISABLE_EXTERNAL_COMMANDS: "1"
