name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # ML-2G (ROADMAP-2026-09-06-perfil-e-aceleracao-do-check-gates-falsify-
  # sem-perder-cobertura.md): grau da matriz de sharding do gate de
  # falsificação, num único lugar. A matriz do job `parity-falsify-shard`
  # abaixo (`strategy.matrix.shard: [0, 1, 2, 3]`) é CABEADA (GitHub Actions
  # não permite matriz dinâmica sem um job prévio que a compute via
  # `fromJSON`) — os dois têm de ter o MESMO tamanho. Um step de guarda no
  # próprio job de matriz reprova cedo se alguém mudar um sem o outro
  # (compara `strategy.job-total` contra este valor).
  FALSIFY_SHARD_COUNT: "4"

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -timeout 2m ./...
        env:
          TRACKFW_DISABLE_EXTERNAL_COMMANDS: "1"
      - run: go vet ./...
      - run: go build ./...
      - run: scripts/check-static-assets.sh
      - run: scripts/check-integration-assets.sh

  pr-closing-keyword:
    # Gate de palavra-chave de fechamento de issue no corpo do PR
    # (REQ-2026-09-02-prs-usam-palavra-chave-de-fechamento-em-portugues-e-nenhuma-
    # issue-fecha-automaticamente). So faz sentido no evento `pull_request`: e o
    # unico em que `github.event.pull_request.body` existe no payload. Em `push`
    # para a main o job e pulado inteiro pelo `if:` — nao ha corpo a medir, e o
    # script sairia 2 (not_evaluated), nunca 0 em silencio.
    #
    # O script le o corpo do proprio payload do evento (GITHUB_EVENT_PATH), com
    # `json.load` — nao usa `gh`, nao precisa de token, e nao depende de
    # `contents: read` alem do checkout.
    #
    # NAO adicionado a `required_status_checks` — decisao do arquiteto. Um gate
    # novo em obrigatorio bloqueia todo PR se nascer com defeito.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Autoteste do gate (falsificacao nas duas direcoes)
        run: scripts/check-pr-closing-keyword.sh --self-test
      - name: Corpo deste PR usa palavra-chave de fechamento em ingles
        run: scripts/check-pr-closing-keyword.sh

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run smoke
      - run: npm pack --dry-run

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: scripts/smoke-integration-packages.sh

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build pytest
      # Instala o pacote (e suas dependências declaradas em pypi/pyproject.toml,
      # ex. PyYAML) para que os testes tenham as libs de runtime disponíveis.
      # Os testes importam do código-fonte via sys.path (não do pacote
      # instalado), então isso não sombreia o que está sendo testado — apenas
      # resolve dependências sem hardcodar nomes aqui (zero drift: nova dep
      # em pyproject.toml passa a ser instalada automaticamente).
      - run: python -m pip install pypi/
      - run: python -m pytest pypi/tests -q
      - run: python -m build pypi
      - run: python -m pip install --force-reinstall pypi/dist/*.whl
      - run: trackfw --version
      - run: |
          tmp_dir=$(mktemp -d)
          cd "$tmp_dir"
          trackfw validate --json

  windows-integrations-resolve:
    # Guard de regressão: o bug de path Windows (manager.js:31, manager.go:398)
    # é invisível em ubuntu-latest porque path.normalize / filepath.Clean não
    # convertem "/" → "\" no Linux.  Este job é o único guard honesto.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Go — integrations resolve (Windows)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./internal/integrations/... -run TestResolveWindowsCrossplatform -v
        env:
          TRACKFW_DISABLE_EXTERNAL_COMMANDS: "1"

      - name: Node — integrations resolve (Windows)
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
        working-directory: npm
      - run: node --test tests/integrations_resolve.test.js
        working-directory: npm

      - name: Python — integrations resolve (Windows)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest pypi/tests/test_integrations_resolve.py -v

  windows-full-suites:
    # Camada 1 do instrumento de medição — ADR-2026-08-30-ci-de-windows-como-
    # instrumento-de-medicao-job-largo-que-nasce-vermelho-mais-sonda-sob-
    # demanda.md, decisão 1/2. As TRÊS suítes completas (go test ./...,
    # npm test, pytest pypi/tests) em windows-latest — sem invocação
    # dirigida (não confundir com o job windows-integrations-resolve acima,
    # que é intocado e continua sendo um guard estreito e honesto).
    #
    # NÃO CORRIGE nada (ADR decisão 7). O critério de aceite é que este job
    # REPROVE reproduzindo os defeitos da issue #216 — um job de Windows que
    # nasce verde não prova nada (foi assim que chegamos aqui).
    #
    # continue-on-error: true é TEMPORÁRIO (AC4) — só remover depois que TODAS
    # as REQs de correção dos 11 itens da issue #216 fecharem. Até lá este
    # job aparece como ⚠️, nunca ❌, e branch protection com "required status
    # checks" não trava PR por causa dele — decisão deliberada para não
    # paralisar trabalho não relacionado. Revisão obrigatória antes de
    # remover: confirmar que os 11 itens estão corrigidos E cobertos por
    # verificação que falhava antes (ADR decisão 7).
    #
    # AC12 — isolação de $HOME/USERPROFILE: pypi/tests/conftest.py e
    # internal/validator/main_test.go isolam via a env var HOME, que a
    # produção NÃO lê no Windows (verificado contra o stdlib: os.UserHomeDir
    # do Go usa exclusivamente %USERPROFILE% no branch "windows" — sem
    # fallback para $HOME —, e ntpath.expanduser do Python idem). Sem
    # mitigação, `go test ./...` escreveria de verdade no perfil do runner, e
    # o Go paraleliza pacotes por padrão: condição de corrida DENTRO da
    # mesma execução (Wave 0, hades-tf — ML-0A). Mitigação aplicada AQUI, no
    # job, não no produto nem nos arquivos de teste (fora do escopo desta
    # ML):
    #   1. USERPROFILE/HOME sobrescritos para um diretório sintético só nos
    #      passos que RODAM as suítes — não no job inteiro, para não
    #      desviar os caches do setup-go/setup-node/pip (por isso
    #      GOPATH/GOMODCACHE/GOCACHE/npm_config_cache/PIP_CACHE_DIR abaixo
    #      são fixados fora do home sintético, e valem para o job inteiro).
    #   2. `go test` roda com -p 1 -parallel 1 e `node --test` com
    #      --test-concurrency=1, eliminando a concorrência ENTRE
    #      pacotes/arquivos de teste que dividiriam o mesmo home sintético.
    #      pytest já é serial por padrão aqui (sem pytest-xdist configurado).
    # Isto NÃO corrige o defeito 2/6 (a produção continua ignorando $HOME em
    # runtime real — a suíte de reprodução, job windows-defect-reproduction
    # abaixo, é que precisa provar isso) — só torna a MEDIÇÃO reproduzível.
    # Um passo de precondição confirma que a isolação vale antes de rodar
    # qualquer suíte; se não valer, as suítes são puladas nesta execução e o
    # job reporta a razão em vez de produzir um resultado não confiável — a
    # suíte de reprodução roda de qualquer forma, independente deste job.
    #
    # RESIDUAL DECLARADO (AC12, sempre vale, não só quando a precondição
    # falha): mesmo com a precondição passando, a mitigação acima NÃO
    # produz isolação POR TESTE — todos os pacotes/arquivos de teste desta
    # execução compartilham UM ÚNICO diretório sintético, sequencialmente,
    # sem limpeza entre eles. Resíduo deixado por um teste pode interferir
    # em outro dentro da mesma execução (mesma classe de problema que a
    # Wave 0 mediu para a home real, só que num diretório descartável em
    # vez do perfil do runner). Uma falha nesta camada sem correspondência
    # clara a um item da issue #216 pode ser efeito colateral disto, não um
    # 12º defeito — triar como resíduo do instrumento antes de assumir
    # achado novo. Corrigir isolação por-teste em
    # pypi/tests/conftest.py e internal/validator/main_test.go (usar
    # USERPROFILE, não só HOME) está fora do escopo desta ML.
    # ML-3A: continue-on-error do job REMOVIDO. Veredito do job = exit code do ratchet (ML-2A/2B).
    # Suítes têm continue-on-error: true no NÍVEL DE STEP — são produtoras de observação.
    # Ratchet não tem continue-on-error — é o juiz. Seu exit code determina o resultado do job.
    # "Camada 1 pulada" agora sai com exit 1 (job sem árbitro não pode passar — vault note).
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Fixar caches fora do home sintético (AC12)
        # env: de JOB não aceita o contexto `runner` (só github, inputs, vars,
        # secrets, strategy, matrix, needs) — por isso este step grava em
        # $GITHUB_ENV, herdado por todos os steps seguintes do job, em vez de
        # um `env:` de job. Continua valendo para o job inteiro, como a AC12
        # exige (setup-go/setup-node/pip incluídos, não só as suítes).
        shell: pwsh
        run: |
          "GOPATH=$env:RUNNER_TEMP\gopath" >> $env:GITHUB_ENV
          "GOMODCACHE=$env:RUNNER_TEMP\gomodcache" >> $env:GITHUB_ENV
          "GOCACHE=$env:RUNNER_TEMP\gocache" >> $env:GITHUB_ENV
          "npm_config_cache=$env:RUNNER_TEMP\npm-cache" >> $env:GITHUB_ENV
          "PIP_CACHE_DIR=$env:RUNNER_TEMP\pip-cache" >> $env:GITHUB_ENV

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
        working-directory: npm
      - run: python -m pip install --upgrade pip pytest
      # Instala o pacote (e suas dependências declaradas em pypi/pyproject.toml,
      # ex. PyYAML>=6.0) para que a suíte pytest completa tenha as libs de
      # runtime disponíveis — mesmo padrão dos jobs `python` (linha 73) e
      # `parity` (linha 407) acima: zero drift, sem hardcodar nomes de
      # dependência aqui. Faltava aqui (ML-1D): o job só instalava pytest,
      # então `python -m pytest pypi/tests` falhava na COLETA de 40 módulos
      # com `ModuleNotFoundError: No module named 'yaml'` antes de exercitar
      # qualquer defeito real da issue #216 — resíduo do instrumento, não a
      # medição pretendida (ver comentário AC12 acima sobre residual do
      # instrumento vs. achado novo).
      - run: python -m pip install pypi/

      - name: Registrar início (AC10)
        shell: pwsh
        run: echo "started=$(Get-Date -AsUTC -Format o)" >> $env:GITHUB_ENV

      - name: Preparar diretório sintético de home (AC12)
        id: home
        shell: pwsh
        # ML-1D — este step é deliberadamente MÍNIMO: cria o diretório e nada
        # mais. A hipótese de que o home sintético vazio quebrava o `git` das
        # fixtures (sem `.gitconfig` global → "Author identity unknown" no
        # `git commit`) foi MEDIDA POR LEITURA e FALSIFICADA: todo helper que
        # commita de verdade nos 3 runtimes seta identidade LOCAL no próprio
        # repositório antes do primeiro commit
        # (internal/validator/validator_test.go:26 initGitRepo,
        # pypi/tests/test_credential_guard_integrity.py:27 _init_git_repo,
        # npm/tests/credential_guard_integrity.test.js:36), e os que exigem
        # config global limpa pinam GIT_CONFIG_GLOBAL num arquivo vazio próprio
        # (internal/commands/branch_prune_test.go:435 e equivalentes). Semear
        # identidade aqui não desbloquearia teste nenhum — só acrescentaria uma
        # variável não medida ao instrumento. Ver o step de sonda abaixo, que é
        # o que converte essa leitura em medição no Windows.
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "winhome"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "home=$dir" >> $env:GITHUB_OUTPUT

      - name: AC12 — confirmar que a isolação de HOME/USERPROFILE vale antes de rodar as suítes
        id: precondition
        shell: pwsh
        continue-on-error: true
        env:
          HOME: ${{ steps.home.outputs.home }}
          USERPROFILE: ${{ steps.home.outputs.home }}
        run: |
          $expected = $env:USERPROFILE
          $failed = $false
          $goHome = (go run scripts/windows-repro/go/checks.go home) 2>&1 | Out-String
          Write-Host "Go   os.UserHomeDir()      -> $($goHome.Trim())"
          if ($goHome.Trim() -ne $expected) { $failed = $true }
          $nodeHome = (node -e "console.log(require('os').homedir())") 2>&1 | Out-String
          Write-Host "Node os.homedir()          -> $($nodeHome.Trim())"
          if ($nodeHome.Trim() -ne $expected) { $failed = $true }
          $pyHome = (python -c "import os; print(os.path.expanduser('~'))") 2>&1 | Out-String
          Write-Host "Py   os.path.expanduser(~) -> $($pyHome.Trim())"
          if ($pyHome.Trim() -ne $expected) { $failed = $true }
          if ($failed) {
            Write-Host "::error::AC12 — a isolação de HOME/USERPROFILE não vale para pelo menos um runtime. Pulando as três suítes completas nesta execução (ver step 'Camada 1 pulada' abaixo)."
            exit 1
          }
          Write-Host "AC12 — isolação confirmada para os 3 runtimes."

      - name: ML-1D — sonda de `git` sob o home sintético (observacional)
        # O ML-1D nasceu da hipótese (REQ AC5) de que
        # `git symbolic-ref --short HEAD exited with null` e
        # `git not found in current $PATH` vinham DESTE job — do home sintético.
        # A leitura das fontes falsifica isso: as duas strings são emitidas por
        # fixtures que SUBSTITUEM o $PATH por um diretório curado contendo um
        # `git` SEM extensão — npm/src/ship/runner.js:124 (spawnSync devolve
        # status null = ENOENT) alcançado por npm/tests/ship.test.js:866,943
        # (`env: { PATH: tmpBin, ... }`), e pypi/tests/test_barrier.py:446, que
        # varre o $PATH procurando um arquivo literalmente chamado `git`. É a
        # classe do ML-1A (PATHEXT do Windows), resolvida em arquivo de TESTE —
        # nenhum $PATH configurado aqui as alcança, porque a fixture descarta o
        # $PATH do job.
        #
        # Esta sonda é o que torna essa conclusão FALSIFICÁVEL no Windows, já
        # que ela foi obtida por leitura: mede, sob exatamente o mesmo
        # HOME/USERPROFILE das três suítes, se o `git` resolve, se um
        # `init/add/commit` completa e se `symbolic-ref --short HEAD` responde.
        # Verde ⇒ o home sintético não é a causa (a conclusão acima se sustenta,
        # e as falhas de `git` devem ser triadas como fixture). Vermelho ⇒ existe
        # um bloqueio de ambiente que a leitura não viu, e o log diz qual.
        #
        # 🔴 continue-on-error + fora do `if:` das suítes, de propósito: esta
        # sonda NUNCA pode virar portão. O único portão de entrada das três
        # suítes continua sendo `steps.precondition.outcome` (AC12); encadear a
        # sonda ali faria testes serem PULADOS — exatamente o que o AC7 da REQ
        # proíbe. Com continue-on-error, o `conclusion` dela é success, então o
        # `success()` implícito do step "Camada 1 pulada" também fica intacto.
        #
        # Roda num repositório descartável em RUNNER_TEMP, FORA do home
        # sintético, para não deixar resíduo no diretório compartilhado pelas
        # suítes (residual declarado da AC12 acima).
        if: always() && steps.precondition.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          HOME: ${{ steps.home.outputs.home }}
          USERPROFILE: ${{ steps.home.outputs.home }}
        run: |
          # O wrapper `shell: pwsh` do GitHub prepende $ErrorActionPreference='stop', e no
          # PowerShell 7.4+ (o do windows-latest) $PSNativeCommandUseErrorActionPreference
          # e $true por padrao: um comando NATIVO que sai != 0 vira erro TERMINANTE. Sem
          # estas duas linhas, um `git commit` que falha mataria o script na hora e o
          # ::warning:: abaixo — a unica razao de esta sonda existir — nunca seria impresso,
          # exatamente na execucao em que ele importa.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $probe = Join-Path $env:RUNNER_TEMP "gitprobe"
          Remove-Item -Recurse -Force -Path $probe -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $probe | Out-Null
          Write-Host "git --version                 -> $((git --version) 2>&1)"
          Write-Host "git config --show-origin --get user.email:"
          Write-Host "  $((git config --show-origin --get user.email) 2>&1)"
          git -C $probe init --quiet
          Set-Content -Path (Join-Path $probe "a.txt") -Value "probe"
          git -C $probe add a.txt
          # Identidade LOCAL, igual ao que todo helper de fixture dos 3 runtimes
          # faz (initGitRepo / _init_git_repo / git(dir,'config',...)) — a sonda
          # mede a MESMA condição que as suítes, não uma mais permissiva.
          git -C $probe config user.email "probe@trackfw.invalid"
          git -C $probe config user.name "probe"
          $commit = (git -C $probe commit -m "probe") 2>&1 | Out-String
          Write-Host $commit
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::ML-1D — 'git commit' falhou sob o home sintético mesmo com identidade local. Existe bloqueio de ambiente que a leitura das fontes não previu: as falhas de git desta execucao NAO devem ser triadas como fixture antes de investigar isto."
          } else {
            $head = (git -C $probe symbolic-ref --short HEAD) 2>&1 | Out-String
            Write-Host "symbolic-ref --short HEAD     -> $($head.Trim())"
            Write-Host "ML-1D — nenhum bloqueio de ambiente detectado: sob este HOME/USERPROFILE o git resolve, commita e responde symbolic-ref. Resultado CONSISTENTE com causa de fixture para as falhas de git desta execucao — nao e prova de que toda falha de git seja de fixture."
          }

      - name: ML-1A — falsificação do discriminante (ambos os braços, 3 runtimes)
        # Prova que o discriminante event-type funciona nas DUAS direções
        # ANTES de usá-lo nos steps de suíte abaixo.
        #
        # Braço 1 (load failure): fixture que não compila/importa → detector deve disparar.
        # Braço 2 (assertion): fixture com asserção falsa → detector NÃO deve disparar.
        #
        # Guarda de vacuidade: para cada braço, verifica que a mutação foi aplicada
        # (string/exit-code esperados aparecem) ANTES de afirmar que o detector funciona.
        # Um probe que não discrimina produz exit 0 no braço errado — o mesmo risco que
        # afetou o windows-census.yml (B1/B2 guards).
        #
        # Fixtures criadas em $env:RUNNER_TEMP — NUNCA no working tree do checkout.
        # git status --porcelain ao final garante que o repo está limpo.
        #
        # ADR: docs/adr/ADR-2026-09-05-o-ci-de-windows-bloqueia-por-conjunto-de-
        # nomes-e-por-tipo-de-evento-nunca-por-contagem.md (D3, D3-bis)
        if: always() && steps.precondition.outcome == 'success'
        shell: pwsh
        env:
          HOME: ${{ steps.home.outputs.home }}
          USERPROFILE: ${{ steps.home.outputs.home }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = 'Continue'
          $script:PASS = 0
          $script:FAIL = 0

          function Assert-True([bool]$cond, [string]$msg) {
            if ($cond) {
              Write-Host "  FALSIFY PASS: $msg"
              $script:PASS++
            } else {
              Write-Host "::error::FALSIFY FAIL: $msg"
              $script:FAIL++
            }
          }

          $tmp = Join-Path $env:RUNNER_TEMP "ml1a-falsify"
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null

          # ─── GO ──────────────────────────────────────────────────────────────
          Write-Host "=== Go braço 1: pacote com erro de sintaxe (load failure) ==="
          $goLoad = Join-Path $tmp "go-load"
          New-Item -ItemType Directory -Force -Path "$goLoad/badpkg" | Out-Null
          Set-Content "$goLoad/go.mod" "module ml1a-probe`n`ngo 1.21"
          # Erro de sintaxe: go toolchain falha em compile-time, sem consultar proxy.
          Set-Content "$goLoad/badpkg/bad_test.go" @"
          package badpkg
          import "testing"
          func TestX(t *testing.T) {
              this is a syntax error
          }
          "@
          $goLoadOut = Join-Path $tmp "go-load-out.txt"
          Push-Location $goLoad
          go test -v -p 1 -parallel 1 -timeout 2m ./... *> $goLoadOut
          $rc_go_load = $LASTEXITCODE
          Pop-Location
          $goLoadContent = Get-Content $goLoadOut -Raw -ErrorAction SilentlyContinue
          # Guarda de vacuidade: sintaxe inválida deve aparecer no output
          Assert-True ($goLoadContent -match 'syntax error' -or $goLoadContent -match 'setup failed') `
            "Go braço1 guarda: output contém 'syntax error' ou 'setup failed' (mutação aplicada)"
          Assert-True ($rc_go_load -ne 0) "Go braço1: load failure retorna exit code != 0"
          $goLoadFails = @(Select-String -Path $goLoadOut -Pattern 'FAIL\t.*\[setup failed\]' -ErrorAction SilentlyContinue)
          Assert-True ($goLoadFails.Count -gt 0) "Go braço1: detector [setup failed] dispara em load failure"

          Write-Host "=== Go braço 2: pacote com asserção falsa (normal failure) ==="
          $goAssert = Join-Path $tmp "go-assert"
          New-Item -ItemType Directory -Force -Path "$goAssert/failpkg" | Out-Null
          Set-Content "$goAssert/go.mod" "module ml1a-probe2`n`ngo 1.21"
          Set-Content "$goAssert/failpkg/fail_test.go" @"
          package failpkg
          import "testing"
          func TestFail(t *testing.T) { t.Errorf("arm2 assertion failure") }
          "@
          $goAssertOut = Join-Path $tmp "go-assert-out.txt"
          Push-Location $goAssert
          go test -v -p 1 -parallel 1 -timeout 2m ./... *> $goAssertOut
          $rc_go_assert = $LASTEXITCODE
          Pop-Location
          Assert-True ($rc_go_assert -ne 0) "Go braço2: asserção falsa retorna exit code != 0"
          $goAssertFails = @(Select-String -Path $goAssertOut -Pattern 'FAIL\t.*\[setup failed\]' -ErrorAction SilentlyContinue)
          Assert-True ($goAssertFails.Count -eq 0) "Go braço2: detector NÃO dispara em asserção falsa"

          # ─── PYTHON ──────────────────────────────────────────────────────────
          Write-Host "=== Python braço 1: import quebrado em módulo de teste (load failure) ==="
          $pyLoad = Join-Path $tmp "py-load"
          New-Item -ItemType Directory -Force -Path $pyLoad | Out-Null
          Set-Content "$pyLoad/test_broken.py" @"
          import no_such_module_ml1a_probe_falsify
          def test_x(): pass
          "@
          $pyLoadOut = Join-Path $tmp "py-load-out.txt"
          python -m pytest $pyLoad -q *> $pyLoadOut
          $rc_py_load = $LASTEXITCODE
          $pyLoadContent = Get-Content $pyLoadOut -Raw -ErrorAction SilentlyContinue
          # Guarda de vacuidade: nome do módulo deve aparecer no output
          Assert-True ($pyLoadContent -match 'no_such_module_ml1a_probe_falsify') `
            "Python braço1 guarda: nome do módulo ausente aparece no output (mutação aplicada)"
          Assert-True ($rc_py_load -eq 2 -or $rc_py_load -eq 4) `
            "Python braço1: load failure detectado por exit code 2 ou 4 (obtido: $rc_py_load)"

          Write-Host "=== Python braço 2: asserção falsa (normal failure) ==="
          $pyAssert = Join-Path $tmp "py-assert"
          New-Item -ItemType Directory -Force -Path $pyAssert | Out-Null
          Set-Content "$pyAssert/test_fail.py" @"
          def test_fail():
              assert 1 == 2, "arm2 assertion failure"
          "@
          $pyAssertOut = Join-Path $tmp "py-assert-out.txt"
          python -m pytest $pyAssert -q *> $pyAssertOut
          $rc_py_assert = $LASTEXITCODE
          Assert-True ($rc_py_assert -eq 1) `
            "Python braço2: asserção falsa retorna exit code 1 (não 2/4)"
          Assert-True ($rc_py_assert -ne 2 -and $rc_py_assert -ne 4) `
            "Python braço2: detector NÃO dispara em asserção falsa (exit code $rc_py_assert)"

          # ─── NODE.JS ─────────────────────────────────────────────────────────
          Write-Host "=== Node braço 1: require quebrado (load failure) ==="
          $nodeLoad = Join-Path $tmp "node-load"
          New-Item -ItemType Directory -Force -Path $nodeLoad | Out-Null
          Set-Content "$nodeLoad/broken.test.js" @"
          const x = require('no_such_module_ml1a_probe_falsify');
          const { test } = require('node:test');
          test('x', () => {});
          "@
          $tapLoad = Join-Path $tmp "node-load.tap"
          node --test --test-concurrency=1 `
            "--test-reporter=spec" "--test-reporter-destination=stdout" `
            "--test-reporter=tap" "--test-reporter-destination=$tapLoad" `
            $nodeLoad 2>&1 | Out-Null
          $rc_node_load = $LASTEXITCODE
          $tapLoadContent = if (Test-Path $tapLoad) { Get-Content $tapLoad -Raw } else { "" }
          # Guarda de vacuidade: exitCode field deve aparecer no TAP
          Assert-True ($tapLoadContent -match 'exitCode:') `
            "Node braço1 guarda: 'exitCode:' aparece no TAP (mutação aplicada — D3-bis)"
          $nodeLoadFails = @(Select-String -Path $tapLoad -Pattern '^\s+exitCode:\s+\d+' -ErrorAction SilentlyContinue)
          Assert-True ($nodeLoadFails.Count -gt 0) `
            "Node braço1: detector exitCode field dispara em load failure"

          Write-Host "=== Node braço 2: asserção falsa (normal failure) ==="
          $nodeAssert = Join-Path $tmp "node-assert"
          New-Item -ItemType Directory -Force -Path $nodeAssert | Out-Null
          Set-Content "$nodeAssert/fail.test.js" @"
          const { test } = require('node:test');
          const assert = require('node:assert');
          test('arm2 assertion failure', () => { assert.strictEqual(1, 2); });
          "@
          $tapAssert = Join-Path $tmp "node-assert.tap"
          node --test --test-concurrency=1 `
            "--test-reporter=spec" "--test-reporter-destination=stdout" `
            "--test-reporter=tap" "--test-reporter-destination=$tapAssert" `
            $nodeAssert 2>&1 | Out-Null
          $rc_node_assert = $LASTEXITCODE
          $tapAssertContent = if (Test-Path $tapAssert) { Get-Content $tapAssert -Raw } else { "" }
          Assert-True ($rc_node_assert -ne 0) "Node braço2: asserção falsa retorna exit code != 0"
          $nodeAssertFails = @(Select-String -Path $tapAssert -Pattern '^\s+exitCode:\s+\d+' -ErrorAction SilentlyContinue)
          Assert-True ($nodeAssertFails.Count -eq 0) `
            "Node braço2: detector NÃO dispara em asserção falsa (exitCode ausente no TAP)"

          # ─── CLEANUP & RESULT ────────────────────────────────────────────────
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue

          $status = git status --porcelain
          if ($status) {
            Write-Host "::error::ML-1A falsify: working tree sujo após a sonda — o job modificou arquivos do repositório"
            exit 1
          }

          Write-Host ""
          Write-Host "ML-1A falsify: $($script:PASS) PASS · $($script:FAIL) FAIL"
          if ($script:FAIL -gt 0) { exit 1 }

      - name: Go — suíte completa (camada 1, AC1)
        # always() && <condição>: sem always() aqui, o GitHub Actions
        # prepende success() implicitamente a qualquer if: sem função de
        # status (doc oficial) — então, quando o step Go falha, os steps
        # Node/Python seguintes eram pulados mesmo com
        # `steps.precondition.outcome == 'success'` == true, porque o
        # success() implícito já era falso (medido no PR #221, run
        # 33322373895: Go -> failure, Node/Python -> skipped). always()
        # substitui esse success() implícito por "sempre avalia minha
        # condição", preservando a precondição da AC12 como ÚNICO portão de
        # entrada — não é um always() cego (não roda quando a precondição
        # falhou).
        if: always() && steps.precondition.outcome == 'success'
        # ML-3A: step-level continue-on-error — suíte é produtora de observação, não o juiz.
        # Falhas de asserção (os 14 conhecidos) são absorvidas aqui e entregues ao ratchet
        # via go-suite-out.txt. Suite-load-failure escreve marcador adicional (ver abaixo).
        continue-on-error: true
        shell: pwsh
        env:
          HOME: ${{ steps.home.outputs.home }}
          USERPROFILE: ${{ steps.home.outputs.home }}
          TRACKFW_DISABLE_EXTERNAL_COMMANDS: "1"
        # -v (ML-4A, 2026-09-04): sem ele o `go test` bufferiza e DESCARTA a saída de
        # pacote que passa — e os testes com supressão de bit de execução passam
        # justamente POR CAUSA da supressão. Medido: 0 ocorrências da mensagem sem
        # -v, 13 com. O critério "toda supressão nomeia a garantia não exercitada"
        # era vácuo no Go sem esta flag: a mensagem existia e ninguém a lia.
        # `t.Logf` e `os.Stderr` dão 0 igualmente — as duas foram medidas.
        #
        # ML-1A: captura saída para classificar falhas por tipo de evento.
        # Discriminante: linha "FAIL\t<pkg> [setup failed]" — evento de toolchain que
        # indica que o pacote NÃO compilou; nenhum teste rodou.
        # Medido: Go 1.25.2/macOS arm64 com as flags exatas do CI.
        # [setup failed] é string estável desde Go 1.17 (toolchain, não runtime).
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $outFile = Join-Path $env:RUNNER_TEMP "go-suite-out.txt"
          go test -v -p 1 -parallel 1 -timeout 20m ./... *> $outFile
          $rc = $LASTEXITCODE
          Get-Content $outFile
          # Classificar por tipo de evento, nunca por contagem (ADR D3).
          $loadFails = @(Select-String -Path $outFile -Pattern 'FAIL\t.*\[setup failed\]' -ErrorAction SilentlyContinue)
          if ($loadFails.Count -gt 0) {
            $lines = ($loadFails | ForEach-Object { $_.Line.Trim() }) -join ' ; '
            Write-Host "::error::Go suite-load-failure: $($loadFails.Count) pacote(s) não compilou (evento: [setup failed], não ERR_ASSERTION). Pacotes: $lines"
            # ML-3A: marcador de classe própria. Step-level continue-on-error absorve o exit
            # code da suíte, mas não o marcador. O ratchet lê este arquivo via
            # --load-markers-dir e reprova o job (vault note: não consegui procurar → fatal).
            $lines | Set-Content "$env:RUNNER_TEMP\suite-load-failure.go.txt" -Encoding utf8
          }
          exit $rc

      - name: Node — suíte completa (camada 1, AC1)
        # always() && <condição>: ver comentário no step "Go — suíte
        # completa" acima — mesmo motivo, mesma correção (ML-1C).
        if: always() && steps.precondition.outcome == 'success'
        # ML-3A: step-level continue-on-error — suíte é produtora de observação, não o juiz.
        continue-on-error: true
        shell: pwsh
        working-directory: npm
        env:
          HOME: ${{ steps.home.outputs.home }}
          USERPROFILE: ${{ steps.home.outputs.home }}
        # SEM argumento de caminho, de propósito: com Node 20/26 testados
        # localmente, `node --test tests/` (positional de diretório) falha
        # com MODULE_NOT_FOUND — parece tratar o positional como um módulo a
        # exigir, não como raiz de descoberta, nesta versão. `node --test`
        # (sem positional) usa a descoberta padrão a partir do cwd e achou os
        # MESMOS 839 testes que `npm test` (verificado localmente) — mesma
        # suíte completa, não um filtro (não é a regressão "sem invocação
        # dirigida" que a Wave 0 e o AC1 proíbem).
        #
        # ML-1A: multi-reporter — spec→stdout (legível humano) + tap→arquivo
        # (para classificação por tipo de evento). --test-reporter-destination
        # disponível desde Node 20.0.0 (versão pinada neste job).
        # Discriminante D3-bis: campo "exitCode:" presente num bloco "not ok" do TAP
        #   presente  → processo do arquivo morreu antes de rodar testes → suite-load-failure
        #   ausente   → asserção ou throw DENTRO do teste → normal failure
        # Versão local medida: Node 26.8.1/macOS arm64.
        # ADR adendum: Node 22/Windows 11. Node 20/windows-latest: NÃO MEDIDO diretamente.
        # Formato TAP estável entre Node 22 e 26; extrapolado para Node 20.
        # Zero-test: exit 0 + "# tests 0" → pior modo — indistinguível de sucesso pelo exit code.
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $tapFile = Join-Path $env:RUNNER_TEMP "node-suite.tap"
          node --test --test-concurrency=1 `
            "--test-reporter=spec" "--test-reporter-destination=stdout" `
            "--test-reporter=tap" "--test-reporter-destination=$tapFile"
          $rc = $LASTEXITCODE
          if (Test-Path $tapFile) {
            # Classificar por tipo de evento (campo exitCode), nunca por contagem (ADR D3/D3-bis).
            $loadFails = @(Select-String -Path $tapFile -Pattern '^\s+exitCode:\s+\d+' -ErrorAction SilentlyContinue)
            if ($loadFails.Count -gt 0) {
              Write-Host "::error::Node.js suite-load-failure: $($loadFails.Count) arquivo(s) não carregou (evento: campo exitCode em bloco not-ok do TAP, não ERR_ASSERTION — ADR D3-bis)"
              # ML-3A: marcador de classe própria para o ratchet.
              ($loadFails | ForEach-Object { $_.Line.Trim() }) -join ' ; ' | Set-Content "$env:RUNNER_TEMP\suite-load-failure.node.txt" -Encoding utf8
            }
            $zeroLine = Select-String -Path $tapFile -Pattern '^# tests 0$' -ErrorAction SilentlyContinue
            if ($zeroLine -and $rc -eq 0) {
              Write-Host "::error::Node.js zero-test-failure: nenhum teste descoberto (exit 0 + # tests 0) — pior modo: indistinguível de sucesso pelo exit code"
              # ML-3A: marcador de zero-test para o ratchet.
              "zero-test" | Set-Content "$env:RUNNER_TEMP\zero-test-failure.node.txt" -Encoding utf8
            }
          }
          exit $rc

      - name: Python — suíte completa (camada 1, AC1)
        # always() && <condição>: ver comentário no step "Go — suíte
        # completa" acima — mesmo motivo, mesma correção (ML-1C).
        if: always() && steps.precondition.outcome == 'success'
        # ML-3A: step-level continue-on-error — suíte é produtora de observação, não o juiz.
        continue-on-error: true
        shell: pwsh
        env:
          HOME: ${{ steps.home.outputs.home }}
          USERPROFILE: ${{ steps.home.outputs.home }}
        # ML-1A: classificar por exit code (tipo de evento, não contagem).
        # Protocolo pytest (estável desde pytest 3.x; projeto usa 7.x):
        #   0 = todos passaram                                         → não é falha
        #   1 = falhas de asserção                                     → normal-failure
        #   2 = interrompido durante coleta (import error no módulo)   → suite-load-failure
        #   3 = erro interno durante execução                          → suite-load-failure
        #   4 = erro interno (conftest.py não importa)                 → suite-load-failure
        #   5 = nenhum teste coletado                                  → zero-test-failure
        # Medido: Python 3.14.7/macOS arm64. CI usa Python 3.12.
        # Protocolo de exit code estável entre essas versões.
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          # ML-2A: captura saída para extração de nomes de falhas pelo ratchet.
          # python-suite-out.txt é lido pelo step "ML-2A — ratchet de nomes" abaixo.
          $outFile = Join-Path $env:RUNNER_TEMP "python-suite-out.txt"
          # ML-2B: -rA flag adds 'PASSED pypi/tests/...' lines to the short summary,
          # enabling the corrected-vs-no-longer-runs discriminant for Python.
          # Measured (2026-09-10, macOS arm64): pytest -q -rA emits
          # 'PASSED pypi/tests/test_foo.py::Class::method' in the short summary section.
          # Without -rA, no PASSED lines appear and the discriminant is absent.
          python -m pytest pypi/tests -q -rA *> $outFile
          $rc = $LASTEXITCODE
          Get-Content $outFile
          # Classificar por tipo de evento, nunca por contagem (ADR D3).
          if ($rc -eq 2 -or $rc -eq 3 -or $rc -eq 4) {
            Write-Host "::error::Python suite-load-failure: suíte interrompida ou não carregou (evento: exit code $rc — pytest collection/internal error, não asserção)"
            # ML-3A: marcador de classe própria para o ratchet.
            "python-suite-load-failure (exit code $rc)" | Set-Content "$env:RUNNER_TEMP\suite-load-failure.python.txt" -Encoding utf8
          } elseif ($rc -eq 5) {
            Write-Host "::error::Python zero-test-failure: nenhum teste coletado (exit code 5)"
            # ML-3A: marcador de zero-test para o ratchet.
            "python-zero-test-failure (exit code 5)" | Set-Content "$env:RUNNER_TEMP\zero-test-failure.python.txt" -Encoding utf8
          }
          exit $rc

      - name: ML-2B — extrair baseline para verificação de remoções (D4)
        # ADR D4: toda entrada removida da lista declara o motivo (removal_note).
        # O baseline (estado atual de origin/main) permite detectar entradas
        # deletadas sem passar pelo array 'removed'.
        #
        # Raiz do defeito (corretivo ML-2B, 2026-09-10): actions/checkout@v7 sem
        # 'with:' usa fetch-depth: 1 e busca APENAS o branch do PR — origin/main
        # nunca é escrito como ref remota. `git show origin/main:...` falha com
        # "unknown revision", não porque o arquivo está ausente na main, mas porque
        # a REF não existe. Dois estados distintos (ref ausente / arquivo ausente)
        # geravam o mesmo observable (silêncio + aviso genérico) e a mesma mensagem
        # errada "normal em PRs que adicionam o arquivo pela primeira vez".
        # Terceira ocorrência do padrão dois-estados-um-observable neste projeto
        # (anterior: #307 git-vs-interpretador, #274 suíte-que-não-carrega).
        #
        # Correção: fetch incondicionalmente com refspec explícito (config-independente).
        # Custo medido localmente: 0.09 s (1 commit + árvore, objeto único, < 1 MB).
        # No runner do GitHub Actions (LAN-class vs. mesmo DC) custo comparável.
        # fetch-depth: 0 (histórico completo) custa N commits × objetos — rejeitado.
        # O fetch pontual é suficiente porque apenas `git show origin/main:...` e
        # `git ls-tree origin/main` precisam do ref; nenhum outro step do job usa
        # `git log`, `git describe` ou ancestralidade.
        #
        # Dois estados distintos, mensagens distintas (Falsificação):
        #   Braço 1 — ref ausente (fetch falhou ou ref inválida): ::error:: + exit 1.
        #             "Fatal" = exit 1 no step; o job continua enquanto
        #             continue-on-error: true estiver ativo (ML-3A). Visível como
        #             ##[error] no log do runner.
        #   Braço 2 — ref presente + arquivo ausente na main (este PR adiciona o
        #             arquivo): ::warning:: + exit 0 (step passa).
        #   Braço 3 — ref presente + arquivo presente: baseline extraído, D4 ativa.
        #             check-windows-known-failures.py emite 'ML-2B D4 (baseline):
        #             N entrada(s) comparadas' (T15) — ausência dessa linha = D4
        #             não rodou de verdade.
        if: always() && steps.precondition.outcome == 'success'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $baselineFile = Join-Path $env:RUNNER_TEMP "baseline-known-failures.json"

          # Fetch origin/main unconditionally with explicit refspec.
          # Bare branch name (fetch origin main) writes only FETCH_HEAD, which
          # depends on remote.origin.fetch; the explicit refspec is config-independent.
          Write-Host "ML-2B (baseline): fetching origin/main (depth=1, no-tags)..."
          git fetch --depth=1 --no-tags origin "+refs/heads/main:refs/remotes/origin/main" 2>&1
          $fetchExit = $LASTEXITCODE

          $refVerify = git rev-parse --verify origin/main 2>&1
          if ($LASTEXITCODE -ne 0 -or $fetchExit -ne 0) {
            # Braço 1: ref indisponível — gate não pode fingir que rodou.
            Write-Host "::error::ML-2B (baseline): origin/main indisponível após fetch (fetch exit=$fetchExit, rev-parse exit=$LASTEXITCODE) — verificação de remoções (D4) não pode rodar. Gate não pode fingir que rodou."
            exit 1
          }

          # Distinguir: ref existe mas arquivo ausente na main.
          $fileInMain = git ls-tree origin/main -- .github/windows-known-failures.json 2>&1
          if ([string]::IsNullOrWhiteSpace($fileInMain)) {
            # Braço 2: arquivo adicionado por este PR, ainda não mergeado na main.
            Write-Host "::warning::ML-2B (baseline): windows-known-failures.json ausente em origin/main — verificação de remoções por baseline desabilitada (arquivo adicionado por este PR, ainda não mergeado)."
            exit 0
          }

          # Braço 3: ref e arquivo presentes — extrair baseline.
          git show origin/main:.github/windows-known-failures.json > $baselineFile
          if ($LASTEXITCODE -ne 0 -or (Get-Item $baselineFile -ErrorAction SilentlyContinue).Length -eq 0) {
            Write-Host "::error::ML-2B (baseline): ls-tree listou o arquivo mas extração falhou — baseline não disponível."
            exit 1
          }
          $sz = (Get-Item $baselineFile).Length
          Write-Host "ML-2B (baseline): $sz bytes extraídos de origin/main — verificação de remoções (D4) ativa."

      - name: ML-2A/2B — ratchet de nomes e verificação de remoções
        # ML-2A — ADR D1: falha se nome novo aparecer fora da lista; avisa quando
        # nome da lista deixa de falhar (mas NÃO reprova — corrigir um teste não
        # pode quebrar o CI).
        #
        # ML-2B — ADR D4: verifica entradas no array 'removed':
        #   - toda entrada retirada de 'entries' deve estar em 'removed' (baseline)
        #   - removal_note obrigatório (corrected | renamed | no-longer-runs)
        #   - corrected: nome deve aparecer em '--- PASS:' / 'ok N -' / 'PASSED'
        #   - renamed: renamed_to deve apontar para uma entrada ativa
        #
        # Guarda de vacuidade (lista): lista vazia ou ausente → exit 1.
        # Guarda de vacuidade (artefatos): artefato ausente → exit 1.
        # Contagem — nunca como critério (ADR D1): o exit code vem exclusivamente
        # da comparação de conjuntos.
        #
        # ML-3A: este step é o juiz do job (continue-on-error do job removido).
        # Seu exit code determina o resultado do job para os cenários de asserção
        # e suite-load-failure por nome. Marcadores de suite-load-failure/zero-test
        # (classe própria, ML-1A) são verificados via --load-markers-dir: se qualquer
        # marcador existir em RUNNER_TEMP, o ratchet reprova diretamente (vault note:
        # não consegui procurar → fatal). Guarda de vacuidade de resultado: se um
        # artefato existir mas não contiver linhas de resultado, também reprova.
        if: always() && steps.precondition.outcome == 'success'
        shell: pwsh
        run: |
          $baselineFile = Join-Path $env:RUNNER_TEMP "baseline-known-failures.json"
          python scripts/check-windows-known-failures.py `
            --list .github/windows-known-failures.json `
            --go-out  "$env:RUNNER_TEMP\go-suite-out.txt" `
            --node-tap "$env:RUNNER_TEMP\node-suite.tap" `
            --python-out "$env:RUNNER_TEMP\python-suite-out.txt" `
            --baseline "$baselineFile" `
            --load-markers-dir "$env:RUNNER_TEMP"

      - name: Camada 1 pulada — AC12 impediu execução segura
        if: steps.precondition.outcome != 'success'
        shell: pwsh
        run: |
          # ML-3A: job cujo árbitro não rodou não pode passar (vault note: dois-estados-um-observable).
          # Antes do ML-3A, o job-level continue-on-error tornava isso um warning silencioso.
          # Com ML-3A, a única saída honesta é reprovar: o ratchet não rodou, portanto o
          # job não tem veredito — e um job sem veredito é indistinguível de um job que passou.
          # A suíte de reprodução de defeito (job windows-defect-reproduction) roda independentemente.
          # Residual declarado: isolação por-teste em pypi/tests/conftest.py e
          # internal/validator/main_test.go ausente no Windows — fora do escopo desta ML.
          Write-Host "::error::ML-3A: Camada 1 (as três suítes completas) foi pulada porque a precondição de isolação de HOME/USERPROFILE falhou (AC12). O ratchet não rodou. Job cujo árbitro não rodou não pode passar."
          exit 1

      - name: Registrar duração (AC10)
        if: always()
        shell: pwsh
        run: |
          $start = [DateTimeOffset]::Parse($env:started)
          $elapsed = [DateTimeOffset]::UtcNow - $start
          $msg = "Duração medida do job windows-full-suites: $($elapsed.ToString())"
          Write-Host $msg
          if ($env:GITHUB_STEP_SUMMARY) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## AC10 — tempo do job`n`n$msg" }

  windows-defect-reproduction:
    # Camada 2 do instrumento — ADR decisão 6/AC2/AC2b/AC3. Uma verificação
    # por defeito conhecido da issue #216, mapeada 1:1, exercitando o
    # caminho real de produção — sem mock. É ESTA que precisa nascer
    # vermelha: a Wave 0 (hades-tf, ML-0A) mediu que as três suítes completas
    # sozinhas (job windows-full-suites acima) só expõem 2 dos 11 itens com
    # confiança direta — entregar só elas produziria falsa sensação de
    # cobertura sobre os outros 9. Ver scripts/windows-repro/run.ps1 para o
    # mapeamento completo item a item (comentário de cabeçalho do arquivo).
    #
    # continue-on-error: true é TEMPORÁRIO (AC4), mesmo motivo e mesmo
    # critério de remoção do job windows-full-suites acima.
    #
    # NÃO CORRIGE nada (ADR decisão 7): uma verificação que passar quando
    # deveria reproduzir o defeito é achado (defeito ausente/já corrigido, ou
    # a verificação está errada) — nunca motivo para alterar código de
    # produto neste job.
    #
    # Independente do job windows-full-suites: não compartilha `needs`, não
    # depende do resultado dele. Roda mesmo se a camada 1 for pulada por
    # AC12.
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Fixar caches fora do home sintético (AC12)
        # Mesmo motivo do job windows-full-suites acima: env: de JOB não
        # aceita o contexto `runner` — só env: de step, with: e run: o
        # aceitam. Step de setup gravando em $GITHUB_ENV replica o efeito de
        # um env: de job (vale para todos os steps seguintes) sem violar o
        # schema.
        shell: pwsh
        run: |
          "GOPATH=$env:RUNNER_TEMP\gopath" >> $env:GITHUB_ENV
          "GOMODCACHE=$env:RUNNER_TEMP\gomodcache" >> $env:GITHUB_ENV
          "GOCACHE=$env:RUNNER_TEMP\gocache" >> $env:GITHUB_ENV
          "npm_config_cache=$env:RUNNER_TEMP\npm-cache" >> $env:GITHUB_ENV
          "PIP_CACHE_DIR=$env:RUNNER_TEMP\pip-cache" >> $env:GITHUB_ENV

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
        working-directory: npm
      - run: python -m pip install --upgrade pip
      # Instala o pacote (e suas dependências declaradas em pypi/pyproject.toml,
      # ex. PyYAML>=6.0) para que checks.py tenha as libs de runtime
      # disponíveis — mesmo padrão dos jobs `python` (linha 73), `parity`
      # (linha 407) e `windows-full-suites` (linha 219) acima: zero drift,
      # sem hardcodar nomes de dependência aqui. Faltava aqui (achado
      # bloqueante da barreira de qualidade, 2026-08-30): o job instalava
      # `pyyaml` por nome, desacoplado de pyproject.toml — uma segunda
      # dependência de runtime entrando no pacote sem editar esta linha faria
      # `import trackfw.cli` morrer com ModuleNotFoundError antes de alcançar
      # qualquer ponto medido pelos itens 1/4/5/6, reportando ABSENT por
      # vacuidade (mesmo mecanismo que o ML-1D já corrigiu na camada 1).
      - run: python -m pip install pypi/

      - name: Registrar início (AC10)
        shell: pwsh
        run: echo "started=$(Get-Date -AsUTC -Format o)" >> $env:GITHUB_ENV

      - name: Suíte de reprodução de defeito — 11 itens da issue #216 (AC2, AC2b, AC3)
        shell: pwsh
        run: pwsh -File scripts/windows-repro/run.ps1

      - name: Registrar duração (AC10)
        if: always()
        shell: pwsh
        run: |
          $start = [DateTimeOffset]::Parse($env:started)
          $elapsed = [DateTimeOffset]::UtcNow - $start
          $msg = "Duração medida do job windows-defect-reproduction: $($elapsed.ToString())"
          Write-Host $msg
          if ($env:GITHUB_STEP_SUMMARY) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## AC10 — tempo do job`n`n$msg" }

  # ML-2G (ROADMAP-2026-09-06-perfil-e-aceleracao-do-check-gates-falsify-sem-
  # perder-cobertura.md): shards de check-gates-falsify.sh como JOBS de
  # matriz, um por VM própria (4 vCPUs cada), em vez de processos em
  # background dentro de UM job (isso já existia -- ML-2D,
  # scripts/run-gates-falsify-parallel.sh, ainda usado por `make parity`
  # local via `make parity-falsify`). Mesmo gerador dos dois mecanismos:
  # scripts/gen-falsify-chunks.py <fonte> <dir> <n> -- "o mesmo mecanismo que
  # distribui entre processos distribui entre jobs" (decisão do roadmap).
  #
  # Isolamento entre shards: cada um é uma VM efêmera própria do GitHub
  # Actions -- isolamento de processo/filesystem/ambiente mais forte que o
  # dos processos-irmãos do ML-2D (que compartilhavam GOPATH/GOCACHE/
  # GOMODCACHE do runner). Estado potencialmente compartilhado entre shards
  # AQUI: nenhum -- nem cache do actions/setup-go (este job, como o job
  # `parity` original, nunca setou cache:true) nem artefato de build; cada
  # shard baixa suas próprias deps e builda seu próprio bin/trackfw do zero.
  parity-falsify-shard:
    runs-on: ubuntu-latest
    needs: [go, node, python, package-smoke, windows-integrations-resolve]
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
        working-directory: npm
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pypi/
      - name: Grau da matriz bate com FALSIFY_SHARD_COUNT (guarda contra drift)
        run: |
          if [ "${{ strategy.job-total }}" != "${{ env.FALSIFY_SHARD_COUNT }}" ]; then
            echo "::error::strategy.job-total=${{ strategy.job-total }} != FALSIFY_SHARD_COUNT=${{ env.FALSIFY_SHARD_COUNT }} -- atualize a lista 'matrix.shard' acima e o env FALSIFY_SHARD_COUNT juntos"
            exit 1
          fi
      - run: go build -o bin/trackfw ./cmd/trackfw
      - name: Shard ${{ matrix.shard }} de check-gates-falsify.sh
        run: scripts/run-gates-falsify-shard.sh
        env:
          TRACKFW_DISABLE_EXTERNAL_COMMANDS: "1"
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ env.FALSIFY_SHARD_COUNT }}
          OUTPUT_DIR: falsify-shard-out
      # if: always() -- sobe o log/rótulos mesmo se o shard reprovou: é
      # exatamente o que o job de agregação `parity` precisa para NOMEAR
      # qual shard falhou (em vez de só herdar um "algo falhou" genérico).
      - name: Upload dos rótulos emitidos por este shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: falsify-shard-${{ matrix.shard }}
          path: falsify-shard-out/
          retention-days: 7

  # ML-2G: os ~45 gates de `parity` que NÃO são check-gates-falsify.sh --
  # rodam uma vez só, aqui, em paralelo com os 4 shards acima. Ver Makefile
  # (alvo `parity-rest`) para a lista completa e a justificativa da divisão.
  parity-other-gates:
    runs-on: ubuntu-latest
    needs: [go, node, python, package-smoke, windows-integrations-resolve]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
        working-directory: npm
      # Instala o pacote (e suas dependências declaradas em pypi/pyproject.toml,
      # ex. PyYAML) para que os scripts de paridade, que invocam o CLI Python a
      # partir do código-fonte via PYTHONPATH, tenham as libs de runtime
      # disponíveis. PYTHONPATH é preposto ao sys.path, então o código
      # importado continua sendo o do repositório — só as deps de runtime vêm
      # do pacote instalado. Mesmo padrão do job `python` (zero drift: nomes
      # de dependência não são hardcodados aqui).
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pypi/
      - run: make parity-rest
        env:
          TRACKFW_DISABLE_EXTERNAL_COMMANDS: "1"

  # ML-2G -- job de AGREGAÇÃO. Mantém o id `parity` DELIBERADAMENTE — nunca
  # renomear nem transformar em matriz.
  #
  # POR QUÊ (medido, não suposto): `gh api repos/kgsaran/trackfw/branches/
  # main/protection` mostra required_status_checks.contexts incluindo
  # "parity" (strict:false), por NOME. Se este job virasse matriz, o GitHub
  # reportaria checks "parity (0)"/"parity (1)"/... e NENHUM check chamado
  # exatamente "parity" jamais reportaria — todo PR ficaria PENDENTE para
  # sempre no check obrigatório (não vermelho: simplesmente nunca chega).
  # É a mesma preocupação que o comentário histórico abaixo (2026-09-03)
  # já tinha registrado como razão para não shardar — permanece válida para
  # um job que vira matriz; deixa de valer para um job de AGREGAÇÃO que
  # preserva o nome e depende (`needs:`) dos jobs que viraram matriz.
  #
  # Nota histórica (VENCIDA nas contas, mantida por registrar a decisão
  # certa no momento em que foi tomada -- mesmo precedente do comentário do
  # ML-2D em run-gates-falsify-parallel.sh): medido em 2026-09-03, "matriz de
  # shards ganha só ~19%, porque o piso é check-gates-falsify sozinho" — essa
  # conta assumia UM job de matriz substituindo `parity` inteiro, sem separar
  # os outros gates para um job concorrente próprio (o desenho `parity-other-
  # gates` acima). Também antecedia o ML-2D (paralelismo em processo já
  # embutido em `make parity`/`parity-falsify`, que muda o piso de 610s).
  #
  # if: always() é necessário para o job RODAR mesmo quando um `needs`
  # falhou (senão o GitHub pula `parity` inteiro e o check obrigatório nunca
  # reporta -- o mesmo problema do parágrafo acima, por outro caminho). Mas
  # `if: always()` sozinho faz o job PASSAR por padrão quando pulado ou
  # quando um needs falhou -- por isso o primeiro step abaixo falha
  # explicitamente nesse caso, antes de qualquer outra coisa rodar.
  # ML-4B corretivo (ROADMAP-2026-09-06-ratchet-por-nome-e-classe-propria-para-suite-que-nao-carrega):
  # Verifica que a declaração local (.github/required-status-checks.txt) concorda com os checks
  # que os workflows podem realmente emitir — escopo D\W apenas (sem chamada à API).
  #
  # Escopo dw: GITHUB_TOKEN não tem permissão para ler /branches/main/protection em CI
  # (medido: run 34605163678, PR #317 — retornou 404 "Resource not found").
  # A verificação completa D/R/W (incluindo D\R e R\W) usa 'make check-required-full',
  # que requer credencial de mantenedor e é pré-condição da rotina de release
  # (ver CLAUDE.md §Protocolo de Release, passo 3.5).
  # D\R e R\W não verificados nesta execução — declarado explicitamente na saída do gate.
  check-required-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - name: ML-4B autoteste (10 bracos de falsificacao, incluindo scope dw)
        run: python3 scripts/check-required-status-checks.py --self-test
      - name: ML-4B verificacao D\W — declared vs workflow checks (scope dw, sem token)
        run: python3 scripts/check-required-status-checks.py --scope dw

  parity:
    runs-on: ubuntu-latest
    needs: [parity-falsify-shard, parity-other-gates, check-required-checks]
    if: always()
    steps:
      - name: Nenhum job de needs pode ter falhado ou sido cancelado
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::pelo menos um job de needs (parity-falsify-shard, parity-other-gates ou check-required-checks) falhou ou foi cancelado -- ver os jobs acima. if:always() aqui existe para RODAR e REPROVAR, nunca para mascarar."
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Baixa os rótulos emitidos por cada shard de falsify
        uses: actions/download-artifact@v4
        with:
          pattern: falsify-shard-*
          path: falsify-shard-artifacts
          merge-multiple: true
      # Guarda de CONJUNTO entre shards -- generalização do ML-2D para job.
      # Os rótulos ESPERADOS são recalculados AQUI, a partir do checkout
      # FRESCO deste job (nunca de algo que um shard alega ter esperado) --
      # só os rótulos EMITIDOS (fato observado, baixado dos artefatos) vêm
      # dos shards. Evita, em escala de job, o defeito auto-referencial que
      # o hades-tf achou no ML-2D em escala de processo.
      - name: Guarda de conjunto entre os shards de falsify
        run: scripts/check-falsify-shard-coverage.sh scripts/check-gates-falsify.sh "${{ env.FALSIFY_SHARD_COUNT }}" falsify-shard-artifacts

  # ---------------------------------------------------------------------------
  # AC1 — console cp1252 (REQ-2026-09-11-o-ciclo-testa-onde-funciona...)
  #
  # Roda o self-test do ratchet de Windows (check-windows-known-failures.py)
  # com o console simulado como cp1252 (PYTHONIOENCODING=cp1252, PYTHONUTF8=0).
  # O self-test exercita _st_print — o caminho que o #314 crashava com
  # UnicodeEncodeError antes do fix.
  #
  # DECLARAÇÃO DE RECONCILIAÇÃO: Este job afirma que _st_print codifica com
  # errors="replace" em vez de crashar quando o codec é cp1252 e o caractere é
  # U+2192 (→). Medição local (2026-09-11): com fix → exit 0; sem fix →
  # UnicodeEncodeError. Ver ML-1A do roadmap.
  #
  # CONTRA-BRAÇO (AC6): PYTHONIOENCODING=cp1252 é o ambiente; o self-test tem
  # 43 casos incluindo T1-T26 que usam descricões com → (U+2192). Se _st_print
  # fosse plain print(), 9+ casos crashariam antes de chegar ao resultado.
  # ---------------------------------------------------------------------------
  windows-gates-cp1252:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: "AC1 — self-test com codepage cp1252 (PYTHONIOENCODING=cp1252, PYTHONUTF8=0)"
        shell: bash
        run: |
          PYTHONIOENCODING=cp1252 PYTHONUTF8=0 python scripts/check-windows-known-failures.py --self-test

  # ---------------------------------------------------------------------------
  # AC2 — Windows SEM Developer Mode / symlink privilege
  # (REQ-2026-09-11-o-ciclo-testa-onde-funciona...)
  #
  # Tenta desabilitar o Developer Mode via registro (AllowDevelopmentWithoutDevLicense=0),
  # verifica com guarda de vacuidade que os.Symlink de fato FALHA após a modificação,
  # e então roda os testes do caminho de erro de symlink.
  #
  # DECLARAÇÃO DE RECONCILIAÇÃO: Este job afirma que o ambiente exercita o caminho
  # de `os.Symlink` com privilege negado. Se não conseguir negar o privilege
  # (vacuidade), o job REPROVA — nunca dá falsa cobertura.
  #
  # LIMITAÇÃO DECLARADA (ML-1B): Não é possível verificar localmente se o runner
  # GitHub hospedado permite modificar HKLM:\...\AppModelUnlock. Se não permitir,
  # a guarda de vacuidade ativa e o job reprova com mensagem declarada. Cobertura
  # fingida é impossível pelo design da guarda.
  # ---------------------------------------------------------------------------
  windows-symlink-unprivileged:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: "AC2 — Tentar desabilitar Developer Mode via registro"
        shell: pwsh
        run: |
          $regPath = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          try {
            if (-not (Test-Path $regPath)) {
              New-Item -Path $regPath -Force | Out-Null
            }
            Set-ItemProperty -Path $regPath -Name "AllowDevelopmentWithoutDevLicense" -Value 0 -Type DWord -Force
            $val = (Get-ItemProperty -Path $regPath -Name "AllowDevelopmentWithoutDevLicense" -ErrorAction SilentlyContinue).AllowDevelopmentWithoutDevLicense
            Write-Host "Registry: AllowDevelopmentWithoutDevLicense = $val"
          } catch {
            Write-Host "::warning::Modificação de registro falhou: $($_.Exception.Message)"
            Write-Host "::warning::Developer Mode pode continuar ativo — guarda de vacuidade irá detectar."
          }

      - name: "AC2 — Guarda de vacuidade: verificar que os.Symlink falha após tentativa de desabilitar"
        shell: bash
        run: |
          set -euo pipefail
          TMPDIR_PROBE=$(mktemp -d)
          trap 'rm -rf "$TMPDIR_PROBE"' EXIT

          cat > "$TMPDIR_PROBE/probe.go" << 'GOEOF'
          package main

          import (
            "fmt"
            "os"
          )

          func main() {
            target := os.TempDir() + "/symlink-probe-target"
            link := os.TempDir() + "/symlink-probe-link"
            // Create target file
            os.WriteFile(target, []byte("probe"), 0644)
            defer os.Remove(target)
            defer os.Remove(link)

            err := os.Symlink(target, link)
            if err != nil {
              fmt.Printf("os.Symlink failed (privilege denied — expected): %v\n", err)
              os.Exit(0)  // failed = privilege was denied = vacuity guard passes
            }
            // Symlink succeeded — Developer Mode is still active
            fmt.Println("os.Symlink succeeded — Developer Mode still active")
            os.Exit(1)  // succeeded = vacuity guard FAILS — no real coverage
          }
          GOEOF

          cat > "$TMPDIR_PROBE/go.mod" << 'MODEOF'
          module symlink-probe
          go 1.21
          MODEOF

          echo "=== Guarda de vacuidade AC2 ==="
          VACUITY_RC=0
          (cd "$TMPDIR_PROBE" && go run probe.go) || VACUITY_RC=$?

          if [[ $VACUITY_RC -ne 0 ]]; then
            echo "::error::AC2 GUARDA DE VACUIDADE FALHOU: os.Symlink ainda tem sucesso após tentativa de desabilitar Developer Mode. Nenhuma cobertura real do caminho sem privilégio. Isso é uma LIMITAÇÃO DECLARADA (ML-1B): o runner não permite revogar o privilégio de symlink. O ambiente esperado não está disponível neste runner."
            exit 1
          fi
          echo "AC2 guarda de vacuidade: PASS — os.Symlink falhou como esperado"

      - name: "AC2 — Rodar testes do caminho de erro de symlink"
        shell: bash
        run: |
          set -euo pipefail
          # Rodar os testes que exercitam o caminho de erro de os.Symlink.
          # Com Developer Mode desabilitado, os testes que têm t.Skipf quando
          # symlink falha irão PULAR — isso é o comportamento esperado até #315
          # ser corrigido (os testes devem testar o caminho de erro, não pular).
          # O resultado é reportado como informativo.
          echo "=== Testes do caminho de erro de symlink ==="
          go test ./internal/generators/... -run TestSymlink -v 2>&1 || true
          go test ./internal/integrations/... -run TestSymlink -v 2>&1 || true
          go test ./pypi/... 2>&1 | grep -i "symlink\|SKIP\|PASS\|FAIL" || true
          echo "=== Fim dos testes de symlink (informativo — #315 não está corrigido) ==="

  # ---------------------------------------------------------------------------
  # AC3 — consumer smoke by_agent (2 agentes, 3 CLIs)
  # (REQ-2026-09-11-o-ciclo-testa-onde-funciona...)
  #
  # Cria um projeto descartável com roadmap_namespacing: by_agent e 2 agentes
  # (alpha, beta) e roda os comandos principais nos 3 CLIs. Detecta o #320
  # (roadmap always em agents[0], --req ignorando o agente da REQ).
  #
  # continue-on-error: true TEMPORÁRIO — remover quando #320 for corrigido.
  # CRITÉRIO DE REMOÇÃO: job reprova APENAS por motivos distintos de #320;
  # roadmap new (com e sem --req) rota para o agente correto nos 3 CLIs.
  #
  # DECLARAÇÃO DE RECONCILIAÇÃO: Este job afirma que com projeto by_agent +
  # 2 agentes, roadmap new sempre coloca o artefato em agents[0] (alpha).
  # Medição: agentStateDir("", "backlog") usa cfg.Agents[0]
  # (internal/generators/roadmap.go:108-115).
  # ---------------------------------------------------------------------------
  consumer-smoke-by-agent:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: go build -o bin/trackfw ./cmd/trackfw

      - run: npm ci --ignore-scripts
        working-directory: npm

      - run: python -m pip install pypi/

      - name: "AC3 — consumer smoke by_agent (2 agentes, 3 CLIs)"
        run: GO_BIN=bin/trackfw scripts/check-consumer-smoke-by-agent.sh
