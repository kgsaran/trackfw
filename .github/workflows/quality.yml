name: Quality

on:
  push:
    branches: [main]
  # SEM `types:` — de proposito. O default do `on: pull_request` e
  # `opened · synchronize · reopened`, e acrescentar `edited` aqui dispararia
  # o workflow INTEIRO a cada edicao de descricao de PR: medido em 2026-09-25,
  # TODOS os 13 jobs deste arquivo (11 sem `if:` + 2 com `if: always()`, nenhum
  # com `if:` que exclua `edited`) passariam a rodar, incluindo as tres suites
  # de windows-latest. Escrever esse `if:` job a job deixaria o proximo job novo
  # sem ele — contrato que se quebra por omissao. O gate que PRECISA de
  # `edited` e so o de palavra-chave de fechamento, e por isso ele mora em
  # .github/workflows/pr-closing-keyword.yml, com gatilho proprio.
  pull_request:

permissions:
  contents: read

env:
  # ML-2G (ROADMAP-2026-09-06-perfil-e-aceleracao-do-check-gates-falsify-
  # sem-perder-cobertura.md): grau da matriz de sharding do gate de
  # falsificação, num único lugar. A matriz do job `parity-falsify-shard`
  # abaixo (`strategy.matrix.shard: [0, 1, 2, 3]`) é CABEADA (GitHub Actions
  # não permite matriz dinâmica sem um job prévio que a compute via
  # `fromJSON`) — os dois têm de ter o MESMO tamanho. Um step de guarda no
  # próprio job de matriz reprova cedo se alguém mudar um sem o outro
  # (compara `strategy.job-total` contra este valor).
  FALSIFY_SHARD_COUNT: "4"

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make test
        env:
          TRACKFW_DISABLE_EXTERNAL_COMMANDS: "1"
      - run: go vet ./...
      - run: go build ./...
      - run: scripts/check-static-assets.sh
      - run: scripts/check-integration-assets.sh

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip packaging
      - run: go build -o bin/trackfw ./cmd/trackfw
      - run: scripts/smoke-integration-packages.sh

  windows-integrations-resolve:
    # Guard de regressão: o bug de path Windows (manager.js:31, manager.go:398)
    # é invisível em ubuntu-latest porque path.normalize / filepath.Clean não
    # convertem "/" → "\" no Linux.  Este job é o único guard honesto.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Go — integrations resolve (Windows)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./internal/integrations/... -run TestResolveWindowsCrossplatform -v
        env:
          TRACKFW_DISABLE_EXTERNAL_COMMANDS: "1"

  windows-full-suites:
    # Camada 1 do instrumento de medição — ADR-2026-08-30-ci-de-windows-como-
    # instrumento-de-medicao-job-largo-que-nasce-vermelho-mais-sonda-sob-
    # demanda.md, decisão 1/2. As TRÊS suítes completas (go test ./...,
    # npm test, pytest pypi/tests) em windows-latest — sem invocação
    # dirigida (não confundir com o job windows-integrations-resolve acima,
    # que é intocado e continua sendo um guard estreito e honesto).
    #
    # NÃO CORRIGE nada (ADR decisão 7). O critério de aceite é que este job
    # REPROVE reproduzindo os defeitos da issue #216 — um job de Windows que
    # nasce verde não prova nada (foi assim que chegamos aqui).
    #
    # continue-on-error: true é TEMPORÁRIO (AC4) — só remover depois que TODAS
    # as REQs de correção dos 11 itens da issue #216 fecharem. Até lá este
    # job aparece como ⚠️, nunca ❌, e branch protection com "required status
    # checks" não trava PR por causa dele — decisão deliberada para não
    # paralisar trabalho não relacionado. Revisão obrigatória antes de
    # remover: confirmar que os 11 itens estão corrigidos E cobertos por
    # verificação que falhava antes (ADR decisão 7).
    #
    # AC12 — isolação de $HOME/USERPROFILE: pypi/tests/conftest.py e
    # internal/validator/main_test.go isolam via a env var HOME, que a
    # produção NÃO lê no Windows (verificado contra o stdlib: os.UserHomeDir
    # do Go usa exclusivamente %USERPROFILE% no branch "windows" — sem
    # fallback para $HOME —, e ntpath.expanduser do Python idem). Sem
    # mitigação, `go test ./...` escreveria de verdade no perfil do runner, e
    # o Go paraleliza pacotes por padrão: condição de corrida DENTRO da
    # mesma execução (Wave 0, hades-tf — ML-0A). Mitigação aplicada AQUI, no
    # job, não no produto nem nos arquivos de teste (fora do escopo desta
    # ML):
    #   1. USERPROFILE/HOME sobrescritos para um diretório sintético só nos
    #      passos que RODAM as suítes — não no job inteiro, para não
    #      desviar os caches do setup-go/setup-node/pip (por isso
    #      GOPATH/GOMODCACHE/GOCACHE/npm_config_cache/PIP_CACHE_DIR abaixo
    #      são fixados fora do home sintético, e valem para o job inteiro).
    #   2. `go test` roda com -p 1 -parallel 1 e `node --test` com
    #      --test-concurrency=1, eliminando a concorrência ENTRE
    #      pacotes/arquivos de teste que dividiriam o mesmo home sintético.
    #      pytest já é serial por padrão aqui (sem pytest-xdist configurado).
    # Isto NÃO corrige o defeito 2/6 (a produção continua ignorando $HOME em
    # runtime real — a suíte de reprodução, job windows-defect-reproduction
    # abaixo, é que precisa provar isso) — só torna a MEDIÇÃO reproduzível.
    # Um passo de precondição confirma que a isolação vale antes de rodar
    # qualquer suíte; se não valer, as suítes são puladas nesta execução e o
    # job reporta a razão em vez de produzir um resultado não confiável — a
    # suíte de reprodução roda de qualquer forma, independente deste job.
    #
    # RESIDUAL DECLARADO (AC12, sempre vale, não só quando a precondição
    # falha): mesmo com a precondição passando, a mitigação acima NÃO
    # produz isolação POR TESTE — todos os pacotes/arquivos de teste desta
    # execução compartilham UM ÚNICO diretório sintético, sequencialmente,
    # sem limpeza entre eles. Resíduo deixado por um teste pode interferir
    # em outro dentro da mesma execução (mesma classe de problema que a
    # Wave 0 mediu para a home real, só que num diretório descartável em
    # vez do perfil do runner). Uma falha nesta camada sem correspondência
    # clara a um item da issue #216 pode ser efeito colateral disto, não um
    # 12º defeito — triar como resíduo do instrumento antes de assumir
    # achado novo. Corrigir isolação por-teste em
    # pypi/tests/conftest.py e internal/validator/main_test.go (usar
    # USERPROFILE, não só HOME) está fora do escopo desta ML.
    # ML-3A: continue-on-error do job REMOVIDO. Veredito do job = exit code do ratchet (ML-2A/2B).
    # Suítes têm continue-on-error: true no NÍVEL DE STEP — são produtoras de observação.
    # Ratchet não tem continue-on-error — é o juiz. Seu exit code determina o resultado do job.
    # "Camada 1 pulada" agora sai com exit 1 (job sem árbitro não pode passar — vault note).
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Fixar caches fora do home sintético (AC12)
        # env: de JOB não aceita o contexto `runner` (só github, inputs, vars,
        # secrets, strategy, matrix, needs) — por isso este step grava em
        # $GITHUB_ENV, herdado por todos os steps seguintes do job, em vez de
        # um `env:` de job. Continua valendo para o job inteiro, como a AC12
        # exige (setup-go/setup-node/pip incluídos, não só as suítes).
        shell: pwsh
        run: |
          "GOPATH=$env:RUNNER_TEMP\gopath" >> $env:GITHUB_ENV
          "GOMODCACHE=$env:RUNNER_TEMP\gomodcache" >> $env:GITHUB_ENV
          "GOCACHE=$env:RUNNER_TEMP\gocache" >> $env:GITHUB_ENV
          "npm_config_cache=$env:RUNNER_TEMP\npm-cache" >> $env:GITHUB_ENV
          "PIP_CACHE_DIR=$env:RUNNER_TEMP\pip-cache" >> $env:GITHUB_ENV

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
        working-directory: npm
      # ML-3A (v8): pip install pypi/ removido — pypi/trackfw/ não existe mais.
      # A suíte pytest (Python — suíte completa) foi removida junto com pypi/tests/.
      # pytest ainda é necessário para o step ML-1A (falsificação do discriminante).
      - run: python -m pip install --upgrade pip pytest

      - name: Registrar início (AC10)
        shell: pwsh
        run: echo "started=$(Get-Date -AsUTC -Format o)" >> $env:GITHUB_ENV

      - name: Preparar diretório sintético de home (AC12)
        id: home
        shell: pwsh
        # ML-1D — este step é deliberadamente MÍNIMO: cria o diretório e nada
        # mais. A hipótese de que o home sintético vazio quebrava o `git` das
        # fixtures (sem `.gitconfig` global → "Author identity unknown" no
        # `git commit`) foi MEDIDA POR LEITURA e FALSIFICADA: todo helper que
        # commita de verdade nos 3 runtimes seta identidade LOCAL no próprio
        # repositório antes do primeiro commit
        # (internal/validator/validator_test.go:26 initGitRepo,
        # pypi/tests/test_credential_guard_integrity.py:27 _init_git_repo,
        # npm/tests/credential_guard_integrity.test.js:36), e os que exigem
        # config global limpa pinam GIT_CONFIG_GLOBAL num arquivo vazio próprio
        # (internal/commands/branch_prune_test.go:435 e equivalentes). Semear
        # identidade aqui não desbloquearia teste nenhum — só acrescentaria uma
        # variável não medida ao instrumento. Ver o step de sonda abaixo, que é
        # o que converte essa leitura em medição no Windows.
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "winhome"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "home=$dir" >> $env:GITHUB_OUTPUT

      - name: AC12 — confirmar que a isolação de HOME/USERPROFILE vale antes de rodar as suítes
        id: precondition
        shell: pwsh
        continue-on-error: true
        env:
          HOME: ${{ steps.home.outputs.home }}
          USERPROFILE: ${{ steps.home.outputs.home }}
        run: |
          $expected = $env:USERPROFILE
          $failed = $false
          $goHome = (go run scripts/windows-repro/go/checks.go home) 2>&1 | Out-String
          Write-Host "Go   os.UserHomeDir()      -> $($goHome.Trim())"
          if ($goHome.Trim() -ne $expected) { $failed = $true }
          $nodeHome = (node -e "console.log(require('os').homedir())") 2>&1 | Out-String
          Write-Host "Node os.homedir()          -> $($nodeHome.Trim())"
          if ($nodeHome.Trim() -ne $expected) { $failed = $true }
          $pyHome = (python -c "import os; print(os.path.expanduser('~'))") 2>&1 | Out-String
          Write-Host "Py   os.path.expanduser(~) -> $($pyHome.Trim())"
          if ($pyHome.Trim() -ne $expected) { $failed = $true }
          if ($failed) {
            Write-Host "::error::AC12 — a isolação de HOME/USERPROFILE não vale para pelo menos um runtime. Pulando as três suítes completas nesta execução (ver step 'Camada 1 pulada' abaixo)."
            exit 1
          }
          Write-Host "AC12 — isolação confirmada para os 3 runtimes."

      - name: ML-1D — sonda de `git` sob o home sintético (observacional)
        # O ML-1D nasceu da hipótese (REQ AC5) de que
        # `git symbolic-ref --short HEAD exited with null` e
        # `git not found in current $PATH` vinham DESTE job — do home sintético.
        # A leitura das fontes falsifica isso: as duas strings são emitidas por
        # fixtures que SUBSTITUEM o $PATH por um diretório curado contendo um
        # `git` SEM extensão — npm/src/ship/runner.js:124 (spawnSync devolve
        # status null = ENOENT) alcançado por npm/tests/ship.test.js:866,943
        # (`env: { PATH: tmpBin, ... }`), e pypi/tests/test_barrier.py:446, que
        # varre o $PATH procurando um arquivo literalmente chamado `git`. É a
        # classe do ML-1A (PATHEXT do Windows), resolvida em arquivo de TESTE —
        # nenhum $PATH configurado aqui as alcança, porque a fixture descarta o
        # $PATH do job.
        #
        # Esta sonda é o que torna essa conclusão FALSIFICÁVEL no Windows, já
        # que ela foi obtida por leitura: mede, sob exatamente o mesmo
        # HOME/USERPROFILE das três suítes, se o `git` resolve, se um
        # `init/add/commit` completa e se `symbolic-ref --short HEAD` responde.
        # Verde ⇒ o home sintético não é a causa (a conclusão acima se sustenta,
        # e as falhas de `git` devem ser triadas como fixture). Vermelho ⇒ existe
        # um bloqueio de ambiente que a leitura não viu, e o log diz qual.
        #
        # 🔴 continue-on-error + fora do `if:` das suítes, de propósito: esta
        # sonda NUNCA pode virar portão. O único portão de entrada das três
        # suítes continua sendo `steps.precondition.outcome` (AC12); encadear a
        # sonda ali faria testes serem PULADOS — exatamente o que o AC7 da REQ
        # proíbe. Com continue-on-error, o `conclusion` dela é success, então o
        # `success()` implícito do step "Camada 1 pulada" também fica intacto.
        #
        # Roda num repositório descartável em RUNNER_TEMP, FORA do home
        # sintético, para não deixar resíduo no diretório compartilhado pelas
        # suítes (residual declarado da AC12 acima).
        if: always() && steps.precondition.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          HOME: ${{ steps.home.outputs.home }}
          USERPROFILE: ${{ steps.home.outputs.home }}
        run: |
          # O wrapper `shell: pwsh` do GitHub prepende $ErrorActionPreference='stop', e no
          # PowerShell 7.4+ (o do windows-latest) $PSNativeCommandUseErrorActionPreference
          # e $true por padrao: um comando NATIVO que sai != 0 vira erro TERMINANTE. Sem
          # estas duas linhas, um `git commit` que falha mataria o script na hora e o
          # ::warning:: abaixo — a unica razao de esta sonda existir — nunca seria impresso,
          # exatamente na execucao em que ele importa.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $probe = Join-Path $env:RUNNER_TEMP "gitprobe"
          Remove-Item -Recurse -Force -Path $probe -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $probe | Out-Null
          Write-Host "git --version                 -> $((git --version) 2>&1)"
          Write-Host "git config --show-origin --get user.email:"
          Write-Host "  $((git config --show-origin --get user.email) 2>&1)"
          git -C $probe init --quiet
          Set-Content -Path (Join-Path $probe "a.txt") -Value "probe"
          git -C $probe add a.txt
          # Identidade LOCAL, igual ao que todo helper de fixture dos 3 runtimes
          # faz (initGitRepo / _init_git_repo / git(dir,'config',...)) — a sonda
          # mede a MESMA condição que as suítes, não uma mais permissiva.
          git -C $probe config user.email "probe@trackfw.invalid"
          git -C $probe config user.name "probe"
          $commit = (git -C $probe commit -m "probe") 2>&1 | Out-String
          Write-Host $commit
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::ML-1D — 'git commit' falhou sob o home sintético mesmo com identidade local. Existe bloqueio de ambiente que a leitura das fontes não previu: as falhas de git desta execucao NAO devem ser triadas como fixture antes de investigar isto."
          } else {
            $head = (git -C $probe symbolic-ref --short HEAD) 2>&1 | Out-String
            Write-Host "symbolic-ref --short HEAD     -> $($head.Trim())"
            Write-Host "ML-1D — nenhum bloqueio de ambiente detectado: sob este HOME/USERPROFILE o git resolve, commita e responde symbolic-ref. Resultado CONSISTENTE com causa de fixture para as falhas de git desta execucao — nao e prova de que toda falha de git seja de fixture."
          }

      - name: ML-1A — falsificação do discriminante (ambos os braços, 3 runtimes)
        # Prova que o discriminante event-type funciona nas DUAS direções
        # ANTES de usá-lo nos steps de suíte abaixo.
        #
        # Braço 1 (load failure): fixture que não compila/importa → detector deve disparar.
        # Braço 2 (assertion): fixture com asserção falsa → detector NÃO deve disparar.
        #
        # Guarda de vacuidade: para cada braço, verifica que a mutação foi aplicada
        # (string/exit-code esperados aparecem) ANTES de afirmar que o detector funciona.
        # Um probe que não discrimina produz exit 0 no braço errado — o mesmo risco que
        # afetou o windows-census.yml (B1/B2 guards).
        #
        # Fixtures criadas em $env:RUNNER_TEMP — NUNCA no working tree do checkout.
        # git status --porcelain ao final garante que o repo está limpo.
        #
        # ADR: docs/adr/ADR-2026-09-05-o-ci-de-windows-bloqueia-por-conjunto-de-
        # nomes-e-por-tipo-de-evento-nunca-por-contagem.md (D3, D3-bis)
        if: always() && steps.precondition.outcome == 'success'
        shell: pwsh
        env:
          HOME: ${{ steps.home.outputs.home }}
          USERPROFILE: ${{ steps.home.outputs.home }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = 'Continue'
          $script:PASS = 0
          $script:FAIL = 0

          function Assert-True([bool]$cond, [string]$msg) {
            if ($cond) {
              Write-Host "  FALSIFY PASS: $msg"
              $script:PASS++
            } else {
              Write-Host "::error::FALSIFY FAIL: $msg"
              $script:FAIL++
            }
          }

          $tmp = Join-Path $env:RUNNER_TEMP "ml1a-falsify"
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null

          # ─── GO ──────────────────────────────────────────────────────────────
          Write-Host "=== Go braço 1: pacote com erro de sintaxe (load failure) ==="
          $goLoad = Join-Path $tmp "go-load"
          New-Item -ItemType Directory -Force -Path "$goLoad/badpkg" | Out-Null
          Set-Content "$goLoad/go.mod" "module ml1a-probe`n`ngo 1.21"
          # Erro de sintaxe: go toolchain falha em compile-time, sem consultar proxy.
          Set-Content "$goLoad/badpkg/bad_test.go" @"
          package badpkg
          import "testing"
          func TestX(t *testing.T) {
              this is a syntax error
          }
          "@
          $goLoadOut = Join-Path $tmp "go-load-out.txt"
          Push-Location $goLoad
          go test -v -p 1 -parallel 1 -timeout 2m ./... *> $goLoadOut
          $rc_go_load = $LASTEXITCODE
          Pop-Location
          $goLoadContent = Get-Content $goLoadOut -Raw -ErrorAction SilentlyContinue
          # Guarda de vacuidade: sintaxe inválida deve aparecer no output
          Assert-True ($goLoadContent -match 'syntax error' -or $goLoadContent -match 'setup failed') `
            "Go braço1 guarda: output contém 'syntax error' ou 'setup failed' (mutação aplicada)"
          Assert-True ($rc_go_load -ne 0) "Go braço1: load failure retorna exit code != 0"
          $goLoadFails = @(Select-String -Path $goLoadOut -Pattern 'FAIL\t.*\[setup failed\]' -ErrorAction SilentlyContinue)
          Assert-True ($goLoadFails.Count -gt 0) "Go braço1: detector [setup failed] dispara em load failure"

          Write-Host "=== Go braço 2: pacote com asserção falsa (normal failure) ==="
          $goAssert = Join-Path $tmp "go-assert"
          New-Item -ItemType Directory -Force -Path "$goAssert/failpkg" | Out-Null
          Set-Content "$goAssert/go.mod" "module ml1a-probe2`n`ngo 1.21"
          Set-Content "$goAssert/failpkg/fail_test.go" @"
          package failpkg
          import "testing"
          func TestFail(t *testing.T) { t.Errorf("arm2 assertion failure") }
          "@
          $goAssertOut = Join-Path $tmp "go-assert-out.txt"
          Push-Location $goAssert
          go test -v -p 1 -parallel 1 -timeout 2m ./... *> $goAssertOut
          $rc_go_assert = $LASTEXITCODE
          Pop-Location
          Assert-True ($rc_go_assert -ne 0) "Go braço2: asserção falsa retorna exit code != 0"
          $goAssertFails = @(Select-String -Path $goAssertOut -Pattern 'FAIL\t.*\[setup failed\]' -ErrorAction SilentlyContinue)
          Assert-True ($goAssertFails.Count -eq 0) "Go braço2: detector NÃO dispara em asserção falsa"

          # ─── PYTHON ──────────────────────────────────────────────────────────
          Write-Host "=== Python braço 1: import quebrado em módulo de teste (load failure) ==="
          $pyLoad = Join-Path $tmp "py-load"
          New-Item -ItemType Directory -Force -Path $pyLoad | Out-Null
          Set-Content "$pyLoad/test_broken.py" @"
          import no_such_module_ml1a_probe_falsify
          def test_x(): pass
          "@
          $pyLoadOut = Join-Path $tmp "py-load-out.txt"
          python -m pytest $pyLoad -q *> $pyLoadOut
          $rc_py_load = $LASTEXITCODE
          $pyLoadContent = Get-Content $pyLoadOut -Raw -ErrorAction SilentlyContinue
          # Guarda de vacuidade: nome do módulo deve aparecer no output
          Assert-True ($pyLoadContent -match 'no_such_module_ml1a_probe_falsify') `
            "Python braço1 guarda: nome do módulo ausente aparece no output (mutação aplicada)"
          Assert-True ($rc_py_load -eq 2 -or $rc_py_load -eq 4) `
            "Python braço1: load failure detectado por exit code 2 ou 4 (obtido: $rc_py_load)"

          Write-Host "=== Python braço 2: asserção falsa (normal failure) ==="
          $pyAssert = Join-Path $tmp "py-assert"
          New-Item -ItemType Directory -Force -Path $pyAssert | Out-Null
          Set-Content "$pyAssert/test_fail.py" @"
          def test_fail():
              assert 1 == 2, "arm2 assertion failure"
          "@
          $pyAssertOut = Join-Path $tmp "py-assert-out.txt"
          python -m pytest $pyAssert -q *> $pyAssertOut
          $rc_py_assert = $LASTEXITCODE
          Assert-True ($rc_py_assert -eq 1) `
            "Python braço2: asserção falsa retorna exit code 1 (não 2/4)"
          Assert-True ($rc_py_assert -ne 2 -and $rc_py_assert -ne 4) `
            "Python braço2: detector NÃO dispara em asserção falsa (exit code $rc_py_assert)"

          # ─── NODE.JS ─────────────────────────────────────────────────────────
          Write-Host "=== Node braço 1: require quebrado (load failure) ==="
          $nodeLoad = Join-Path $tmp "node-load"
          New-Item -ItemType Directory -Force -Path $nodeLoad | Out-Null
          Set-Content "$nodeLoad/broken.test.js" @"
          const x = require('no_such_module_ml1a_probe_falsify');
          const { test } = require('node:test');
          test('x', () => {});
          "@
          $tapLoad = Join-Path $tmp "node-load.tap"
          node --test --test-concurrency=1 `
            "--test-reporter=spec" "--test-reporter-destination=stdout" `
            "--test-reporter=tap" "--test-reporter-destination=$tapLoad" `
            $nodeLoad 2>&1 | Out-Null
          $rc_node_load = $LASTEXITCODE
          $tapLoadContent = if (Test-Path $tapLoad) { Get-Content $tapLoad -Raw } else { "" }
          # Guarda de vacuidade: exitCode field deve aparecer no TAP
          Assert-True ($tapLoadContent -match 'exitCode:') `
            "Node braço1 guarda: 'exitCode:' aparece no TAP (mutação aplicada — D3-bis)"
          $nodeLoadFails = @(Select-String -Path $tapLoad -Pattern '^\s+exitCode:\s+\d+' -ErrorAction SilentlyContinue)
          Assert-True ($nodeLoadFails.Count -gt 0) `
            "Node braço1: detector exitCode field dispara em load failure"

          Write-Host "=== Node braço 2: asserção falsa (normal failure) ==="
          $nodeAssert = Join-Path $tmp "node-assert"
          New-Item -ItemType Directory -Force -Path $nodeAssert | Out-Null
          Set-Content "$nodeAssert/fail.test.js" @"
          const { test } = require('node:test');
          const assert = require('node:assert');
          test('arm2 assertion failure', () => { assert.strictEqual(1, 2); });
          "@
          $tapAssert = Join-Path $tmp "node-assert.tap"
          node --test --test-concurrency=1 `
            "--test-reporter=spec" "--test-reporter-destination=stdout" `
            "--test-reporter=tap" "--test-reporter-destination=$tapAssert" `
            $nodeAssert 2>&1 | Out-Null
          $rc_node_assert = $LASTEXITCODE
          $tapAssertContent = if (Test-Path $tapAssert) { Get-Content $tapAssert -Raw } else { "" }
          Assert-True ($rc_node_assert -ne 0) "Node braço2: asserção falsa retorna exit code != 0"
          $nodeAssertFails = @(Select-String -Path $tapAssert -Pattern '^\s+exitCode:\s+\d+' -ErrorAction SilentlyContinue)
          Assert-True ($nodeAssertFails.Count -eq 0) `
            "Node braço2: detector NÃO dispara em asserção falsa (exitCode ausente no TAP)"

          # ─── CLEANUP & RESULT ────────────────────────────────────────────────
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue

          $status = git status --porcelain
          if ($status) {
            Write-Host "::error::ML-1A falsify: working tree sujo após a sonda — o job modificou arquivos do repositório"
            exit 1
          }

          Write-Host ""
          Write-Host "ML-1A falsify: $($script:PASS) PASS · $($script:FAIL) FAIL"
          if ($script:FAIL -gt 0) { exit 1 }

      - name: Go — suíte completa (camada 1, AC1)
        # always() && <condição>: sem always() aqui, o GitHub Actions
        # prepende success() implicitamente a qualquer if: sem função de
        # status (doc oficial) — então, quando o step Go falha, os steps
        # Node/Python seguintes eram pulados mesmo com
        # `steps.precondition.outcome == 'success'` == true, porque o
        # success() implícito já era falso (medido no PR #221, run
        # 33322373895: Go -> failure, Node/Python -> skipped). always()
        # substitui esse success() implícito por "sempre avalia minha
        # condição", preservando a precondição da AC12 como ÚNICO portão de
        # entrada — não é um always() cego (não roda quando a precondição
        # falhou).
        if: always() && steps.precondition.outcome == 'success'
        # ML-3A: step-level continue-on-error — suíte é produtora de observação, não o juiz.
        # Falhas de asserção (os 14 conhecidos) são absorvidas aqui e entregues ao ratchet
        # via go-suite-out.txt. Suite-load-failure escreve marcador adicional (ver abaixo).
        continue-on-error: true
        shell: pwsh
        env:
          HOME: ${{ steps.home.outputs.home }}
          USERPROFILE: ${{ steps.home.outputs.home }}
          TRACKFW_DISABLE_EXTERNAL_COMMANDS: "1"
        # -v (ML-4A, 2026-09-04): sem ele o `go test` bufferiza e DESCARTA a saída de
        # pacote que passa — e os testes com supressão de bit de execução passam
        # justamente POR CAUSA da supressão. Medido: 0 ocorrências da mensagem sem
        # -v, 13 com. O critério "toda supressão nomeia a garantia não exercitada"
        # era vácuo no Go sem esta flag: a mensagem existia e ninguém a lia.
        # `t.Logf` e `os.Stderr` dão 0 igualmente — as duas foram medidas.
        #
        # ML-1A: captura saída para classificar falhas por tipo de evento.
        # Discriminante: linha "FAIL\t<pkg> [setup failed]" — evento de toolchain que
        # indica que o pacote NÃO compilou; nenhum teste rodou.
        # Medido: Go 1.25.2/macOS arm64 com as flags exatas do CI.
        # [setup failed] é string estável desde Go 1.17 (toolchain, não runtime).
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $outFile = Join-Path $env:RUNNER_TEMP "go-suite-out.txt"
          go test -v -p 1 -parallel 1 -timeout 20m ./... *> $outFile
          $rc = $LASTEXITCODE
          Get-Content $outFile
          # Classificar por tipo de evento, nunca por contagem (ADR D3).
          $loadFails = @(Select-String -Path $outFile -Pattern 'FAIL\t.*\[setup failed\]' -ErrorAction SilentlyContinue)
          if ($loadFails.Count -gt 0) {
            $lines = ($loadFails | ForEach-Object { $_.Line.Trim() }) -join ' ; '
            Write-Host "::error::Go suite-load-failure: $($loadFails.Count) pacote(s) não compilou (evento: [setup failed], não ERR_ASSERTION). Pacotes: $lines"
            # ML-3A: marcador de classe própria. Step-level continue-on-error absorve o exit
            # code da suíte, mas não o marcador. O ratchet lê este arquivo via
            # --load-markers-dir e reprova o job (vault note: não consegui procurar → fatal).
            $lines | Set-Content "$env:RUNNER_TEMP\suite-load-failure.go.txt" -Encoding utf8
          }
          exit $rc

      - name: ML-2B — extrair baseline para verificação de remoções (D4)
        # ADR D4: toda entrada removida da lista declara o motivo (removal_note).
        # O baseline (estado atual de origin/main) permite detectar entradas
        # deletadas sem passar pelo array 'removed'.
        #
        # Raiz do defeito (corretivo ML-2B, 2026-09-10): actions/checkout@v7 sem
        # 'with:' usa fetch-depth: 1 e busca APENAS o branch do PR — origin/main
        # nunca é escrito como ref remota. `git show origin/main:...` falha com
        # "unknown revision", não porque o arquivo está ausente na main, mas porque
        # a REF não existe. Dois estados distintos (ref ausente / arquivo ausente)
        # geravam o mesmo observable (silêncio + aviso genérico) e a mesma mensagem
        # errada "normal em PRs que adicionam o arquivo pela primeira vez".
        # Terceira ocorrência do padrão dois-estados-um-observable neste projeto
        # (anterior: #307 git-vs-interpretador, #274 suíte-que-não-carrega).
        #
        # Correção: fetch incondicionalmente com refspec explícito (config-independente).
        # Custo medido localmente: 0.09 s (1 commit + árvore, objeto único, < 1 MB).
        # No runner do GitHub Actions (LAN-class vs. mesmo DC) custo comparável.
        # fetch-depth: 0 (histórico completo) custa N commits × objetos — rejeitado.
        # O fetch pontual é suficiente porque apenas `git show origin/main:...` e
        # `git ls-tree origin/main` precisam do ref; nenhum outro step do job usa
        # `git log`, `git describe` ou ancestralidade.
        #
        # Dois estados distintos, mensagens distintas (Falsificação):
        #   Braço 1 — ref ausente (fetch falhou ou ref inválida): ::error:: + exit 1.
        #             "Fatal" = exit 1 no step; o job continua enquanto
        #             continue-on-error: true estiver ativo (ML-3A). Visível como
        #             ##[error] no log do runner.
        #   Braço 2 — ref presente + arquivo ausente na main (este PR adiciona o
        #             arquivo): ::warning:: + exit 0 (step passa).
        #   Braço 3 — ref presente + arquivo presente: baseline extraído, D4 ativa.
        #             check-windows-known-failures.py emite 'ML-2B D4 (baseline):
        #             N entrada(s) comparadas' (T15) — ausência dessa linha = D4
        #             não rodou de verdade.
        if: always() && steps.precondition.outcome == 'success'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $baselineFile = Join-Path $env:RUNNER_TEMP "baseline-known-failures.json"

          # Fetch origin/main unconditionally with explicit refspec.
          # Bare branch name (fetch origin main) writes only FETCH_HEAD, which
          # depends on remote.origin.fetch; the explicit refspec is config-independent.
          Write-Host "ML-2B (baseline): fetching origin/main (depth=1, no-tags)..."
          git fetch --depth=1 --no-tags origin "+refs/heads/main:refs/remotes/origin/main" 2>&1
          $fetchExit = $LASTEXITCODE

          $refVerify = git rev-parse --verify origin/main 2>&1
          if ($LASTEXITCODE -ne 0 -or $fetchExit -ne 0) {
            # Braço 1: ref indisponível — gate não pode fingir que rodou.
            Write-Host "::error::ML-2B (baseline): origin/main indisponível após fetch (fetch exit=$fetchExit, rev-parse exit=$LASTEXITCODE) — verificação de remoções (D4) não pode rodar. Gate não pode fingir que rodou."
            exit 1
          }

          # Distinguir: ref existe mas arquivo ausente na main.
          $fileInMain = git ls-tree origin/main -- .github/windows-known-failures.json 2>&1
          if ([string]::IsNullOrWhiteSpace($fileInMain)) {
            # Braço 2: arquivo adicionado por este PR, ainda não mergeado na main.
            Write-Host "::warning::ML-2B (baseline): windows-known-failures.json ausente em origin/main — verificação de remoções por baseline desabilitada (arquivo adicionado por este PR, ainda não mergeado)."
            exit 0
          }

          # Braço 3: ref e arquivo presentes — extrair baseline.
          git show origin/main:.github/windows-known-failures.json > $baselineFile
          if ($LASTEXITCODE -ne 0 -or (Get-Item $baselineFile -ErrorAction SilentlyContinue).Length -eq 0) {
            Write-Host "::error::ML-2B (baseline): ls-tree listou o arquivo mas extração falhou — baseline não disponível."
            exit 1
          }
          $sz = (Get-Item $baselineFile).Length
          Write-Host "ML-2B (baseline): $sz bytes extraídos de origin/main — verificação de remoções (D4) ativa."

      - name: ML-2A/2B — ratchet de nomes e verificação de remoções
        # ML-2A — ADR D1: falha se nome novo aparecer fora da lista; avisa quando
        # nome da lista deixa de falhar (mas NÃO reprova — corrigir um teste não
        # pode quebrar o CI).
        #
        # ML-2B — ADR D4: verifica entradas no array 'removed':
        #   - toda entrada retirada de 'entries' deve estar em 'removed' (baseline)
        #   - removal_note obrigatório (corrected | renamed | no-longer-runs)
        #   - corrected: nome deve aparecer em '--- PASS:' / 'ok N -' / 'PASSED'
        #   - renamed: renamed_to deve apontar para uma entrada ativa
        #
        # Guarda de vacuidade (lista): lista vazia ou ausente → exit 1.
        # Guarda de vacuidade (artefatos): artefato ausente → exit 1.
        # Contagem — nunca como critério (ADR D1): o exit code vem exclusivamente
        # da comparação de conjuntos.
        #
        # ML-3A: este step é o juiz do job (continue-on-error do job removido).
        # Seu exit code determina o resultado do job para os cenários de asserção
        # e suite-load-failure por nome. Marcadores de suite-load-failure/zero-test
        # (classe própria, ML-1A) são verificados via --load-markers-dir: se qualquer
        # marcador existir em RUNNER_TEMP, o ratchet reprova diretamente (vault note:
        # não consegui procurar → fatal). Guarda de vacuidade de resultado: se um
        # artefato existir mas não contiver linhas de resultado, também reprova.
        if: always() && steps.precondition.outcome == 'success'
        shell: pwsh
        run: |
          $baselineFile = Join-Path $env:RUNNER_TEMP "baseline-known-failures.json"
          python scripts/check-windows-known-failures.py `
            --list .github/windows-known-failures.json `
            --go-out  "$env:RUNNER_TEMP\go-suite-out.txt" `
            --baseline "$baselineFile" `
            --load-markers-dir "$env:RUNNER_TEMP"

      - name: Camada 1 pulada — AC12 impediu execução segura
        if: steps.precondition.outcome != 'success'
        shell: pwsh
        run: |
          # ML-3A: job cujo árbitro não rodou não pode passar (vault note: dois-estados-um-observable).
          # Antes do ML-3A, o job-level continue-on-error tornava isso um warning silencioso.
          # Com ML-3A, a única saída honesta é reprovar: o ratchet não rodou, portanto o
          # job não tem veredito — e um job sem veredito é indistinguível de um job que passou.
          # A suíte de reprodução de defeito (job windows-defect-reproduction) roda independentemente.
          # Residual declarado: isolação por-teste em pypi/tests/conftest.py e
          # internal/validator/main_test.go ausente no Windows — fora do escopo desta ML.
          Write-Host "::error::ML-3A: Camada 1 (as três suítes completas) foi pulada porque a precondição de isolação de HOME/USERPROFILE falhou (AC12). O ratchet não rodou. Job cujo árbitro não rodou não pode passar."
          exit 1

      - name: Registrar duração (AC10)
        if: always()
        shell: pwsh
        run: |
          $start = [DateTimeOffset]::Parse($env:started)
          $elapsed = [DateTimeOffset]::UtcNow - $start
          $msg = "Duração medida do job windows-full-suites: $($elapsed.ToString())"
          Write-Host $msg
          if ($env:GITHUB_STEP_SUMMARY) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## AC10 — tempo do job`n`n$msg" }

  windows-defect-reproduction:
    # Camada 2 do instrumento — ADR decisão 6/AC2/AC2b/AC3. Uma verificação
    # por defeito conhecido da issue #216, mapeada 1:1, exercitando o
    # caminho real de produção — sem mock. É ESTA que precisa nascer
    # vermelha: a Wave 0 (hades-tf, ML-0A) mediu que as três suítes completas
    # sozinhas (job windows-full-suites acima) só expõem 2 dos 11 itens com
    # confiança direta — entregar só elas produziria falsa sensação de
    # cobertura sobre os outros 9. Ver scripts/windows-repro/run.ps1 para o
    # mapeamento completo item a item (comentário de cabeçalho do arquivo).
    #
    # continue-on-error: true é TEMPORÁRIO (AC4), mesmo motivo e mesmo
    # critério de remoção do job windows-full-suites acima.
    #
    # NÃO CORRIGE nada (ADR decisão 7): uma verificação que passar quando
    # deveria reproduzir o defeito é achado (defeito ausente/já corrigido, ou
    # a verificação está errada) — nunca motivo para alterar código de
    # produto neste job.
    #
    # Independente do job windows-full-suites: não compartilha `needs`, não
    # depende do resultado dele. Roda mesmo se a camada 1 for pulada por
    # AC12.
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Fixar caches fora do home sintético (AC12)
        # Mesmo motivo do job windows-full-suites acima: env: de JOB não
        # aceita o contexto `runner` — só env: de step, with: e run: o
        # aceitam. Step de setup gravando em $GITHUB_ENV replica o efeito de
        # um env: de job (vale para todos os steps seguintes) sem violar o
        # schema.
        shell: pwsh
        run: |
          "GOPATH=$env:RUNNER_TEMP\gopath" >> $env:GITHUB_ENV
          "GOMODCACHE=$env:RUNNER_TEMP\gomodcache" >> $env:GITHUB_ENV
          "GOCACHE=$env:RUNNER_TEMP\gocache" >> $env:GITHUB_ENV
          "npm_config_cache=$env:RUNNER_TEMP\npm-cache" >> $env:GITHUB_ENV
          "PIP_CACHE_DIR=$env:RUNNER_TEMP\pip-cache" >> $env:GITHUB_ENV

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # ML-4C: setup-node and npm ci removed — npm/src deleted in ML-3A; no Node CLI.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # ML-4C: npm ci removed — npm/src deleted in ML-3A.
      # ML-4C: pip install pypi/ removed — pypi/trackfw/ deleted in ML-3A; run.ps1
      # items 2/7/10 reduced to Go-only arms; no Python CLI invocations remain.
      - run: python -m pip install --upgrade pip

      - name: Registrar início (AC10)
        shell: pwsh
        run: echo "started=$(Get-Date -AsUTC -Format o)" >> $env:GITHUB_ENV

      - name: Suíte de reprodução de defeito — 11 itens da issue #216 (AC2, AC2b, AC3)
        shell: pwsh
        run: pwsh -File scripts/windows-repro/run.ps1

      - name: Registrar duração (AC10)
        if: always()
        shell: pwsh
        run: |
          $start = [DateTimeOffset]::Parse($env:started)
          $elapsed = [DateTimeOffset]::UtcNow - $start
          $msg = "Duração medida do job windows-defect-reproduction: $($elapsed.ToString())"
          Write-Host $msg
          if ($env:GITHUB_STEP_SUMMARY) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## AC10 — tempo do job`n`n$msg" }

  # ML-2G (ROADMAP-2026-09-06-perfil-e-aceleracao-do-check-gates-falsify-sem-
  # perder-cobertura.md): shards de check-gates-falsify.sh como JOBS de
  # matriz, um por VM própria (4 vCPUs cada), em vez de processos em
  # background dentro de UM job (isso já existia -- ML-2D,
  # scripts/run-gates-falsify-parallel.sh, ainda usado por `make parity`
  # local via `make parity-falsify`). Mesmo gerador dos dois mecanismos:
  # scripts/gen-falsify-chunks.py <fonte> <dir> <n> -- "o mesmo mecanismo que
  # distribui entre processos distribui entre jobs" (decisão do roadmap).
  #
  # Isolamento entre shards: cada um é uma VM efêmera própria do GitHub
  # Actions -- isolamento de processo/filesystem/ambiente mais forte que o
  # dos processos-irmãos do ML-2D (que compartilhavam GOPATH/GOCACHE/
  # GOMODCACHE do runner). Estado potencialmente compartilhado entre shards
  # AQUI: nenhum -- nem cache do actions/setup-go (este job, como o job
  # `parity` original, nunca setou cache:true) nem artefato de build; cada
  # shard baixa suas próprias deps e builda seu próprio bin/trackfw do zero.
  parity-falsify-shard:
    runs-on: ubuntu-latest
    # ML-3A (v8): node e python removidos dos needs — jobs deletados.
    needs: [go, package-smoke, windows-integrations-resolve]
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # ML-3A (v8): npm ci e pip install pypi/ removidos — npm/src e pypi/trackfw deletados.
      # packaging: necessário para check-wheel-filename.sh (D6-write).
      - run: python -m pip install --upgrade pip packaging
      - name: Grau da matriz bate com FALSIFY_SHARD_COUNT (guarda contra drift)
        run: |
          if [ "${{ strategy.job-total }}" != "${{ env.FALSIFY_SHARD_COUNT }}" ]; then
            echo "::error::strategy.job-total=${{ strategy.job-total }} != FALSIFY_SHARD_COUNT=${{ env.FALSIFY_SHARD_COUNT }} -- atualize a lista 'matrix.shard' acima e o env FALSIFY_SHARD_COUNT juntos"
            exit 1
          fi
      - run: go build -o bin/trackfw ./cmd/trackfw
      - name: Shard ${{ matrix.shard }} de check-gates-falsify.sh
        run: scripts/run-gates-falsify-shard.sh
        env:
          TRACKFW_DISABLE_EXTERNAL_COMMANDS: "1"
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ env.FALSIFY_SHARD_COUNT }}
          OUTPUT_DIR: falsify-shard-out
          FALSIFY_TIMING_FILE: ${{ github.workspace }}/falsify-shard-out/timing_${{ matrix.shard }}.log
      # if: always() -- sobe o log/rótulos mesmo se o shard reprovou: é
      # exatamente o que o job de agregação `parity` precisa para NOMEAR
      # qual shard falhou (em vez de só herdar um "algo falhou" genérico).
      - name: Upload dos rótulos emitidos por este shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: falsify-shard-${{ matrix.shard }}
          path: falsify-shard-out/
          retention-days: 7

  # ML-2G: os ~45 gates de `parity` que NÃO são check-gates-falsify.sh --
  # rodam uma vez só, aqui, em paralelo com os 4 shards acima. Ver Makefile
  # (alvo `parity-rest`) para a lista completa e a justificativa da divisão.
  parity-other-gates:
    runs-on: ubuntu-latest
    # ML-3A (v8): node e python removidos dos needs — jobs deletados.
    needs: [go, package-smoke, windows-integrations-resolve]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # ML-3A (v8): setup-node e npm ci removidos — npm/src deletado.
      # pip install pypi/ removido — pypi/trackfw/ deletado.
      # pytest: necessário para check-serve-api-file-security.sh.
      # packaging: necessário para check-wheel-filename.sh (D6-write).
      # PyYAML: necessário para check-workflow-yaml.py e check-required-status-checks.py.
      - run: python -m pip install --upgrade pip pytest packaging PyYAML
      - run: make parity-rest
        env:
          TRACKFW_DISABLE_EXTERNAL_COMMANDS: "1"
      # ML-1B-bis (ROADMAP-2026-09-22-teste-e-gate-leem-a-arvore-de-governanca-do-
      # repositorio-onde-rodam-e-o-consumidor-nao-consegue-rodar-a-suite.md):
      # Tripwire de disco do upstream: exige que todos os 144 basenames do corpus
      # congelado existam em docs/roadmaps/. Separado de parity-rest para que o
      # consumidor possa rodar `make quality` sem possuir a governança do mantenedor.
      # A tripwire exige os 144 basenames do corpus congelado NO DISCO, e esses
      # roadmaps sao a governanca DESTE repositorio. Num consumidor (fork que usa o
      # trackfw para se governar) eles nao existem, e o passo reprova por ausencia de
      # artefato do mantenedor -- o mesmo mecanismo da issue #277, agora no workflow
      # em vez do Makefile. A condicao abaixo mantem a tripwire cobrindo o repo onde
      # ela significa algo, sem cobrar do consumidor um acervo que nao e dele.
      - name: ML-1B-bis — self-governance (tripwire do upstream)
        if: github.repository == 'kgsaran/trackfw'
        run: make self-governance

  # ML-2G -- job de AGREGAÇÃO. Mantém o id `parity` DELIBERADAMENTE — nunca
  # renomear nem transformar em matriz.
  #
  # POR QUÊ (medido, não suposto): `gh api repos/kgsaran/trackfw/branches/
  # main/protection` mostra required_status_checks.contexts incluindo
  # "parity" (strict:false), por NOME. Se este job virasse matriz, o GitHub
  # reportaria checks "parity (0)"/"parity (1)"/... e NENHUM check chamado
  # exatamente "parity" jamais reportaria — todo PR ficaria PENDENTE para
  # sempre no check obrigatório (não vermelho: simplesmente nunca chega).
  # É a mesma preocupação que o comentário histórico abaixo (2026-09-03)
  # já tinha registrado como razão para não shardar — permanece válida para
  # um job que vira matriz; deixa de valer para um job de AGREGAÇÃO que
  # preserva o nome e depende (`needs:`) dos jobs que viraram matriz.
  #
  # Nota histórica (VENCIDA nas contas, mantida por registrar a decisão
  # certa no momento em que foi tomada -- mesmo precedente do comentário do
  # ML-2D em run-gates-falsify-parallel.sh): medido em 2026-09-03, "matriz de
  # shards ganha só ~19%, porque o piso é check-gates-falsify sozinho" — essa
  # conta assumia UM job de matriz substituindo `parity` inteiro, sem separar
  # os outros gates para um job concorrente próprio (o desenho `parity-other-
  # gates` acima). Também antecedia o ML-2D (paralelismo em processo já
  # embutido em `make parity`/`parity-falsify`, que muda o piso de 610s).
  #
  # if: always() é necessário para o job RODAR mesmo quando um `needs`
  # falhou (senão o GitHub pula `parity` inteiro e o check obrigatório nunca
  # reporta -- o mesmo problema do parágrafo acima, por outro caminho). Mas
  # `if: always()` sozinho faz o job PASSAR por padrão quando pulado ou
  # quando um needs falhou -- por isso o primeiro step (após checkout e
  # setup-python) chama scripts/check-needs-success.sh, que aprova somente
  # quando todos os needs reportam result=="success" (lista de permitidos,
  # REQ-2026-11-12).
  # ML-4B corretivo (ROADMAP-2026-09-06-ratchet-por-nome-e-classe-propria-para-suite-que-nao-carrega):
  # Verifica que a declaração local (.github/required-status-checks.txt) concorda com os checks
  # que os workflows podem realmente emitir — escopo D\W apenas (sem chamada à API).
  #
  # Escopo dw: GITHUB_TOKEN não tem permissão para ler /branches/main/protection em CI
  # (medido: run 34605163678, PR #317 — retornou 404 "Resource not found").
  # A verificação completa D/R/W (incluindo D\R e R\W) usa 'make check-required-full',
  # que requer credencial de mantenedor e é pré-condição da rotina de release
  # (ver CLAUDE.md §Protocolo de Release, passo 3.5).
  # D\R e R\W não verificados nesta execução — declarado explicitamente na saída do gate.
  check-required-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - name: ML-4B autoteste (10 bracos de falsificacao, incluindo scope dw)
        run: python3 scripts/check-required-status-checks.py --self-test
      - name: ML-4B verificacao D\W — declared vs workflow checks (scope dw, sem token)
        run: python3 scripts/check-required-status-checks.py --scope dw

  # ML-1A (REQ-2026-11-06-ci-vermelho-sem-relacao-com-o-conteudo): job de CLASSIFICAÇÃO
  # do diff do PR. Decide se o shim-byte-identity é aplicável ao PR.
  #
  # Dois passos obrigatórios em ordem — B1 (ML-2B, REQ-2026-11-06):
  #   1. --classify (versão BASE): classifica o diff usando o script da BASE do PR,
  #      não do HEAD — ADR-2026-09-17: a severidade não pode vir da fonte verificada.
  #      Se o script não existir na BASE (caso do próprio PR de ML-1A) ou BASE_SHA
  #      estiver vazio, escreve diff_is_inert=false e termina com sucesso (D2).
  #   2. --self-test (versão HEAD): garante que a lógica introduzida pelo PR está
  #      correta. Se falhar, o job falha → gate falha → PR bloqueado (defesa T6 do
  #      threat model: PR não controla sua própria cobertura via versão BASE).
  #
  # B1: --classify ANTES do --self-test. Motivo: $GITHUB_PATH e $GITHUB_ENV persistem
  # entre passos do mesmo job. Um passo HEAD (--self-test) pode injetar um git falso em
  # $GITHUB_PATH antes que a classificação BASE rode — derrotando a defesa ADR-2026-09-17
  # pelo caminho fora do sítio que D1 manda inspecionar. Com --classify primeiro, o PATH
  # não está contaminado no momento da classificação.
  #
  # Sem `if:` — roda em todo evento (push e pull_request), inclusive quando
  # shim-byte-identity é pulado. O gate lê a saída deste job para distinguir
  # "dispensa intencional" de "pulado inesperadamente".
  classify:
    runs-on: ubuntu-latest
    outputs:
      diff_is_inert: ${{ steps.classify.outputs.diff_is_inert }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: classificar diff do PR (versão BASE)
        id: classify
        env:
          EVENT_NAME:     ${{ github.event_name }}
          BASE_REF:       ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_SHA:       ${{ github.event.pull_request.base.sha }}
          HEAD_SHA:       ${{ github.event.pull_request.head.sha }}
        run: |
          # Classificar usando a versão do script na BASE — defesa ADR-2026-09-17.
          if [[ -n "${BASE_SHA:-}" ]] && \
             git cat-file -e "${BASE_SHA}:scripts/check-shim-diff-applies.sh" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/check-shim-diff-applies.sh" \
              > "$RUNNER_TEMP/classifier-base.sh"
            bash "$RUNNER_TEMP/classifier-base.sh" --classify
          else
            # Script ausente na BASE ou BASE_SHA vazio: D2 — aplicável, job sucede.
            echo "classificador ausente na BASE ou BASE_SHA vazio → aplicável (D2)"
            echo "diff_is_inert=false" >> "$GITHUB_OUTPUT"
          fi

      - name: self-test do classificador (versão HEAD)
        run: bash scripts/check-shim-diff-applies.sh --self-test

  # ML-4E / ML-1A: job de RECOLHIMENTO do shim-byte-identity.
  #
  # Por que existe: shim-byte-identity é MATRIZ (macos-latest, ubuntu-latest) e os
  # nomes de check que ela emite são "shim-byte-identity (macos-latest)" e
  # "(ubuntu-latest)". Exigir "shim-byte-identity" cru em required_status_checks
  # deixa o check PENDENTE PARA SEMPRE e trava todo PR — inclusive o que
  # consertaria (vault: matriz-em-job-required-por-nome-fica-pendente-para-sempre-2026-09-08.md).
  # Este job tem nome estável e é ele que entra no conjunto R.
  #
  # Ambas as guardas (`parity` e esta) exigem evidência positiva: aceitam
  # somente result=="success" (lista de permitidos). O `parity` usa
  # scripts/check-needs-success.sh (REQ-2026-11-12); este job usa a
  # verificação inline acima. A distinção histórica (PR #365: 'skipped'
  # passava na guarda de lista de proibidos do `parity`) não se aplica mais
  # — ambas usam lista de permitidos. ESTE job não tem segunda linha de
  # defesa por artefatos, então a verificação inline continua obrigatória.
  #
  # Regra de dispensa (ADR-2026-11-06 D1/D2): os braços são pulados SOMENTE
  # quando o job classify passou com diff_is_inert=true, o que exige:
  #   • evento pull_request contra a branch padrão;
  #   • TODOS os arquivos do diff dentro do conjunto inerte (docs/, vault/,
  #     .claude/agent-memory/, *.md raiz — ver check-shim-diff-applies.sh);
  #   • classificação feita pela versão BASE do script (ADR-2026-09-17).
  # Em todo o resto — push para main, tag, evento diferente, diff misto,
  # classify falhando — evidência positiva continua obrigatória.
  # Execução cancelada (!cancelled()) não enfileira runner macOS.
  shim-byte-identity-gate:
    runs-on: ubuntu-latest
    needs: [classify, shim-byte-identity]
    if: always()
    steps:
      - name: Avaliar gate
        env:
          EVENT_NAME:      ${{ github.event_name }}
          BASE_REF:        ${{ github.base_ref }}
          DEFAULT_BRANCH:  ${{ github.event.repository.default_branch }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DIFF_IS_INERT:   ${{ needs.classify.outputs.diff_is_inert }}
          SHIM_RESULT:     ${{ needs.shim-byte-identity.result }}
        run: |
          # 1) classify DEVE ter sucedido — sem isso o gate sempre falha.
          #    Garante que --self-test vermelho bloqueia o merge (defesa T6).
          if [[ "$CLASSIFY_RESULT" != "success" ]]; then
            echo "::error::classify result=$CLASSIFY_RESULT — o classificador de diff não concluiu com sucesso."
            exit 1
          fi
          # 2) Condição de dispensa: PR + base padrão + diff inerte
          if [[ "$EVENT_NAME" == "pull_request" &&
                -n "$BASE_REF" &&
                "$BASE_REF" == "$DEFAULT_BRANCH" &&
                "$DIFF_IS_INERT" == "true" ]]; then
            echo "não aplicável: o diff só toca caminhos inertes (lista no job classify)"
            exit 0
          fi
          # 3) Em todo o resto: exige braços com sucesso.
          #    'skipped', 'failure' e 'cancelled' reprovam — um braço pulado não
          #    prova byte-identidade, e um required check verde sobre nada
          #    verificado é pior que check nenhum.
          if [[ "$SHIM_RESULT" == "success" ]]; then
            echo "shim-byte-identity: todos os braços da matriz com sucesso."
            exit 0
          fi
          echo "::error::shim-byte-identity resultou '$SHIM_RESULT' (esperado: success) — a byte-identidade do shim NÃO foi verificada nesta corrida."
          exit 1

  parity:
    runs-on: ubuntu-latest
    needs: [parity-falsify-shard, parity-other-gates, check-required-checks]
    if: always()
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Todos os jobs de needs devem ter resultado success (allowlist)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: scripts/check-needs-success.sh parity-falsify-shard parity-other-gates check-required-checks
      - name: Baixa os rótulos emitidos por cada shard de falsify
        uses: actions/download-artifact@v4
        with:
          pattern: falsify-shard-*
          path: falsify-shard-artifacts
          merge-multiple: true
      # Guarda de CONJUNTO entre shards -- generalização do ML-2D para job.
      # Os rótulos ESPERADOS são recalculados AQUI, a partir do checkout
      # FRESCO deste job (nunca de algo que um shard alega ter esperado) --
      # só os rótulos EMITIDOS (fato observado, baixado dos artefatos) vêm
      # dos shards. Evita, em escala de job, o defeito auto-referencial que
      # o hades-tf achou no ML-2D em escala de processo.
      - name: Guarda de conjunto entre os shards de falsify
        run: scripts/check-falsify-shard-coverage.sh scripts/check-gates-falsify.sh "${{ env.FALSIFY_SHARD_COUNT }}" falsify-shard-artifacts

  # ---------------------------------------------------------------------------
  # AC1 — console cp1252 (REQ-2026-09-11-o-ciclo-testa-onde-funciona...)
  #
  # Roda o self-test do ratchet de Windows (check-windows-known-failures.py)
  # com o console simulado como cp1252 (PYTHONIOENCODING=cp1252, PYTHONUTF8=0).
  # O self-test exercita _st_print — o caminho que o #314 crashava com
  # UnicodeEncodeError antes do fix.
  #
  # DECLARAÇÃO DE RECONCILIAÇÃO: Este job afirma que _st_print codifica com
  # errors="replace" em vez de crashar quando o codec é cp1252 e o caractere é
  # U+2192 (→). Medição local (2026-09-11): com fix → exit 0; sem fix →
  # UnicodeEncodeError. Ver ML-1A do roadmap.
  #
  # CONTRA-BRAÇO (AC6): PYTHONIOENCODING=cp1252 é o ambiente; o self-test tem
  # 43 casos incluindo T1-T26 que usam descricões com → (U+2192). Se _st_print
  # fosse plain print(), 9+ casos crashariam antes de chegar ao resultado.
  # ---------------------------------------------------------------------------
  windows-gates-cp1252:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: "AC1 — self-test com codepage cp1252 (PYTHONIOENCODING=cp1252, PYTHONUTF8=0)"
        shell: bash
        run: |
          PYTHONIOENCODING=cp1252 PYTHONUTF8=0 python scripts/check-windows-known-failures.py --self-test

  # ---------------------------------------------------------------------------
  # AC2 — Windows sem privilégio de symlink (substituto por injeção)
  #
  # DESIGN REVISADO (2026-09-12, KG): O runner windows-latest roda como
  # administrador com SeCreateSymbolicLinkPrivilege no token. A remoção via
  # registro isolada não revoga o privilégio (run 34646752028, head 8105f148).
  # É necessário fechar AMBOS os portões: (a) registro
  # AllowDevelopmentWithoutDevLicense=0 e (b) AdjustTokenPrivileges/
  # SE_PRIVILEGE_REMOVED. O passo de medição tenta os dois e reporta o veredito
  # como informação — não falha o job independentemente do resultado.
  #
  # Independentemente do resultado da medição, os passos de substituto exercem
  # o MESMO caminho de código via injeção direta:
  #   • Go: go test -overlay injeta syscall.Errno(1314) em symlinkOrSkip
  #     (internal/generators/update_test.go) — isSymlinkPrivilegeError e t.Skipf
  #     reais são exercitados (não cópias).
  #   • Node: preload CJS patcha fs.symlinkSync para lançar EPERM — a função
  #     symlinkOrSkip real do arquivo de teste é exercitada.
  #   • Python: unittest.mock.patch('os.symlink') injeta OSError(winerror=1314) —
  #     _symlink_or_skip real de test_update_discover_symlink_guard.py é exercitada.
  #
  # O que este job afirma:
  #   Quando os.Symlink/fs.symlinkSync/os.symlink devolve erro de privilégio
  #   negado, os helpers PULAM o teste em vez de reprová-lo. Sem a guarda, o
  #   mesmo erro causa FALHA (falsificação por overlay/cópia modificada). Nenhum
  #   teste contorna o helper com chamada raw (grep de proteção).
  #
  # LIMITAÇÃO DECLARADA: o substituto não exercita o nó OS real — se surgir um
  # NOVO teste com chamada raw que compile com sucesso no runner, o grep de
  # proteção o detecta, mas o substituto por si só não. Se REAL_ENV=true, o
  # ambiente real está disponível e a limitação cai.
  # ---------------------------------------------------------------------------
  windows-symlink-unprivileged:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # ML-4C: setup-node and npm ci removed — npm/src and npm/tests deleted in ML-3A/ML-3B.
      # setup-python is kept: Go overlay steps use `python3 - << 'PYGENEOF'` heredocs.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ML-4C: npm ci removed (npm/src deleted) and pip install pypi/ removed
      # (pypi/trackfw/ deleted in ML-3A). Node/Python substituto and falsification
      # steps removed below — their test files (npm/tests/update_discover_symlink_guard.test.js
      # and pypi/tests/test_update_discover_symlink_guard.py) were deleted in ML-3B.

      - name: "Medição — registro=0 + AdjustTokenPrivileges: consegue negar os.Symlink?"
        shell: pwsh
        run: |
          # Garante que & nativo com exit!=0 nao aborte o step (acao de medicao, nao criterio de passe)
          $PSNativeCommandUseErrorActionPreference = $false
          # Compila sonda Go em diretório temporário
          $d = Join-Path $env:TEMP "syml-probe-$([System.Guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path $d | Out-Null
          @'
          package main
          import ("errors"; "fmt"; "os"; "syscall")
          func main() {
            t := os.TempDir() + `\sp-t`
            l := os.TempDir() + `\sp-l`
            _ = os.WriteFile(t, []byte("x"), 0644)
            defer os.Remove(t); defer os.Remove(l)
            err := os.Symlink(t, l)
            if err != nil {
              var en syscall.Errno
              if errors.As(err, &en) {
                fmt.Printf("FAIL errno=%d (%v)\n", en, err)
              } else {
                fmt.Printf("FAIL (%v)\n", err)
              }
              os.Exit(1)
            }
            fmt.Println("OK symlink succeeded")
          }
          '@ | Set-Content -Path (Join-Path $d "probe.go") -Encoding utf8
          "module symlink-probe`ngo 1.21" | Set-Content -Path (Join-Path $d "go.mod") -Encoding utf8
          Push-Location $d
          go build -o probe.exe . 2>&1 | Out-Null
          Pop-Location
          $probe = Join-Path $d "probe.exe"

          # Medição 1 — baseline (sem modificações)
          Write-Host "=== Medição 1: baseline ==="
          & $probe
          $base = $LASTEXITCODE

          # Portão 1: registro AllowDevelopmentWithoutDevLicense=0
          $reg = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          try {
            if (-not (Test-Path $reg)) { New-Item -Path $reg -Force | Out-Null }
            Set-ItemProperty -Path $reg -Name "AllowDevelopmentWithoutDevLicense" -Value 0 -Type DWord -Force
            $v = (Get-ItemProperty -Path $reg -ErrorAction SilentlyContinue).AllowDevelopmentWithoutDevLicense
            Write-Host "Registro: AllowDevelopmentWithoutDevLicense = $v"
          } catch {
            Write-Host "::warning::Registro falhou: $($_.Exception.Message)"
          }

          # Portão 2: token — AdjustTokenPrivileges remove SeCreateSymbolicLinkPrivilege
          Add-Type -Language CSharp @"
          using System;
          using System.Diagnostics;
          using System.Runtime.InteropServices;
          public class SymPrivHelper {
            [StructLayout(LayoutKind.Sequential, Pack = 1)]
            internal struct TokPriv1Luid {
              public int Count;
              public long Luid;
              public int Attr;
            }
            [DllImport("advapi32.dll", ExactSpelling = true, SetLastError = true)]
            static extern bool OpenProcessToken(IntPtr h, int acc, ref IntPtr tok);
            [DllImport("advapi32.dll", SetLastError = true, CharSet = CharSet.Unicode)]
            static extern bool LookupPrivilegeValue(string host, string name, ref long luid);
            [DllImport("advapi32.dll", ExactSpelling = true, SetLastError = true)]
            static extern bool AdjustTokenPrivileges(IntPtr tok, bool da,
              ref TokPriv1Luid n, int len, IntPtr prev, IntPtr relen);
            public static string Remove(string priv) {
              IntPtr hToken = IntPtr.Zero;
              if (!OpenProcessToken(Process.GetCurrentProcess().Handle, 0x0028, ref hToken))
                return "OpenProcessToken err=" + Marshal.GetLastWin32Error();
              TokPriv1Luid tp = new TokPriv1Luid { Count = 1, Luid = 0, Attr = 4 };
              if (!LookupPrivilegeValue(null, priv, ref tp.Luid))
                return "LookupPrivilegeValue err=" + Marshal.GetLastWin32Error();
              AdjustTokenPrivileges(hToken, false, ref tp, 0, IntPtr.Zero, IntPtr.Zero);
              int last = Marshal.GetLastWin32Error();
              return last == 0 ? "OK" : "AdjustTokenPrivileges err=" + last;
            }
          }
          "@
          Write-Host "Token adjustment: $([SymPrivHelper]::Remove('SeCreateSymbolicLinkPrivilege'))"

          # Medição 2 — após registro=0 + token removido
          Write-Host "=== Medição 2: após registro=0 + remoção de token ==="
          & $probe
          $post = $LASTEXITCODE

          # Veredito
          if ($post -ne 0) {
            Write-Host "VEREDITO: Ambiente real disponível — os.Symlink falhou (errno=1314)"
            "REAL_ENV=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            Write-Host "VEREDITO: Ambiente real INDISPONÍVEL — os.Symlink ainda tem sucesso após ambos os portões"
            Write-Host "::warning::Limitação ML-1B: runner não permite revogar o privilégio de symlink. O substituto por injeção exercitará o caminho de código."
            "REAL_ENV=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          Write-Host "Baseline: $(if ($base -eq 0) { 'OK (symlink succeeded)' } else { 'FAIL (denied)' })"
          Write-Host "Pos-ajuste: $(if ($post -eq 0) { 'OK (still succeeds)' } else { 'FAIL (denied -- real env)' })"
          Remove-Item -Recurse -Force $d -ErrorAction SilentlyContinue
          # Step de medicao: nunca falha -- resultado vai para GITHUB_ENV para uso pelos passos seguintes
          exit 0

      - name: "Go — substituto: symlinkOrSkip pula ao receber errno 1314 (overlay)"
        shell: bash
        run: |
          set -euo pipefail
          # Cria versão injetada de update_test.go: substitui os.Symlink por *os.LinkError wrapping errno 1314
          # Exercita isSymlinkPrivilegeError e t.Skipf REAIS (não cópias)
          python3 - << 'PYGENEOF'
          import os, json
          cwd = os.getcwd()
          src = os.path.join(cwd, 'internal', 'generators', 'update_test.go')
          inject = os.path.join(cwd, '_ci_inject_update_test.go')
          content = open(src, encoding='utf-8').read()
          needle = 'err := os.Symlink(target, link)'
          q = chr(34)
          replacement = (
              'err := error(&os.LinkError{Op: ' + q + 'symlink' + q + ', Old: target, New: link,'
              ' Err: syscall.Errno(1314)}) // SUBSTITUTE: simula privilegio negado'
          )
          count = content.count(needle)
          assert count >= 1, f'Injecao Go substituto: padrao nao encontrado em {src} (count={count})'
          injected = content.replace(needle, replacement)
          open(inject, 'w', encoding='utf-8').write(injected)
          open('_ci_overlay_inject.json', 'w').write(json.dumps({'Replace': {src: inject}}))
          print(f'Injecao: {count} ocorrencia(s) substituida(s)')
          PYGENEOF

          echo "=== Go substituto: errno 1314 injetado via overlay ==="
          OUT=$(go test -overlay=_ci_overlay_inject.json ./internal/generators/... \
            -run "TestUpdateNeverWritesThrough" -v -count=1 -timeout 60s 2>&1 || true)
          echo "$OUT"

          if echo "$OUT" | grep -e "--- SKIP" >/dev/null; then
            echo "PASS: Go substituto -- symlinkOrSkip pulou com errno 1314 (isSymlinkPrivilegeError + t.Skipf reais exercitados)"
          else
            echo "::error::Go substituto FALHOU: teste nao pulou com errno 1314 injetado"
            exit 1
          fi
          if echo "$OUT" | grep -e "--- FAIL" >/dev/null; then
            echo "::error::Go substituto: teste FALHOU em vez de PULAR"
            exit 1
          fi

      - name: "Go — falsificacao: sem a guarda, errno 1314 causa FAIL (overlay)"
        shell: bash
        run: |
          set -euo pipefail
          # Cria versão falsificada: injeta *os.LinkError(errno=1314) E desabilita isSymlinkPrivilegeError
          # Padrão: if false && isSymlinkPrivilegeError(err) — como em check-serve-api-file-security.sh
          python3 - << 'PYGENFALSEOF'
          import os, json
          cwd = os.getcwd()
          src = os.path.join(cwd, 'internal', 'generators', 'update_test.go')
          falsify = os.path.join(cwd, '_ci_falsify_update_test.go')
          content = open(src, encoding='utf-8').read()
          needle = 'err := os.Symlink(target, link)'
          q = chr(34)
          replacement = (
              'err := error(&os.LinkError{Op: ' + q + 'symlink' + q + ', Old: target, New: link,'
              ' Err: syscall.Errno(1314)}) // SUBSTITUTE: simula privilegio negado'
          )
          count_inj = content.count(needle)
          assert count_inj >= 1, f'Falsificacao Go: padrao de injecao nao encontrado em {src} (count={count_inj})'
          guard_needle = 'if isSymlinkPrivilegeError(err) {'
          count_grd = content.count(guard_needle)
          assert count_grd >= 1, f'Falsificacao Go: padrao de guarda nao encontrado em {src} (count={count_grd})'
          falsified = (
              content
              .replace(needle, replacement)
              .replace(guard_needle, 'if false && isSymlinkPrivilegeError(err) { // FALSIFIED: guarda desabilitada')
          )
          open(falsify, 'w', encoding='utf-8').write(falsified)
          open('_ci_overlay_falsify.json', 'w').write(json.dumps({'Replace': {src: falsify}}))
          print(f'Falsificacao: injecao={count_inj} guarda={count_grd} ocorrencia(s)')
          PYGENFALSEOF

          echo "=== Go falsificacao: overlay com guarda desabilitada ==="
          OUT=$(go test -overlay=_ci_overlay_falsify.json ./internal/generators/... \
            -run "TestUpdateNeverWritesThrough" -v -count=1 -timeout 60s 2>&1 || true)
          echo "$OUT"

          if echo "$OUT" | grep -e "--- FAIL" >/dev/null; then
            echo "PASS: Go falsificacao -- sem a guarda, errno 1314 causa FAIL (guarda é carga-sustentante)"
          else
            echo "::error::Go falsificacao FALHOU: esperava --- FAIL sem a guarda, got: $OUT"
            exit 1
          fi

      # ML-4C: Node substituto and Node falsificacao steps removed.
      # npm/tests/update_discover_symlink_guard.test.js was deleted in ML-3B.
      # The guard property (symlinkOrSkip skips on EPERM) now lives only in Go.

      # ML-4C: Python substituto and Python falsificacao steps removed.
      # pypi/tests/test_update_discover_symlink_guard.py was deleted in ML-3B.

      - name: "Protecao — nenhuma chamada raw a os.Symlink em testes Go"
        shell: bash
        run: |
          set -euo pipefail
          # ML-4C: Node and Python grep sections removed — npm/tests and pypi/tests deleted
          # in ML-3B. Go guard files remain; this check ensures no raw os.Symlink() bypass.
          # Grep busca chamadas raw nos arquivos Go que DEVEM usar o helper de guarda,
          # excluindo as linhas que sao a implementacao do proprio helper.
          # Outros arquivos de teste (serve_api, discover, etc.) usam raw legitimamente.
          echo "=== Protecao: grep de bypass de guarda nos arquivos Go de guarda ==="

          GO_BYPASS=$(grep -n "os\.Symlink(" \
              internal/generators/update_test.go \
              internal/integrations/manager_test.go \
            | grep -v 'err := os\.Symlink(target, link)' \
            | grep -v 't\.Fatalf("os\.Symlink' || true)

          FAIL=0
          if [[ -n "$GO_BYPASS" ]]; then
            echo "::error::Guard bypass Go: chamada raw os.Symlink() fora do helper:"
            echo "$GO_BYPASS"
            FAIL=1
          fi

          if [[ $FAIL -eq 0 ]]; then
            echo "PASS: Nenhuma chamada raw encontrada -- testes Go usam o helper de guarda"
          else
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # ML-1D (v8 ROADMAP-2026-09-12-v8-um-binario-muitos-canais): AC9 — byte-identidade
  # do shim npm/bin/trackfw.js. Prova que 5 comandos produzem saída e exit code
  # byte-idênticos entre o binário nativo Go e o shim Node.js (≥4 SUBSTANTIVE).
  # Roda em ubuntu-latest (Linux/x64) e macos-latest (macOS/arm64).
  # Windows: Pergunta 15 do windows-probe.yml (PowerShell, mantido separado).
  # ---------------------------------------------------------------------------
  shim-byte-identity:
    needs: [classify]
    if: >-
      !cancelled() &&
      !(needs.classify.result == 'success' &&
        needs.classify.outputs.diff_is_inert == 'true')
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: "byte-identity gate (AC9 — ML-1D)"
        run: scripts/check-shim-byte-identity.sh

  # ---------------------------------------------------------------------------
  # ML-3B (ROADMAP-2026-11-15-cobertura-e-compatibilidade-completas-do-trackfw-no-windows):
  # Smoke test dos dois canais de distribuição (npm + PyPI) no Windows.
  # Instala SOMENTE de artefatos locais do PR — nunca do registro público.
  # Cada canal é testado em pwsh E em cmd.exe (6 asserções por célula:
  # 4 positivas + 2 do braço de falsificação).
  #
  # Braco de falsificacao — medido localmente (macOS), esperado identico no Windows:
  #   guard git-branch   stdin vazio ou so CRLF → rc=0  (nenhum subcomando; rc com payload JSON: 2)
  #   guard write-scope  stdin vazio ou so CRLF → rc=2  (fail-closed: JSON ausente; rc com payload: 0)
  # Medido com printf '' | e printf '\r\n' |: ambas as formas produzem os mesmos rcs.
  # PS envia CRLF ("" |); cmd envia CRLF (echo.); < NUL daria stdin verdadeiramente vazio.
  # Referencia: internal/guard/gitbranch.go Step 0b+1 (ExtractCommand → "" / "\r\n"
  #              → no match → 0); internal/guard/writescope.go Step 2 (trimmed empty
  #              → not JSON → return 2).
  # CI do PR #688 é a prova definitiva no Windows.
  #
  # Nota: required-status-checks.txt nao e alterado aqui — ML-3C declara este job.
  # Nota npm/pwsh: PATH prepend resolve trackfw.ps1 (wrapper PS nativo do npm);
  #   npm/cmd usa trackfw.cmd (NPM_TRACKFW) com "call" obrigatorio.
  # ---------------------------------------------------------------------------
  windows-package-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependência build_wheel.py
        run: python -m pip install --upgrade pip packaging

      - name: Build Go binary windows/amd64
        # vault/notes/go-build-no-exe-suffix-exec-lookpath-falha-no-windows-2026-10-16.md:
        # o sufixo .exe é obrigatório; sem ele, exec.LookPath não encontra o binário no Windows.
        shell: pwsh
        run: go build -o bin/trackfw.exe ./cmd/trackfw

      - name: Instalar canal npm (artefato local, --global --prefix isolado)
        id: npm-setup
        shell: pwsh
        run: |
          $npmGlobalDir = Join-Path $env:RUNNER_TEMP "npm-global"
          $npmPackDir   = Join-Path $env:RUNNER_TEMP "npm-pack"
          $npmCacheDir  = Join-Path $env:RUNNER_TEMP "npm-cache"
          New-Item -ItemType Directory -Force -Path $npmGlobalDir | Out-Null
          New-Item -ItemType Directory -Force -Path $npmPackDir   | Out-Null
          New-Item -ItemType Directory -Force -Path $npmCacheDir  | Out-Null

          # Bloquear qualquer acesso ao registro público npm durante todo o passo
          $env:NPM_CONFIG_REGISTRY = 'http://127.0.0.1:9/'
          $env:NPM_CONFIG_CACHE    = $npmCacheDir

          # Lê versão do único sítio de versão no npm (npm/package.json)
          $version = node -e "process.stdout.write(require('./npm/package.json').version)"
          Write-Host "Versão: $version"

          # 1. Pack o shim — mesmo mecanismo da release (npm pack ./npm)
          npm pack --silent --pack-destination $npmPackDir ./npm
          $shimTgz = Join-Path $npmPackDir "trackfw-$version.tgz"
          if (-not (Test-Path $shimTgz)) {
            Write-Host "Conteúdo de $npmPackDir :"
            Get-ChildItem $npmPackDir | ForEach-Object { Write-Host "  $($_.Name)" }
            Write-Error "shimTgz não encontrado: $shimTgz"; exit 1
          }
          Write-Host "Shim tarball: $shimTgz"

          # 2. Criar pacote de plataforma @trackfw-bin/win32-x64 —
          #    mesma estrutura que scripts/gen-platform-manifests.sh gera na release
          #    (campos: name, version, description, os, cpu, files; sem "bin", AC13)
          $platDir = Join-Path $env:RUNNER_TEMP "win32-x64-pkg"
          New-Item -ItemType Directory -Force -Path "$platDir\bin" | Out-Null
          Copy-Item -Path "bin\trackfw.exe" -Destination "$platDir\bin\trackfw.exe"
          $pkgJson = '{"name":"@trackfw-bin/win32-x64","version":"' + $version + '","description":"trackfw binary for win32 x64","os":["win32"],"cpu":["x64"],"files":["bin/trackfw.exe"]}'
          $pkgJson | Set-Content -Path "$platDir\package.json" -Encoding utf8

          npm pack --silent --pack-destination $npmPackDir $platDir
          $platTgz = Join-Path $npmPackDir "trackfw-bin-win32-x64-$version.tgz"
          if (-not (Test-Path $platTgz)) {
            Write-Host "Conteúdo de $npmPackDir :"
            Get-ChildItem $npmPackDir | ForEach-Object { Write-Host "  $($_.Name)" }
            Write-Error "platTgz não encontrado: $platTgz"; exit 1
          }
          Write-Host "Platform tarball: $platTgz"

          # 3. Instalar globalmente com prefix isolado (nunca toca registro público;
          #    NPM_CONFIG_REGISTRY acima garante ECONNREFUSED se algo tentar o registro)
          npm install --global --prefix $npmGlobalDir --no-audit --no-fund `
            $shimTgz $platTgz

          # npm --global --prefix no Windows cria <prefix>\trackfw.cmd (e trackfw.ps1)
          $npmCmd = Join-Path $npmGlobalDir "trackfw.cmd"
          if (-not (Test-Path $npmCmd)) {
            Write-Host "Conteúdo de $npmGlobalDir :"
            Get-ChildItem $npmGlobalDir | ForEach-Object { Write-Host "  $($_.Name)" }
            Write-Error "trackfw.cmd não encontrado em $npmGlobalDir"; exit 1
          }
          Write-Host "npm .cmd wrapper: $npmCmd"

          $npmPlatExe = Join-Path $npmGlobalDir "node_modules\@trackfw-bin\win32-x64\bin\trackfw.exe"
          "NPM_TRACKFW=$npmCmd"            >> $env:GITHUB_ENV
          "NPM_GLOBAL_DIR=$npmGlobalDir"   >> $env:GITHUB_ENV
          "NPM_PLATFORM_EXE=$npmPlatExe"  >> $env:GITHUB_ENV

      - name: Instalar canal PyPI (wheel local, venv isolado)
        id: pypi-setup
        shell: pwsh
        run: |
          $version   = node -e "process.stdout.write(require('./npm/package.json').version)"
          $wheelsDir = Join-Path $env:RUNNER_TEMP "wheels"
          $venvDir   = Join-Path $env:RUNNER_TEMP "pypi-venv"
          New-Item -ItemType Directory -Force -Path $wheelsDir | Out-Null

          # Mesmo mecanismo da release (release.yml: build_wheel windows amd64 trackfw.exe win_amd64)
          python pypi/scripts/build_wheel.py `
            --binary   bin/trackfw.exe `
            --version  $version `
            --platform win_amd64 `
            --output   $wheelsDir

          $wheel = (Get-ChildItem $wheelsDir -Filter "*.whl" | Select-Object -First 1).FullName
          if (-not $wheel) { Write-Error "wheel não encontrado em $wheelsDir"; exit 1 }
          Write-Host "Wheel: $wheel"

          python -m venv $venvDir
          # --no-index: instala APENAS o wheel local, nunca vai ao PyPI
          & "$venvDir\Scripts\pip.exe" install --no-index --quiet $wheel

          $pypiExe = Join-Path $venvDir "Scripts\trackfw.exe"
          if (-not (Test-Path $pypiExe)) {
            Write-Error "trackfw.exe não encontrado em $venvDir\Scripts"; exit 1
          }
          Write-Host "PyPI channel exe: $pypiExe"
          "PYPI_TRACKFW=$pypiExe" >> $env:GITHUB_ENV

      - name: Verificar integridade dos binários instalados (hash == bin/trackfw.exe)
        shell: pwsh
        run: |
          $built    = (Get-FileHash -Algorithm SHA256 "bin\trackfw.exe").Hash
          $npmHash  = (Get-FileHash -Algorithm SHA256 $env:NPM_PLATFORM_EXE).Hash
          $pypiHash = (Get-FileHash -Algorithm SHA256 $env:PYPI_TRACKFW).Hash
          Write-Host "Built:  $built"
          Write-Host "npm:    $npmHash"
          Write-Host "PyPI:   $pypiHash"
          if ($npmHash  -ne $built) { Write-Error "npm: hash diverge de bin/trackfw.exe";  exit 1 }
          if ($pypiHash -ne $built) { Write-Error "PyPI: hash diverge de bin/trackfw.exe"; exit 1 }
          Write-Host "PASS: ambos os canais instalaram o binário do PR"

      - name: Criar fixture mínima para validate e guard
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "fixture"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "name: smoke-test" | Set-Content -Path "$dir\trackfw.yaml" -Encoding utf8
          foreach ($sub in @(
            "docs\req",
            "docs\roadmaps\backlog",   "docs\roadmaps\wip",
            "docs\roadmaps\done",      "docs\roadmaps\abandoned",
            "docs\roadmaps\analyzing", "docs\roadmaps\blocked"
          )) {
            New-Item -ItemType Directory -Force -Path "$dir\$sub" | Out-Null
          }
          "FIXTURE_DIR=$dir" >> $env:GITHUB_ENV
          Write-Host "Fixture: $dir"

      # ─── Canal npm / PowerShell ──────────────────────────────────────────────
      # trackfw.ps1 é o wrapper que PS resolve quando o prefix está no PATH.
      # trackfw.cmd é mantido em NPM_TRACKFW para o cell cmd abaixo.
      - name: "[npm / pwsh] smoke"
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = 'Continue'
          $n = 0

          # Prepend do prefix no PATH para que PS resolva trackfw.ps1 (o wrapper PS nativo)
          $env:PATH = $env:NPM_GLOBAL_DIR + ";" + $env:PATH
          $cmd = Get-Command trackfw -ErrorAction Stop
          Write-Host "trackfw resolvido: $($cmd.Source) (CommandType=$($cmd.CommandType))"
          if ($cmd.CommandType -ne 'ExternalScript' -or $cmd.Source -notlike '*.ps1') {
            Write-Error "npm/pwsh: esperado ExternalScript *.ps1, resolveu $($cmd.CommandType) $($cmd.Source)"; exit 1
          }

          # Asserção 1 — trackfw --version → rc=0
          # Afirma: o wrapper npm instalado no PATH do PowerShell responde ao CLI básico.
          trackfw --version
          if ($LASTEXITCODE -ne 0) { Write-Error "npm/pwsh: --version rc=$LASTEXITCODE (esperado 0)"; exit 1 }
          Write-Host "PASS 1: npm/pwsh --version rc=0"; $n++

          Push-Location $env:FIXTURE_DIR
          try {
            # Asserção 2 — trackfw validate → rc=0
            # Afirma: fixture mínima é aceita pelo validate sem violações (canal npm via PS).
            trackfw validate
            if ($LASTEXITCODE -ne 0) { Write-Error "npm/pwsh: validate rc=$LASTEXITCODE (esperado 0)"; exit 1 }
            Write-Host "PASS 2: npm/pwsh validate rc=0"; $n++

            # Asserção 3 — guard git-branch com payload JSON → rc=2
            # Afirma: guard git-branch bloqueia `git branch <nome>` via JSON no PowerShell (canal npm).
            '{"tool_name":"Bash","tool_input":{"command":"git branch foo"}}' | trackfw guard git-branch
            if ($LASTEXITCODE -ne 2) { Write-Error "npm/pwsh: guard git-branch rc=$LASTEXITCODE (esperado 2)"; exit 1 }
            Write-Host "PASS 3: npm/pwsh guard git-branch rc=2"; $n++

            # Asserção 4 — guard write-scope com Write dentro do projeto → rc=0
            # Afirma: guard write-scope permite escrita em arquivo nao-frozen no PowerShell (canal npm).
            $fwPath = ($env:FIXTURE_DIR + '\README.md') -replace '\\','/'
            ('{"tool_name":"Write","tool_input":{"file_path":"' + $fwPath + '"}}') | trackfw guard write-scope
            if ($LASTEXITCODE -ne 0) { Write-Error "npm/pwsh: guard write-scope rc=$LASTEXITCODE (esperado 0)"; exit 1 }
            Write-Host "PASS 4: npm/pwsh guard write-scope rc=0"; $n++

            # Falsificacao 5 — git-branch stdin CRLF → rc=0 (normal seria 2)
            # Afirma: rc=2 do positive arm (npm/pwsh) vem do payload JSON, nao de outro fator.
            "" | trackfw guard git-branch
            if ($LASTEXITCODE -ne 0) { Write-Error "npm/pwsh falsify: git-branch CRLF rc=$LASTEXITCODE (esperado 0)"; exit 1 }
            Write-Host "PASS 5: npm/pwsh falsify git-branch CRLF stdin rc=0"; $n++

            # Falsificacao 6 — write-scope stdin CRLF → rc=2 (normal seria 0)
            # Afirma: rc=0 do positive arm (npm/pwsh) vem do payload JSON, nao de allow-all acidental.
            "" | trackfw guard write-scope
            if ($LASTEXITCODE -ne 2) { Write-Error "npm/pwsh falsify: write-scope CRLF rc=$LASTEXITCODE (esperado 2)"; exit 1 }
            Write-Host "PASS 6: npm/pwsh falsify write-scope CRLF stdin rc=2"; $n++
          } finally {
            Pop-Location
          }

          if ($n -ne 6) { Write-Error "npm/pwsh: apenas $n/6 assercoes executaram"; exit 1 }
          Write-Host "ALL 6 PASSED npm/pwsh"
          exit 0

      # ─── Canal npm / cmd.exe ─────────────────────────────────────────────────
      # Nota: "call" é obrigatório para invocar .cmd de dentro de .cmd/.bat —
      # sem ele, o controle não retorna e as asserções seguintes não executam.
      # A RHS de um pipe roda em processo filho, portanto não precisa de "call".
      - name: "[npm / cmd] smoke"
        shell: cmd
        run: |
          @echo off
          setlocal enabledelayedexpansion
          set N=0
          set "FX=%FIXTURE_DIR:\=/%"

          :: Assercao 1 -- trackfw --version -> rc=0
          :: Afirma: o binario Go instalado pelo canal npm responde ao CLI basico no cmd.exe.
          call "%NPM_TRACKFW%" --version
          if errorlevel 1 (echo FAIL npm/cmd: --version rc not 0 & exit /b 1)
          echo PASS 1: npm/cmd --version rc=0
          set /a N+=1

          cd /d "%FIXTURE_DIR%"

          :: Assercao 2 -- trackfw validate -> rc=0
          :: Afirma: fixture minima aceita pelo validate sem violacoes no cmd.exe.
          call "%NPM_TRACKFW%" validate
          if errorlevel 1 (echo FAIL npm/cmd: validate & exit /b 1)
          echo PASS 2: npm/cmd validate rc=0
          set /a N+=1

          :: Assercao 3 -- guard git-branch -> rc=2
          :: Afirma: guard git-branch bloqueia git branch via JSON no cmd.exe.
          echo {"tool_name":"Bash","tool_input":{"command":"git branch foo"}} | "%NPM_TRACKFW%" guard git-branch
          set GIT_RC=!ERRORLEVEL!
          if not !GIT_RC!==2 (echo FAIL npm/cmd: guard git-branch rc=!GIT_RC! esperado 2 & exit /b 1)
          echo PASS 3: npm/cmd guard git-branch rc=2
          set /a N+=1

          :: Assercao 4 -- guard write-scope -> rc=0
          :: Afirma: guard write-scope permite escrita em arquivo nao-frozen no cmd.exe.
          echo {"tool_name":"Write","tool_input":{"file_path":"%FX%/README.md"}} | "%NPM_TRACKFW%" guard write-scope
          set WS_RC=!ERRORLEVEL!
          if not !WS_RC!==0 (echo FAIL npm/cmd: guard write-scope rc=!WS_RC! esperado 0 & exit /b 1)
          echo PASS 4: npm/cmd guard write-scope rc=0
          set /a N+=1

          :: Falsificacao 5 -- git-branch CRLF stdin -> rc=0
          :: Afirma: rc=2 do positive arm vem do payload JSON, nao de outro fator.
          echo. | "%NPM_TRACKFW%" guard git-branch
          set GIT_F=!ERRORLEVEL!
          if not !GIT_F!==0 (echo FAIL npm/cmd falsify: git-branch CRLF rc=!GIT_F! esperado 0 & exit /b 1)
          echo PASS 5: npm/cmd falsify git-branch CRLF stdin rc=0
          set /a N+=1

          :: Falsificacao 6 -- write-scope CRLF stdin -> rc=2
          :: Afirma: rc=0 do positive arm vem do payload JSON, nao de allow-all acidental.
          echo. | "%NPM_TRACKFW%" guard write-scope
          set WS_F=!ERRORLEVEL!
          if not !WS_F!==2 (echo FAIL npm/cmd falsify: write-scope CRLF rc=!WS_F! esperado 2 & exit /b 1)
          echo PASS 6: npm/cmd falsify write-scope CRLF stdin rc=2
          set /a N+=1

          if not !N!==6 (echo FAIL: apenas !N!/6 assercoes executaram & exit /b 1)
          echo ALL 6 PASSED npm/cmd
          exit /b 0

      # ─── Canal PyPI / PowerShell ──────────────────────────────────────────────
      - name: "[pypi / pwsh] smoke"
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = 'Continue'
          $n = 0

          # Asserção 1 — trackfw --version → rc=0
          # Afirma: o binário Go instalado pelo canal PyPI responde ao CLI básico no PowerShell.
          & $env:PYPI_TRACKFW --version
          if ($LASTEXITCODE -ne 0) { Write-Error "pypi/pwsh: --version rc=$LASTEXITCODE (esperado 0)"; exit 1 }
          Write-Host "PASS 1: pypi/pwsh --version rc=0"; $n++

          Push-Location $env:FIXTURE_DIR
          try {
            # Asserção 2 — trackfw validate → rc=0
            # Afirma: fixture mínima é aceita pelo validate sem violações (canal PyPI).
            & $env:PYPI_TRACKFW validate
            if ($LASTEXITCODE -ne 0) { Write-Error "pypi/pwsh: validate rc=$LASTEXITCODE (esperado 0)"; exit 1 }
            Write-Host "PASS 2: pypi/pwsh validate rc=0"; $n++

            # Asserção 3 — guard git-branch com payload JSON → rc=2
            # Afirma: guard git-branch bloqueia `git branch <nome>` via JSON no PowerShell (canal PyPI).
            '{"tool_name":"Bash","tool_input":{"command":"git branch foo"}}' | & $env:PYPI_TRACKFW guard git-branch
            if ($LASTEXITCODE -ne 2) { Write-Error "pypi/pwsh: guard git-branch rc=$LASTEXITCODE (esperado 2)"; exit 1 }
            Write-Host "PASS 3: pypi/pwsh guard git-branch rc=2"; $n++

            # Asserção 4 — guard write-scope com Write dentro do projeto → rc=0
            # Afirma: guard write-scope permite escrita em arquivo não-frozen no PowerShell (canal PyPI).
            $fwPath = ($env:FIXTURE_DIR + '\README.md') -replace '\\','/'
            ('{"tool_name":"Write","tool_input":{"file_path":"' + $fwPath + '"}}') | & $env:PYPI_TRACKFW guard write-scope
            if ($LASTEXITCODE -ne 0) { Write-Error "pypi/pwsh: guard write-scope rc=$LASTEXITCODE (esperado 0)"; exit 1 }
            Write-Host "PASS 4: pypi/pwsh guard write-scope rc=0"; $n++

            # Falsificacao 5 — git-branch stdin CRLF → rc=0 (normal seria 2)
            # Afirma: rc=2 do positive arm (canal PyPI) vem do payload JSON, nao de outro fator.
            "" | & $env:PYPI_TRACKFW guard git-branch
            if ($LASTEXITCODE -ne 0) { Write-Error "pypi/pwsh falsify: git-branch CRLF rc=$LASTEXITCODE (esperado 0)"; exit 1 }
            Write-Host "PASS 5: pypi/pwsh falsify git-branch CRLF stdin rc=0"; $n++

            # Falsificacao 6 — write-scope stdin CRLF → rc=2 (normal seria 0)
            # Afirma: rc=0 do positive arm (canal PyPI) vem do payload JSON, nao de allow-all acidental.
            "" | & $env:PYPI_TRACKFW guard write-scope
            if ($LASTEXITCODE -ne 2) { Write-Error "pypi/pwsh falsify: write-scope CRLF rc=$LASTEXITCODE (esperado 2)"; exit 1 }
            Write-Host "PASS 6: pypi/pwsh falsify write-scope CRLF stdin rc=2"; $n++
          } finally {
            Pop-Location
          }

          if ($n -ne 6) { Write-Error "pypi/pwsh: apenas $n/6 assercoes executaram"; exit 1 }
          Write-Host "ALL 6 PASSED pypi/pwsh"
          exit 0

      # ─── Canal PyPI / cmd.exe ────────────────────────────────────────────────
      # Nota: PyPI instala um .exe; não precisa de "call" (apenas .cmd/.bat precisam).
      - name: "[pypi / cmd] smoke"
        shell: cmd
        run: |
          @echo off
          setlocal enabledelayedexpansion
          set N=0
          set "FX=%FIXTURE_DIR:\=/%"

          :: Assercao 1 -- trackfw --version -> rc=0
          :: Afirma: o binario Go instalado pelo canal PyPI responde ao CLI basico no cmd.exe.
          "%PYPI_TRACKFW%" --version
          if errorlevel 1 (echo FAIL pypi/cmd: --version rc not 0 & exit /b 1)
          echo PASS 1: pypi/cmd --version rc=0
          set /a N+=1

          cd /d "%FIXTURE_DIR%"

          :: Assercao 2 -- trackfw validate -> rc=0
          :: Afirma: fixture minima aceita pelo validate sem violacoes no cmd.exe (canal PyPI).
          "%PYPI_TRACKFW%" validate
          if errorlevel 1 (echo FAIL pypi/cmd: validate & exit /b 1)
          echo PASS 2: pypi/cmd validate rc=0
          set /a N+=1

          :: Assercao 3 -- guard git-branch -> rc=2
          :: Afirma: guard git-branch bloqueia git branch via JSON no cmd.exe (canal PyPI).
          echo {"tool_name":"Bash","tool_input":{"command":"git branch foo"}} | "%PYPI_TRACKFW%" guard git-branch
          set GIT_RC=!ERRORLEVEL!
          if not !GIT_RC!==2 (echo FAIL pypi/cmd: guard git-branch rc=!GIT_RC! esperado 2 & exit /b 1)
          echo PASS 3: pypi/cmd guard git-branch rc=2
          set /a N+=1

          :: Assercao 4 -- guard write-scope -> rc=0
          :: Afirma: guard write-scope permite escrita em arquivo nao-frozen no cmd.exe (canal PyPI).
          echo {"tool_name":"Write","tool_input":{"file_path":"%FX%/README.md"}} | "%PYPI_TRACKFW%" guard write-scope
          set WS_RC=!ERRORLEVEL!
          if not !WS_RC!==0 (echo FAIL pypi/cmd: guard write-scope rc=!WS_RC! esperado 0 & exit /b 1)
          echo PASS 4: pypi/cmd guard write-scope rc=0
          set /a N+=1

          :: Falsificacao 5 -- git-branch CRLF stdin -> rc=0
          :: Afirma: rc=2 do positive arm (PyPI) vem do payload JSON, nao de outro fator.
          echo. | "%PYPI_TRACKFW%" guard git-branch
          set GIT_F=!ERRORLEVEL!
          if not !GIT_F!==0 (echo FAIL pypi/cmd falsify: git-branch CRLF rc=!GIT_F! esperado 0 & exit /b 1)
          echo PASS 5: pypi/cmd falsify git-branch CRLF stdin rc=0
          set /a N+=1

          :: Falsificacao 6 -- write-scope CRLF stdin -> rc=2
          :: Afirma: rc=0 do positive arm (PyPI) vem do payload JSON, nao de allow-all acidental.
          echo. | "%PYPI_TRACKFW%" guard write-scope
          set WS_F=!ERRORLEVEL!
          if not !WS_F!==2 (echo FAIL pypi/cmd falsify: write-scope CRLF rc=!WS_F! esperado 2 & exit /b 1)
          echo PASS 6: pypi/cmd falsify write-scope CRLF stdin rc=2
          set /a N+=1

          if not !N!==6 (echo FAIL: apenas !N!/6 assercoes executaram & exit /b 1)
          echo ALL 6 PASSED pypi/cmd
          exit /b 0

  # ---------------------------------------------------------------------------
  # ML-3C (ROADMAP-2026-11-15-cobertura-e-compatibilidade-completas-do-trackfw-no-windows):
  # job nativo arm64 no windows-11-arm (GA para repositórios públicos desde
  # 2025-08-07: https://github.blog/changelog/2025-08-07-arm64-hosted-runners-for-public-repositories-are-now-generally-available/).
  #
  # Objetivos: (1) provar que o binário Go compilado NATIVAMENTE no runner arm64
  # é arm64 — verificado via GOHOSTARCH (toolchain nativo) + PE machine type 0xAA64
  # (loader bytes reais, independente de metadata Go); (2) exercitar os mesmos dois
  # braços de stdin do ML-3B nessa arquitetura.
  #
  # Decisão de setup-go: architecture: arm64 instrui o action a instalar o toolchain
  # nativo. Sem isso, x64 emulation no runner poderia entregar um toolchain amd64 que
  # compila amd64 sem erro — o job passaria mas nada seria testado em arm64.
  # GOHOSTARCH confirma DEPOIS que o toolchain é de fato nativo (não cross-compile).
  # Sem matrix, sem if:, sem continue-on-error — o check context é "windows-arm64".
  # ---------------------------------------------------------------------------
  windows-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          architecture: arm64

      - name: Confirmar toolchain nativo arm64 (GOHOSTARCH)
        # GOHOSTARCH é o arco do próprio toolchain — arm64 aqui prova que o runner
        # NÃO está emulando x64. GOARCH poderia ser arm64 mesmo em cross-compile;
        # GOHOSTARCH não pode.
        shell: pwsh
        run: |
          $arch = go env GOHOSTARCH
          Write-Host "GOHOSTARCH: $arch"
          if ($arch -ne 'arm64') {
            Write-Error "Toolchain nao e nativo arm64: GOHOSTARCH=$arch (emulacao x64 mascararia falhas)"
            exit 1
          }
          Write-Host "PASS: GOHOSTARCH=arm64 (toolchain nativo, sem cross-compile)"
          exit 0

      - name: Build nativo arm64
        # vault/notes/go-build-no-exe-suffix-exec-lookpath-falha-no-windows-2026-10-16.md:
        # o sufixo .exe é obrigatório no Windows.
        # Nao setar GOARCH: o toolchain nativo ja produz arm64; setar explicitamente
        # seria cross-compile, que é exatamente o que queremos provar que NAO estamos fazendo.
        shell: pwsh
        run: go build -o bin/trackfw.exe ./cmd/trackfw

      - name: Verificar PE machine type 0xAA64 (arm64)
        # Lê os bytes reais do PE — independente de qualquer metadata Go.
        # MZ (0x4D 0x5A) → PE offset em 0x3C → PE sig 0x00004550 → Machine em pe+4.
        # 0xAA64 = ARM64 (IMAGE_FILE_MACHINE_ARM64). 0x8664 = AMD64 (nunca esperado aqui).
        shell: pwsh
        run: |
          $exe = "bin\trackfw.exe"
          $b = [IO.File]::ReadAllBytes($exe)
          if ($b[0] -ne 0x4D -or $b[1] -ne 0x5A) {
            Write-Error "Cabecalho MZ ausente: nao e um PE valido"; exit 1
          }
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          if ([BitConverter]::ToUInt32($b, $pe) -ne 0x00004550) {
            Write-Error "Assinatura PE ausente no offset 0x$($pe.ToString('X'))"; exit 1
          }
          $m = [BitConverter]::ToUInt16($b, $pe + 4)
          Write-Host "PE machine type: 0x$($m.ToString('X4'))"
          if ($m -ne 0xAA64) {
            Write-Error "Binario nao e ARM64: machine=0x$($m.ToString('X4')) (esperado 0xAA64)"; exit 1
          }
          Write-Host "PASS: PE machine type 0xAA64 (ARM64 confirmado)"
          exit 0

      - name: Criar fixture minima para validate e guard
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "fixture"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "name: smoke-test" | Set-Content -Path "$dir\trackfw.yaml" -Encoding utf8
          foreach ($sub in @(
            "docs\req",
            "docs\roadmaps\backlog",   "docs\roadmaps\wip",
            "docs\roadmaps\done",      "docs\roadmaps\abandoned",
            "docs\roadmaps\analyzing", "docs\roadmaps\blocked"
          )) {
            New-Item -ItemType Directory -Force -Path "$dir\$sub" | Out-Null
          }
          "FIXTURE_DIR=$dir" >> $env:GITHUB_ENV
          Write-Host "Fixture: $dir"
          exit 0

      - name: Smoke arm64 (pwsh -- 6 assercoes)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = 'Continue'
          $n = 0
          $trackfw = Join-Path $env:GITHUB_WORKSPACE "bin\trackfw.exe"

          # Assercao 1 -- trackfw --version -> rc=0
          # Afirma: o binario arm64 nativo responde ao CLI basico no PowerShell.
          & $trackfw --version
          if ($LASTEXITCODE -ne 0) { Write-Error "arm64: --version rc=$LASTEXITCODE (esperado 0)"; exit 1 }
          Write-Host "PASS 1: arm64 --version rc=0"; $n++

          Push-Location $env:FIXTURE_DIR
          try {
            # Assercao 2 -- trackfw validate -> rc=0
            # Afirma: fixture minima e aceita pelo validate no arm64.
            & $trackfw validate
            if ($LASTEXITCODE -ne 0) { Write-Error "arm64: validate rc=$LASTEXITCODE (esperado 0)"; exit 1 }
            Write-Host "PASS 2: arm64 validate rc=0"; $n++

            # Assercao 3 -- guard git-branch com payload JSON -> rc=2
            # Afirma: guard git-branch bloqueia `git branch <nome>` via JSON no arm64.
            '{"tool_name":"Bash","tool_input":{"command":"git branch foo"}}' | & $trackfw guard git-branch
            if ($LASTEXITCODE -ne 2) { Write-Error "arm64: guard git-branch rc=$LASTEXITCODE (esperado 2)"; exit 1 }
            Write-Host "PASS 3: arm64 guard git-branch rc=2"; $n++

            # Assercao 4 -- guard write-scope com Write dentro do projeto -> rc=0
            # Afirma: guard write-scope permite escrita em arquivo nao-frozen no arm64.
            $fwPath = ($env:FIXTURE_DIR + '\README.md') -replace '\\','/'
            ('{"tool_name":"Write","tool_input":{"file_path":"' + $fwPath + '"}}') | & $trackfw guard write-scope
            if ($LASTEXITCODE -ne 0) { Write-Error "arm64: guard write-scope rc=$LASTEXITCODE (esperado 0)"; exit 1 }
            Write-Host "PASS 4: arm64 guard write-scope rc=0"; $n++

            # Falsificacao 5 -- git-branch CRLF stdin -> rc=0 (contra-braco)
            # Afirma: rc=2 do positive arm vem do payload JSON, nao de outro fator.
            "" | & $trackfw guard git-branch
            if ($LASTEXITCODE -ne 0) { Write-Error "arm64 falsify: git-branch CRLF rc=$LASTEXITCODE (esperado 0)"; exit 1 }
            Write-Host "PASS 5: arm64 falsify git-branch CRLF stdin rc=0"; $n++

            # Falsificacao 6 -- write-scope CRLF stdin -> rc=2 (contra-braco)
            # Afirma: rc=0 do positive arm vem do payload JSON, nao de allow-all acidental.
            "" | & $trackfw guard write-scope
            if ($LASTEXITCODE -ne 2) { Write-Error "arm64 falsify: write-scope CRLF rc=$LASTEXITCODE (esperado 2)"; exit 1 }
            Write-Host "PASS 6: arm64 falsify write-scope CRLF stdin rc=2"; $n++
          } finally {
            Pop-Location
          }

          if ($n -ne 6) { Write-Error "arm64: apenas $n/6 assercoes executaram"; exit 1 }
          Write-Host "ALL 6 PASSED arm64"
          exit 0

  # ---------------------------------------------------------------------------
  # ML-1A (ROADMAP-2026-10-28-documentacao-e-canais-refletem-o-produto-11-x):
  # gate do instalador PowerShell. Roda em windows-latest sob Windows PowerShell
  # 5.1 (shell: powershell) e PowerShell 7 (shell: pwsh). Falha se qualquer
  # cenario de seguranca nao for detectado ou se o instalador nao concluir com
  # sucesso no caminho feliz.
  # ---------------------------------------------------------------------------
  windows-install-ps1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: "install.ps1 gate — Windows PowerShell 5.1"
        shell: powershell
        run: scripts/check-install-ps1.ps1 -ExpectEdition Desktop

      - name: "install.ps1 gate — PowerShell 7"
        shell: pwsh
        run: scripts/check-install-ps1.ps1 -ExpectEdition Core
