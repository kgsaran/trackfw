name: Windows Probe (sonda sob demanda)

# ADR-2026-08-30-ci-de-windows-como-instrumento-de-medicao-job-largo-que-
# nasce-vermelho-mais-sonda-sob-demanda.md, decisão 3. ML-3A do
# ROADMAP-2026-08-30-job-de-windows-largo-que-nasce-vermelho-e-sonda-sob-
# demanda.md.
#
# ESTA SONDA NÃO É O JOB DE REGRESSÃO (AC6, INVIOLÁVEL).
#
#   - windows-full-suites / windows-defect-reproduction (quality.yml) rodam
#     em TODO push/PR, com veredito (pass/fail), e provam que os 11 defeitos
#     conhecidos da issue #216 não voltaram. É o instrumento de governança:
#     verde/vermelho decide se um PR pode mergear.
#   - ESTA sonda roda só sob demanda (workflow_dispatch), NUNCA em push/PR,
#     NÃO tem veredito — imprime o valor BRUTO que o SO devolveu para cada
#     pergunta e para aí. Quem lê decide o que o valor significa.
#
# São ferramentas distintas e não se substituem: sonda prova o que alguém
# LEMBROU de perguntar; regressão prova que um defeito já mapeado não
# voltou. Confundi-las é o mesmo erro do gate de falsificação que não pegou
# o bypass de cerca — cobria a classe (existe skip? existe continue-on-error?)
# e não tinha o caso concreto. Uma suíte de regressão só responde perguntas
# que alguém já pensou em transformar em asserção; a sonda existe
# precisamente para o dia em que a pergunta ainda não virou asserção nenhuma
# — ex.: "o Lstat do Go marca ModeSymlink para uma junction do jeito que
# marcaria para um symlink?", que é a pergunta que o autor da issue #216 fez
# e que nenhuma das duas camadas de regressão responde hoje.
#
# NÃO adicionar `push`/`pull_request` a este workflow. Se uma das perguntas
# abaixo virar preocupação de regressão permanente, o caminho certo é uma
# verificação NOVA em scripts/windows-repro/ + quality.yml (camada 2), não
# transformar este `workflow_dispatch` em gate.

on:
  workflow_dispatch:
    inputs:
      motivo:
        description: "Por que está rodando a sonda agora (fica no log, para anexar em REQ)"
        required: false
        default: "investigação ad hoc"

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    # Guardrail, não meta: a sonda existe para responder em poucos minutos
    # (AC5/AC6/ADR decisão 3). Se este timeout disparar, a sonda deixou de
    # cumprir seu propósito e o motivo precisa virar achado, não um aumento
    # silencioso do número.
    #
    # ML-1A (2026-08-31) apertou a margem: +4 steps (Perguntas 8/9/10/11),
    # com múltiplos `go run` (cada um recompila) e chamadas a `mklink`. Se
    # este timeout disparar pela primeira vez logo após este ML, ler como
    # orçamento ficou mais justo, não necessariamente como regressão nova —
    # mas o número em si continua sem subir (mesma régua acima).
    timeout-minutes: 10
    steps:
      - name: Motivo desta execução
        shell: pwsh
        # Passado via env:, não interpolado direto no script pwsh — o input
        # é texto livre de quem dispara o workflow_dispatch, e o log é
        # público (restrição do ML-3A). env: evita que um valor adversarial
        # (ex.: contendo `; Get-ChildItem env:`) seja executado como parte
        # do próprio comando em vez de tratado como string.
        env:
          MOTIVO: ${{ inputs.motivo }}
        run: |
          Write-Host "Motivo: $env:MOTIVO"

      - uses: actions/checkout@v7

      - name: Registrar início
        shell: pwsh
        run: echo "started=$(Get-Date -AsUTC -Format o)" >> $env:GITHUB_ENV

      # Diretório de trabalho isolado, fora da home real do runner —
      # recomendação do ML-0A/Wave 0 (§2): mesmo sem segredo, um log público
      # não deve carregar caminhos do perfil real do runner (%USERPROFILE%
      # real) além do necessário. Todas as sondas abaixo operam dentro deste
      # diretório ou de subdiretórios temporários dele.
      - name: Preparar diretório de trabalho isolado
        id: work
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "probe-work"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "dir=$dir" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyyaml
      - run: npm ci --ignore-scripts
        working-directory: npm

      # ---------------------------------------------------------------
      # Pergunta 1 — modo devolvido por os.Stat: arquivo comum vs chmod +x.
      # Mesmo primitivo que internal/validator/validator_credential_guard.go
      # e validator_git_branch_guard.go chamam em produção (info.Mode()&0111).
      # ---------------------------------------------------------------
      - name: "Pergunta 1 — os.Stat: arquivo comum vs chmod +x"
        if: always()
        shell: pwsh
        run: |
          go run scripts/windows-repro/go/probe.go statmode-common
          go run scripts/windows-repro/go/probe.go statmode-chmod

      # ---------------------------------------------------------------
      # Pergunta 2 — a pergunta central desta sonda (ver cabeçalho do YAML
      # e de probe.go): Lstat diante de symlink (os.Symlink) vs junction
      # (mklink /J) vs arquivo comum. mklink /J não exige privilégio
      # elevado — funciona no runner hospedado padrão, ao contrário de
      # os.Symlink (que tipicamente falha sem Developer Mode/admin; o erro
      # bruto de criação também é sinal e é impresso, não escondido).
      # ---------------------------------------------------------------
      - name: "Pergunta 2 — Lstat: arquivo comum vs symlink (os.Symlink) vs junction (mklink /J)"
        if: always()
        shell: pwsh
        run: |
          go run scripts/windows-repro/go/probe.go lstat-common
          go run scripts/windows-repro/go/probe.go lstat-symlink
          go run scripts/windows-repro/go/probe.go lstat-junction

      # ---------------------------------------------------------------
      # Pergunta 3 — isatty sobre NUL, sobre pipe, e "sobre o console" (com
      # a ressalva de que o runner do Actions já captura o stdout do step
      # via redirecionamento próprio — não é um console interativo real;
      # ver residual declarado no rodapé deste job). cmd.exe é o único shell
      # com semântica de "<" garantida para NUL nesta imagem sem depender
      # de bash/sh estarem no PATH — por isso a variante NUL usa `cmd /c`.
      # ---------------------------------------------------------------
      - name: "Pergunta 3 — isatty(): NUL, pipe, e stdout do step sem redirecionamento explícito"
        if: always()
        shell: pwsh
        run: |
          Write-Host "-- isatty sobre NUL (cmd /c com '< NUL') --"
          cmd /c "python -c ""import sys; print('stdin.isatty()=', sys.stdin.isatty())"" < NUL"

          Write-Host "-- isatty sobre pipe (stdin vem de outro processo) --"
          "linha-de-teste" | python -c "import sys; print('stdin.isatty()=', sys.stdin.isatty())"

          Write-Host "-- isatty sem redirecionamento explícito (stdout do STEP do Actions, não um console interativo) --"
          python -c "import sys; print('stdin.isatty()=', sys.stdin.isatty(), 'stdout.isatty()=', sys.stdout.isatty())"

      # ---------------------------------------------------------------
      # Pergunta 4 — encoding do console e do stdout: chcp (codepage ANSI
      # ativa), sys.stdout.encoding com e sem PYTHONIOENCODING setado.
      # ---------------------------------------------------------------
      - name: "Pergunta 4 — encoding do console e do stdout"
        if: always()
        shell: pwsh
        run: |
          Write-Host "-- chcp (codepage ANSI ativa do console) --"
          cmd /c chcp

          Write-Host "-- sys.stdout.encoding / sys.stderr.encoding, PYTHONIOENCODING não setado --"
          $env:PYTHONIOENCODING = $null
          python -c "import sys; print('stdout.encoding=', sys.stdout.encoding, 'stderr.encoding=', sys.stderr.encoding)"

          Write-Host "-- idem, com PYTHONIOENCODING=utf-8 --"
          $env:PYTHONIOENCODING = "utf-8"
          python -c "import sys; print('stdout.encoding=', sys.stdout.encoding, 'stderr.encoding=', sys.stderr.encoding)"
          Remove-Item Env:\PYTHONIOENCODING

      # ---------------------------------------------------------------
      # Pergunta 5 — terminador de linha dos arquivos que os geradores
      # escrevem. Regra dura de paridade do projeto (docs/cli-parity.md):
      # os 3 CLIs têm gerador de artefato PRÓPRIO (internal/generators/,
      # npm/src/generators/, pypi/trackfw/generators/ — reimplementações,
      # não wrapper), então as 3 sub-perguntas medem os 3, não só o que já
      # tinha script pronto:
      #   5a. Python — reusa scripts/windows-repro/python/checks.py
      #       (comando `crlf`, já existente na camada 2) em vez de duplicar
      #       a lógica — mesmo caminho real de produção (`trackfw init` de
      #       verdade, sem mock), agora só para leitura bruta.
      #   5b. Go — `trackfw roadmap new` de verdade (mesmo binário
      #       compilado do repositório), sem mock, lendo os bytes crus do
      #       .md gerado.
      #   5c. Node — `trackfw roadmap new` de verdade via o CLI Node
      #       (npm/src/generators/roadmap.js), mesmo mecanismo do 5b.
      # ---------------------------------------------------------------
      - name: "Pergunta 5a — terminador de linha dos arquivos gerados (trackfw init real, Python)"
        if: always()
        shell: pwsh
        env:
          # evita que o item 1 (cp1252) mascare esta leitura — mesma técnica
          # documentada em scripts/windows-repro/python/checks.py (ML-1C)
          PYTHONIOENCODING: "utf-8"
        run: |
          $env:TRACKFW_PYPI_SRC = Join-Path $env:GITHUB_WORKSPACE "pypi"
          python scripts/windows-repro/python/checks.py crlf

      - name: "Pergunta 5b — terminador de linha dos arquivos gerados (trackfw roadmap new real, Go)"
        if: always()
        shell: pwsh
        run: |
          $binDir = Join-Path $env:RUNNER_TEMP "probe-bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          $exe = Join-Path $binDir "trackfw-probe.exe"
          go build -o $exe ./cmd/trackfw
          if ($LASTEXITCODE -ne 0) {
            Write-Host "go build falhou -- Pergunta 5b não pôde medir"
            exit 0
          }

          $genDir = Join-Path "${{ steps.work.outputs.dir }}" "go-gen"
          New-Item -ItemType Directory -Force -Path $genDir | Out-Null
          Push-Location $genDir
          & $exe init --identity-preset none | Out-Null
          & $exe roadmap new "sonda go crlf" | Out-Null
          Pop-Location

          $mdFiles = Get-ChildItem -Path (Join-Path $genDir "docs\roadmaps") -Filter "*.md" -Recurse
          if (-not $mdFiles) {
            Write-Host "VERDICT=INCONCLUSIVE (nenhum .md gerado)"
          } else {
            foreach ($f in $mdFiles) {
              $raw = [System.IO.File]::ReadAllBytes($f.FullName)
              $hasCrlf = ([System.Text.Encoding]::UTF8.GetString($raw)) -match "`r`n"
              Write-Host "$($f.Name): crlf=$hasCrlf bytes=$($raw.Length)"
            }
          }

      - name: "Pergunta 5c — terminador de linha dos arquivos gerados (trackfw roadmap new real, Node)"
        if: always()
        shell: pwsh
        run: |
          $genDir = Join-Path "${{ steps.work.outputs.dir }}" "node-gen"
          New-Item -ItemType Directory -Force -Path $genDir | Out-Null
          $nodeBin = Join-Path $env:GITHUB_WORKSPACE "npm\bin\trackfw"
          Push-Location $genDir
          node $nodeBin init --identity-preset none | Out-Null
          node $nodeBin roadmap new "sonda node crlf" | Out-Null
          Pop-Location

          $mdFiles = Get-ChildItem -Path (Join-Path $genDir "docs\roadmaps") -Filter "*.md" -Recurse
          if (-not $mdFiles) {
            Write-Host "VERDICT=INCONCLUSIVE (nenhum .md gerado)"
          } else {
            foreach ($f in $mdFiles) {
              $raw = [System.IO.File]::ReadAllBytes($f.FullName)
              $hasCrlf = ([System.Text.Encoding]::UTF8.GetString($raw)) -match "`r`n"
              Write-Host "$($f.Name): crlf=$hasCrlf bytes=$($raw.Length)"
            }
          }

      # ---------------------------------------------------------------
      # Pergunta 6 — sh, bash e pwsh no PATH: versão e caminho resolvido.
      # ---------------------------------------------------------------
      - name: "Pergunta 6 — sh, bash, pwsh no PATH (versão e caminho)"
        if: always()
        shell: pwsh
        run: |
          foreach ($exe in "sh", "bash", "pwsh") {
            $cmd = Get-Command $exe -ErrorAction SilentlyContinue
            if (-not $cmd) {
              Write-Host "$exe -> NÃO ENCONTRADO no PATH"
              continue
            }
            Write-Host "$exe -> $($cmd.Source)"
            try {
              $version = & $exe --version 2>&1 | Select-Object -First 1
              Write-Host "$exe --version -> $version"
            } catch {
              Write-Host "$exe --version -> erro ao invocar: $_"
            }
          }

      # ---------------------------------------------------------------
      # Pergunta 7 — core.symlinks efetivo do Git, e o que `git checkout`
      # faz com um symlink versionado (blob modo 120000) sob esse valor.
      # O objeto symlink é criado via plumbing (`update-index --cacheinfo
      # 120000,...`), não via os.Symlink — funciona independente de
      # privilégio/Developer Mode do runner, porque não pede ao SO para
      # criar um reparse point na hora de ADICIONAR ao índice, só na hora
      # do checkout (que é exatamente o comportamento sob teste).
      #
      # Corrigido no ML-1A (ROADMAP-2026-08-30-sonda-mede-junction-nos-3-
      # runtimes-e-a-pergunta-7-volta-a-responder.md): a primeira versão
      # passava `--cacheinfo 120000,$blob,mylink` direto no run: do pwsh e
      # falhou ("option 'cacheinfo' expects <mode>,<sha1>,<path>", step 19
      # do run 33338382066).
      #
      # Mecanismo confirmado por reprodução local (pwsh 7.6.5 + git real,
      # fora deste CI — não é exclusivo do Windows): quando um argumento SEM
      # espaços contendo vírgula é passado cru a um executável NATIVO, o
      # PowerShell NÃO interpola a variável dentro dele — `$blob` chega ao
      # processo como o texto literal "$blob", não como o hash. git recebe
      # UM argumento (`120000,$blob,mylink`, com o `$` literal), cujo campo
      # de sha1 não é hex válido — daí o erro. (Não é "a vírgula constrói um
      # array de 3 argumentos": comprovado que o processo nativo recebe um
      # único argv com o `$blob` não expandido — ver nota no relatório do
      # ML-1A em docs/agents-working-context.md.) A correção monta a string
      # numa VARIÁVEL com aspas duplas (que sempre interpola) antes de
      # invocar o git — nesse contexto, `$blob` é expandido normalmente.
      # ---------------------------------------------------------------
      - name: "Pergunta 7 — core.symlinks efetivo, e o que git checkout faz com um symlink versionado"
        if: always()
        shell: pwsh
        working-directory: ${{ steps.work.outputs.dir }}
        run: |
          Write-Host "-- core.symlinks efetivo no ambiente do runner (antes de qualquer repo novo) --"
          $global = git config --get core.symlinks
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrEmpty($global)) {
            Write-Host "core.symlinks (global/system): não setado explicitamente -- Git usa o default detectado na criação de cada repo"
          } else {
            Write-Host "core.symlinks (global/system): $global"
          }

          git init -q symlink-checkout
          Set-Location symlink-checkout
          git config --get core.symlinks

          # target.txt PRECISA existir no worktree antes do checkout: se o
          # Git materializar um symlink real (core.symlinks=true), um alvo
          # ausente deixa o link "dangling" e Get-Content abaixo falharia de
          # forma terminante (shell: pwsh roda com $ErrorActionPreference
          # efetivamente Stop), derrubando o resto do step antes de imprimir
          # o resultado — exatamente o defeito que este ML existe para não
          # repetir (mesma classe do ML-1C).
          "conteudo-alvo`n" | Out-File -NoNewline -Encoding ascii target.txt

          "target.txt" | Out-File -NoNewline -Encoding ascii link_target.tmp
          $blob = (git hash-object -w link_target.tmp).Trim()
          Remove-Item link_target.tmp

          # AC1 — montar a string ÚNICA numa variável (contexto de aspas
          # duplas, onde $blob É interpolado) antes de invocar o git — em
          # vez de deixar o pwsh passar `$blob` cru e sem espaços dentro de
          # um argumento com vírgula direto para o processo nativo, caso em
          # que a variável NÃO é expandida (ver comentário acima do step).
          $cacheinfo = "120000,$blob,mylink"
          Write-Host "-- argumento --cacheinfo montado (string única) --"
          Write-Host "cacheinfo=$cacheinfo"
          git update-index --add --cacheinfo $cacheinfo

          # AC2 — falsificação: provar que o argumento chegou ÍNTEGRO ao
          # git, não só que o comando devolveu exit 0. `git ls-files
          # --stage` lê de volta a entrada que ficou no índice, ANTES do
          # checkout — se `update-index` tivesse falhado silenciosamente
          # por outro motivo (blob mal formado, path errado) e o erro fosse
          # engolido, esta linha ficaria vazia ou divergente do valor
          # esperado impresso acima. Valores crus lado a lado — comparação é
          # de quem lê o log, não desta sonda (AC6: sem veredito impresso).
          Write-Host "-- entrada no índice após update-index, ANTES do checkout --"
          $indexEntry = git ls-files --stage mylink
          Write-Host "index_entry_bruta=$indexEntry"
          Write-Host "esperado_mode=120000 esperado_blob=$blob esperado_path=mylink"

          git checkout -- mylink

          Write-Host "-- o que ficou em disco depois do checkout --"
          $item = Get-Item mylink -Force -ErrorAction SilentlyContinue
          if ($item) {
            Write-Host "Attributes: $($item.Attributes)"
            Write-Host "LinkType: $($item.LinkType)"
          } else {
            Write-Host "Get-Item mylink falhou -- ver stderr acima"
          }
          Write-Host "Conteúdo bruto (se for arquivo texto, mostra o alvo como STRING; se for reparse point, PowerShell resolve via o próprio link):"
          Get-Content mylink -Raw -ErrorAction SilentlyContinue | Write-Host

      - name: "Lstat do Go sobre o resultado da Pergunta 7"
        if: always()
        shell: pwsh
        # Roda da raiz do repo (mesmo padrão das Perguntas 1/2 acima), NÃO
        # do diretório isolado: `go run <arquivo>.go` fora de qualquer
        # go.mod pode se comportar de forma imprevisível em modo módulo
        # (probe.go só usa stdlib, então tende a funcionar, mas não vale
        # gastar um dispatch para descobrir). O caminho de mylink é
        # absoluto, então o cwd do processo não importa para o resultado.
        run: |
          $mylinkPath = Join-Path "${{ steps.work.outputs.dir }}" "symlink-checkout\mylink"
          go run scripts/windows-repro/go/probe.go lstat-path $mylinkPath
          Get-Item $mylinkPath -Force -ErrorAction SilentlyContinue | Format-List *

      # ---------------------------------------------------------------
      # Pergunta 8 — Lstat (Node): arquivo comum vs symlink real vs
      # junction. AC3 da REQ-2026-08-30: junction nunca havia sido medida em
      # Node. Mesmo formato comparativo bruto que o braço Go já usa na
      # Pergunta 2 (probe.js, ML-1A).
      # ---------------------------------------------------------------
      - name: "Pergunta 8 — lstatSync (Node): arquivo comum vs symlink vs junction"
        if: always()
        shell: pwsh
        run: |
          node scripts/windows-repro/node/probe.js lstat-common
          node scripts/windows-repro/node/probe.js lstat-symlink
          node scripts/windows-repro/node/probe.js lstat-junction

      # ---------------------------------------------------------------
      # Pergunta 9 — Lstat (Python): arquivo comum vs symlink real vs
      # junction. AC4 da REQ-2026-08-30: junction nunca havia sido medida em
      # Python (probe.py, ML-1A).
      # ---------------------------------------------------------------
      - name: "Pergunta 9 — os.lstat (Python): arquivo comum vs symlink vs junction"
        if: always()
        shell: pwsh
        run: |
          python scripts/windows-repro/python/probe.py lstat-common
          python scripts/windows-repro/python/probe.py lstat-symlink
          python scripts/windows-repro/python/probe.py lstat-junction

      # ---------------------------------------------------------------
      # Pergunta 10 — rmdir sobre uma junction VAZIA, nos 3 runtimes. Entrou
      # no escopo do ML-1A por causa do achado do ML-0A (hades-tf):
      # pypi/trackfw/integrations/manager.py:589 _remove_empty depende SÓ de
      # `except OSError` ao redor do rmdir() para parar de subir removendo
      # ancestrais — este é literalmente o discriminante entre "Python para"
      # e "Python sobe removendo diretórios do usuário". A fixture de
      # junction já existe no momento certo (custo marginal baixo).
      # ---------------------------------------------------------------
      - name: "Pergunta 10 — rmdir sobre junction vazia (Go, Node, Python)"
        if: always()
        shell: pwsh
        run: |
          go run scripts/windows-repro/go/probe.go rmdir-junction
          node scripts/windows-repro/node/probe.js rmdir-junction
          python scripts/windows-repro/python/probe.py rmdir-junction

      # ---------------------------------------------------------------
      # Pergunta 11 — tabela comparativa final runtime × (arquivo | symlink
      # | junction). AC5 da REQ-2026-08-30: cada runtime recria seus
      # próprios fixtures do zero e imprime uma linha "TABELA ..." com
      # prefixo comum, no MESMO step, para ser lida sem cruzar logs.
      # Valores CRUS, nunca veredito (AC6) — nenhuma linha aqui decide
      # pass/fail; é o artefato que a REQ de correção subsequente vai citar.
      # ---------------------------------------------------------------
      - name: "Pergunta 11 — tabela comparativa final (runtime x arquivo|symlink|junction)"
        if: always()
        shell: pwsh
        run: |
          go run scripts/windows-repro/go/probe.go table
          node scripts/windows-repro/node/probe.js table
          python scripts/windows-repro/python/probe.py table

      # Pergunta 12 — onde mora o git na visão POSIX do bash do Git for
      # Windows, em x64. Entrou pelo ML-R2a da REQ-2026-09-03: dois scripts
      # de gate (check-release-tag-parity.sh:112, check-ship-force-parity.sh:115)
      # constroem BASE_PATH="$RUNTIME_BIN:/usr/bin:/bin" para o CLI-sob-teste,
      # e 442 das 512 linhas do censo de Windows dependem de git NÃO resolver
      # ali. Medido em ARM64 (VM local): /usr/bin/git e /bin/git não existem,
      # git resolve em /clangarm64/bin/git. FALTA saber se x64 é igual — é
      # essa a pergunta, e é a que decide se as 442 são defeito de script ou
      # artefato de uma máquina.
      #
      # Sem veredito, como toda pergunta desta sonda: imprime o valor bruto.
      # `|| true` em toda linha que pode falhar, para o step nunca abortar
      # antes de imprimir as demais respostas.
      - name: "Pergunta 12 — /usr/bin/git e /bin/git existem no bash do Git for Windows (x64)?"
        if: always()
        shell: bash
        run: |
          echo "BASH_VERSION=$BASH_VERSION"
          uname -a || true
          echo "--- ls -l /usr/bin/git /bin/git ---"
          ls -l /usr/bin/git /bin/git 2>&1 || true
          echo "--- ls -l /mingw64/bin/git.exe /mingw32/bin/git.exe ---"
          ls -l /mingw64/bin/git.exe /mingw32/bin/git.exe 2>&1 || true
          echo "--- command -v git ---"
          command -v git || true
          echo "--- git --version ---"
          git --version || true
          echo "--- git resolve sob o BASE_PATH dos gates? ---"
          PATH="/usr/bin:/bin" command -v git \
            || echo "RESULTADO: git NAO resolvivel sob PATH=/usr/bin:/bin"
          echo "--- raiz POSIX deste bash (para interpretar os caminhos acima) ---"
          cygpath -w / 2>&1 || true
          cygpath -w /bin 2>&1 || true
          cygpath -w /usr/bin 2>&1 || true

      # Pergunta 13 — onde mora o gh na visão POSIX do bash do Git for Windows
      # (x64), o que há no diretório dele, e se um wrapper .cmd ou shim .exe
      # compilado permite que Go, Node.js e Python encontrem e executem o stub
      # bash sem extensão via PATHEXT.
      #
      # Motivação (ML-R2b1): os 54 rótulos que falham com "No forge CLI is
      # available" falham porque write_release_gh_stub / write_gh_stub criam
      # $dir/gh (bash, sem .exe) e exec.LookPath("gh") no Windows exige
      # extensão em PATHEXT. A correção depende de qual mecanismo funciona em
      # TODOS os três runtimes: .cmd wrapper (bloqueado em Go 1.21+ via
      # segurança de batch file) ou shim .exe compilado que delega ao bash stub.
      #
      # Analogia: Pergunta 12 fez o mesmo para o git e informou o ML-R2c.
      - name: "Pergunta 13 — onde está gh, seu diretório, e viabilidade de .cmd/.exe para o stub nativo"
        if: always()
        shell: bash
        run: |
          set +e

          echo "=== 13-A: localização do gh ==="
          echo "command -v gh: $(command -v gh 2>/dev/null || echo NAO_ENCONTRADO)"
          echo "where.exe gh:"; where.exe gh 2>&1 || true
          echo "gh --version:"; gh --version 2>&1 || true
          ls -l /usr/bin/gh /bin/gh 2>&1 || true

          GH_CMD=$(command -v gh 2>/dev/null || true)
          GH_DIR=$([ -n "$GH_CMD" ] && dirname "$GH_CMD" || echo "")

          echo "=== 13-B: conteúdo do diretório do gh ==="
          if [ -n "$GH_DIR" ]; then
            echo "GH_DIR (POSIX): $GH_DIR"
            echo "GH_DIR (Win32): $(cygpath -w "$GH_DIR" 2>&1 || true)"
            ls -la "$GH_DIR" 2>&1 | head -80 || true
          else
            echo "gh não encontrado — diretório desconhecido"
          fi

          echo "=== 13-C: setup — stub bash sem extensão em dir temporário ==="
          T=$(mktemp -d)
          TW=$(cygpath -w "$T" 2>/dev/null || echo "$T")
          echo "T=$T  TW=$TW"
          printf '#!/usr/bin/env bash\nbody=$(cat)\necho "stub-gh-ok body=$body args=$*"\n' > "$T/gh"
          chmod +x "$T/gh"

          echo "=== 13-D: PATHEXT na visão de processo nativo (Python) ==="
          python3 -c "import os; print('PATHEXT:', os.environ.get('PATHEXT','NOT SET'))" || true

          echo "=== 13-E: shutil.which sem extensão (esperado: None) ==="
          python3 -c "import shutil,os; p=os.environ.get('T_WIN','')+os.pathsep+os.environ.get('PATH',''); print('shutil.which no-ext:', shutil.which('gh',path=p))" T_WIN="$TW" || true

          echo "=== 13-F: .cmd wrapper — resolução e execução nos 3 runtimes ==="
          printf '@echo off\r\nbash.exe "%%~dp0gh" %%*\r\n' > "$T/gh.cmd"

          # Python probe escrita em arquivo para evitar multi-linha em python3 -c
          printf 'import shutil,os,subprocess\np=os.environ.get("T_WIN","")+os.pathsep+os.environ.get("PATH","")\nfound=shutil.which("gh",path=p)\nprint("shutil.which .cmd:",found)\nif found:\n  env=dict(os.environ); env["PATH"]=p\n  r=subprocess.run(["gh","a1"],input=b"stdin-test",capture_output=True,env=env)\n  print("rc:",r.returncode,"stdout:",repr(r.stdout[:80]),"stderr:",repr(r.stderr[:80]))\nelse:\n  print("NOT FOUND with .cmd")\n' > "$T/probe_py.py"

          echo "--- 13-F Python ---"
          T_WIN="$TW" python3 "$T/probe_py.py" || true

          echo "--- 13-F Node.js ---"
          printf 'const s=require("child_process").spawnSync,p=require("path"),tw=process.env.T_WIN||"",pp=tw+p.delimiter+(process.env.PATH||""),r=s("gh",["a1"],{input:"stdin-test",encoding:"utf8",env:{...process.env,PATH:pp}});console.log("status:",r.status,"error:",r.error?r.error.message:null,"stdout:",JSON.stringify((r.stdout||"").slice(0,80)));\n' > "$T/probe_node.js"
          T_WIN="$TW" node "$T/probe_node.js" || true

          echo "--- 13-F Go (exec.Command com .cmd via PATH — Go 1.21+ pode bloquear batch) ---"
          T_SRC="$T/go_probe"
          mkdir -p "$T_SRC"
          printf 'package main\nimport ("fmt";"os";"os/exec";"strings")\nfunc main() {\ntw := os.Getenv("T_WIN")\np := tw + string(os.PathListSeparator) + os.Getenv("PATH")\nos.Setenv("PATH", p)\ncmd := exec.Command("gh", "a1")\ncmd.Stdin = strings.NewReader("stdin-test")\nout, err := cmd.CombinedOutput()\nif err != nil {\nfmt.Printf("ERROR: %%v | output: %%s\\n", err, strings.TrimSpace(string(out)))\n} else {\nfmt.Printf("OK: %%s\\n", strings.TrimSpace(string(out)))\n}\n}\n' > "$T_SRC/main.go"
          printf 'module ghprobe\ngo 1.21\n' > "$T_SRC/go.mod"
          (cd "$T_SRC" && T_WIN="$TW" go run main.go) || true

          echo "=== 13-G: compila gh.exe shim e repete nos 3 runtimes ==="
          T_SHIM="$T/shim_src"
          mkdir -p "$T_SHIM"
          printf 'package main\nimport ("fmt";"os";"os/exec";"path/filepath")\nfunc main() {\nexe, err := os.Executable()\nif err != nil { fmt.Fprintln(os.Stderr, err); os.Exit(1) }\nstub := filepath.Join(filepath.Dir(exe), "gh")\nbash, err := exec.LookPath("bash.exe")\nif err != nil { fmt.Fprintln(os.Stderr, "bash.exe not found:", err); os.Exit(1) }\nargs := append([]string{stub}, os.Args[1:]...)\ncmd := exec.Command(bash, args...)\ncmd.Stdin = os.Stdin; cmd.Stdout = os.Stdout; cmd.Stderr = os.Stderr\nif err := cmd.Run(); err != nil {\nif e, ok := err.(*exec.ExitError); ok { os.Exit(e.ExitCode()) }\nfmt.Fprintln(os.Stderr, err); os.Exit(1)\n}\n}\n' > "$T_SHIM/main.go"
          printf 'module ghshim\ngo 1.21\n' > "$T_SHIM/go.mod"
          echo "compilando gh.exe shim..."
          (cd "$T_SHIM" && go build -o "$T/gh.exe" .) 2>&1 && echo "shim build: OK" || echo "shim build: FALHOU"

          if [ -f "$T/gh.exe" ]; then
            echo "--- 13-G Python com gh.exe (mesma probe_py.py, agora aponta .exe) ---"
            T_WIN="$TW" python3 "$T/probe_py.py" || true
            echo "--- 13-G Node.js com gh.exe ---"
            T_WIN="$TW" node "$T/probe_node.js" || true
            echo "--- 13-G Go com gh.exe ---"
            (cd "$T_SRC" && T_WIN="$TW" go run main.go) || true
          fi

          rm -rf "$T"

      # Pergunta 14 — por que {owner}/{repo} perde as chaves ao atravessar o shim .exe (ML-R2b1b)
      # Três variantes de shim: baseline (log apenas), env-var (MSYS=noglob MSYS_NO_PATHCONV=1
      # MSYS2_ARG_CONV_EXCL=*), force-quoted (SysProcAttr.CmdLine). Cada shim imprime
      # P14_SHIM_*_RECV[i] antes de chamar o bash — para ver o que chega na fronteira ①(product→shim)
      # e comparar com P14_ARG[i] do stub — fronteira ②(shim→bash).
      # PATH restrito: T14 (stub+shims) + BASH_DIR. Real gh excluído (lição da Pergunta 13).
      - name: "Pergunta 14 — como {owner}/{repo} atravessa o shim .exe até o stub bash (ML-R2b1b)"
        if: always()
        shell: bash
        run: |
          set +e
          echo "=== Pergunta 14: travessia de {owner}/{repo} pelo shim .exe — ML-R2b1b ==="

          T14=$(mktemp -d)
          BASH_BIN=$(command -v bash 2>/dev/null || true)
          BASH_DIR=$(dirname "$BASH_BIN")
          REAL_GH=$(command -v gh 2>/dev/null || true)
          REAL_GH_DIR=$([ -n "$REAL_GH" ] && dirname "$REAL_GH" || echo "nao_encontrado")
          echo "T14=$T14  BASH_BIN=$BASH_BIN  REAL_GH=$REAL_GH  REAL_GH_DIR=$REAL_GH_DIR"

          # PATH restrito: stub/shims dir + bash dir (real gh excluído — lição da P13)
          PATH_14="$T14:$BASH_DIR"
          echo "PATH_14=$PATH_14"

          echo "=== 14-A: stub bash — imprime P14_STUB_OK + P14_ARG[i] para cada arg ==="
          printf '#!/usr/bin/env bash\necho "P14_STUB_OK"\ni=0; for a in "$@"; do echo "P14_ARG[$i]=$a"; i=$((i+1)); done\n' > "$T14/gh"
          chmod +x "$T14/gh"
          echo "Stub direto (sem shim — esperado: braces preservadas):"
          "$T14/gh" api "repos/{owner}/{repo}" 2>&1

          echo "=== 14-B: prova de isolamento PATH — gh deve resolver para T14, real gh inacessível ==="
          GH_VIA_P14=$(PATH="$PATH_14" command -v gh 2>/dev/null || echo "NAO_ENCONTRADO")
          echo "gh via PATH_14: $GH_VIA_P14"
          case "$GH_VIA_P14" in
            *"$T14"*) echo "P14_PATH_OK: gh resolve para stub em T14" ;;
            *) echo "P14_PATH_PROBLEMA: gh=$GH_VIA_P14 (esperado em T14)" ;;
          esac
          echo "real gh via PATH_14: $(PATH="$PATH_14" "$REAL_GH" --version 2>&1 | head -1 || echo 'P14_REAL_GH_BLOQUEADO')"

          echo "=== 14-C: compila shim baseline (loga P14_SHIM_BASE_RECV antes de chamar bash) ==="
          T14_BS="$T14/src_base"; mkdir -p "$T14_BS"
          printf 'package main\nimport ("fmt";"os";"os/exec";"path/filepath")\nfunc findBash() string {for _,n:=range []string{"bash.exe","bash"}{if p,err:=exec.LookPath(n);err==nil{return p}};return ""}\nfunc main() {\nexe,err:=os.Executable()\nif err!=nil{fmt.Fprintln(os.Stderr,err);os.Exit(1)}\nstub:=filepath.Join(filepath.Dir(exe),"gh")\nbash:=findBash()\nif bash==""{fmt.Fprintln(os.Stderr,"bash.exe not found");os.Exit(1)}\nfor i,a:=range os.Args{fmt.Fprintf(os.Stderr,"P14_SHIM_BASE_RECV[%%d]=%%s\\n",i,a)}\nargs:=append([]string{stub},os.Args[1:]...)\ncmd:=exec.Command(bash,args...)\ncmd.Stdin=os.Stdin;cmd.Stdout=os.Stdout;cmd.Stderr=os.Stderr\nif err:=cmd.Run();err!=nil{if e,ok:=err.(*exec.ExitError);ok{os.Exit(e.ExitCode())};fmt.Fprintln(os.Stderr,err);os.Exit(1)}\n}\n' > "$T14_BS/main.go"
          printf 'module shimbase\ngo 1.21\n' > "$T14_BS/go.mod"
          (cd "$T14_BS" && go build -o "$T14/gh_base.exe" .) && echo "14-C build: OK" || echo "14-C build: FALHOU"

          echo "=== 14-D: compila shim env-var (MSYS=noglob MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL=*) ==="
          T14_EV="$T14/src_envvar"; mkdir -p "$T14_EV"
          printf 'package main\nimport ("fmt";"os";"os/exec";"path/filepath")\nfunc findBash() string {for _,n:=range []string{"bash.exe","bash"}{if p,err:=exec.LookPath(n);err==nil{return p}};return ""}\nfunc main() {\nexe,err:=os.Executable()\nif err!=nil{fmt.Fprintln(os.Stderr,err);os.Exit(1)}\nstub:=filepath.Join(filepath.Dir(exe),"gh")\nbash:=findBash()\nif bash==""{fmt.Fprintln(os.Stderr,"bash.exe not found");os.Exit(1)}\nfor i,a:=range os.Args{fmt.Fprintf(os.Stderr,"P14_SHIM_ENV_RECV[%%d]=%%s\\n",i,a)}\nargs:=append([]string{stub},os.Args[1:]...)\ncmd:=exec.Command(bash,args...)\ncmd.Env=append(os.Environ(),"MSYS=noglob","MSYS_NO_PATHCONV=1","MSYS2_ARG_CONV_EXCL=*")\ncmd.Stdin=os.Stdin;cmd.Stdout=os.Stdout;cmd.Stderr=os.Stderr\nif err:=cmd.Run();err!=nil{if e,ok:=err.(*exec.ExitError);ok{os.Exit(e.ExitCode())};fmt.Fprintln(os.Stderr,err);os.Exit(1)}\n}\n' > "$T14_EV/main.go"
          printf 'module shimenvvar\ngo 1.21\n' > "$T14_EV/go.mod"
          (cd "$T14_EV" && go build -o "$T14/gh_env.exe" .) && echo "14-D build: OK" || echo "14-D build: FALHOU"

          echo "=== 14-E: compila shim force-quoted (SysProcAttr.CmdLine — todos os args com aspas explícitas) ==="
          T14_FQ="$T14/src_forceq"; mkdir -p "$T14_FQ"
          # Go source codificado em base64 para evitar escaping de aspas duplas no shell
          echo '' | base64 -d > "$T14_FQ/main.go"
          printf 'module shimforceq\ngo 1.21\n' > "$T14_FQ/go.mod"
          (cd "$T14_FQ" && go build -o "$T14/gh_fq.exe" .) && echo "14-E build: OK" || echo "14-E build: FALHOU"

          echo "=== 14-F/G/H: Go, Node.js, Python chamam gh via shim baseline ==="
          cp "$T14/gh_base.exe" "$T14/gh.exe" 2>/dev/null || true
          echo "=== 14-F: Go exec.Command('gh','api','repos/{owner}/{repo}') via baseline ==="
          T14_GC="$T14/src_caller"; mkdir -p "$T14_GC"
          printf 'package main\nimport ("fmt";"os";"os/exec";"strings")\nfunc main() {\np14:=os.Getenv("PATH_14")\nos.Setenv("PATH",p14)\ncmd:=exec.Command("gh","api","repos/{owner}/{repo}")\nout,err:=cmd.CombinedOutput()\nfmt.Printf("P14F_GO rc=%%v out=%%s\\n",err,strings.TrimSpace(string(out)))\n}\n' > "$T14_GC/main.go"
          printf 'module gocaller\ngo 1.21\n' > "$T14_GC/go.mod"
          (cd "$T14_GC" && go build -o "$T14/go_caller.exe" .) && echo "go_caller build: OK" || echo "go_caller build: FALHOU"
          if [ -f "$T14/go_caller.exe" ]; then
            PATH_14="$PATH_14" "$T14/go_caller.exe" 2>&1 || true
          fi

          echo "=== 14-G: Node.js spawnSync('gh',['api','repos/{owner}/{repo}']) via baseline ==="
          printf 'const c=require("child_process"),p14=process.env.PATH_14||"";\nconst r=c.spawnSync("gh",["api","repos/{owner}/{repo}"],{encoding:"utf8",env:{...process.env,PATH:p14}});\nconsole.log("P14G_NODE rc="+r.status+" stdout="+JSON.stringify((r.stdout||"").trim())+" stderr="+JSON.stringify((r.stderr||"").trim()));\n' > "$T14/node_caller.js"
          PATH_14="$PATH_14" node "$T14/node_caller.js" 2>&1 || true

          echo "=== 14-H: Python subprocess.run(['gh','api','repos/{owner}/{repo}']) via baseline ==="
          printf 'import subprocess,os\np14=os.environ.get("PATH_14","")\nr=subprocess.run(["gh","api","repos/{owner}/{repo}"],capture_output=True,env={**os.environ,"PATH":p14})\nprint("P14H_PY rc="+str(r.returncode)+" stdout="+repr(r.stdout.decode().strip())+" stderr="+repr(r.stderr.decode().strip()))\n' > "$T14/py_caller.py"
          PATH_14="$PATH_14" python3 "$T14/py_caller.py" 2>&1 || true

          echo "=== 14-I: Go chama bash.exe DIRETAMENTE (sem shim) — discriminante fronteira shim→bash ==="
          # Se braces chegam aqui mas somem via shim → problema na fronteira shim→bash (H1)
          # Se braces somem aqui também → problema na fronteira Go→bash (H2)
          T14_GD="$T14/src_direct"; mkdir -p "$T14_GD"
          printf 'package main\nimport ("fmt";"os";"os/exec")\nfunc findBash() string {for _,n:=range []string{"bash.exe","bash"}{if p,err:=exec.LookPath(n);err==nil{return p}};return ""}\nfunc main() {\nstub:=os.Args[1]\nbash:=findBash()\nif bash==""{fmt.Fprintln(os.Stderr,"bash.exe not found");os.Exit(1)}\nfmt.Fprintf(os.Stderr,"P14I_DIRECT bash=%%s stub=%%s\\n",bash,stub)\nargs:=[]string{stub,"api","repos/{owner}/{repo}"}\ncmd:=exec.Command(bash,args...)\ncmd.Stdin=os.Stdin;cmd.Stdout=os.Stdout;cmd.Stderr=os.Stderr\nif err:=cmd.Run();err!=nil{if e,ok:=err.(*exec.ExitError);ok{os.Exit(e.ExitCode())};fmt.Fprintln(os.Stderr,err);os.Exit(1)}\n}\n' > "$T14_GD/main.go"
          printf 'module godirect\ngo 1.21\n' > "$T14_GD/go.mod"
          (cd "$T14_GD" && go build -o "$T14/go_direct.exe" .) && echo "go_direct build: OK" || echo "go_direct build: FALHOU"
          if [ -f "$T14/go_direct.exe" ]; then
            PATH="$PATH_14" "$T14/go_direct.exe" "$T14/gh" 2>&1 || true
          fi

          echo "=== 14-J: Go via shim env-var (MSYS=noglob MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL=*) ==="
          if [ -f "$T14/gh_env.exe" ] && [ -f "$T14/go_caller.exe" ]; then
            cp "$T14/gh_env.exe" "$T14/gh.exe"
            PATH_14="$PATH_14" "$T14/go_caller.exe" 2>&1 || true
          else
            echo "14-J: shim env-var ou go_caller nao disponivel — pulando"
          fi

          echo "=== 14-K: Go via shim force-quoted (SysProcAttr.CmdLine) ==="
          if [ -f "$T14/gh_fq.exe" ] && [ -f "$T14/go_caller.exe" ]; then
            cp "$T14/gh_fq.exe" "$T14/gh.exe"
            PATH_14="$PATH_14" "$T14/go_caller.exe" 2>&1 || true
          else
            echo "14-K: shim force-quoted ou go_caller nao disponivel — pulando"
          fi

          rm -rf "$T14"
          echo "=== Pergunta 14 CONCLUIDA — aguardar output Windows para identificar causa raiz ==="

      # ---------------------------------------------------------------
      # Pergunta 15 — Opção D (AC9): byte-identidade shim Node.js vs.
      # binário nativo em win32/x64.
      #
      # O que esta pergunta mede (e como reprova se o cenário não montar):
      #   Dado o binário correto instalado, o shim é byte-transparente em x64?
      #   O shim usa `spawnSync(binPath, args, { stdio: 'inherit' })` +
      #   `process.exit(result.status)` — por construção, zero bytes são
      #   modificados. Esta pergunta confirma empiricamente em x64.
      #
      #   GUARDA DE VACUIDADE (exit 1 em falha de montagem de cenário — única
      #   exceção à regra de "sem veredito" desta sonda; ver cabeçalho do YAML):
      #     - go build falhou → P15_GUARD_FAIL: BUILD_FAILED
      #     - npm pack falhou → P15_GUARD_FAIL: PACK_FAILED
      #     - npm install falhou → P15_GUARD_FAIL: INSTALL_FAILED
      #     - shim.js ausente em node_modules → P15_GUARD_FAIL: VACUIDADE_SHIM
      #     - trackfw.exe ausente em node_modules → P15_GUARD_FAIL: VACUIDADE_BIN
      #     - hash do binário em node_modules ≠ hash do binário compilado →
      #       P15_GUARD_FAIL: HASH_MISMATCH (pacote correto não foi instalado)
      #
      # Desvio declarado vs. VM ARM64:
      #   A VM usou `npm ci` com lockfile gerado no macOS + verdaccio.
      #   Aqui: `npm install` a partir de tarballs gerados no runner (sem
      #   verdaccio, sem lockfile pré-existente). O braço AC6 (lockfile do
      #   macOS instalando no Windows) já foi provado em ARM64 via mecanismo
      #   de lockfileVersion 3 + optionalDependencies — esse mecanismo não
      #   depende de arquitetura. O que esta pergunta prova é mais estreito:
      #   dado o binário correto instalado, o shim é byte-transparente em x64?
      #
      # Desvio de plataforma vs. produção:
      #   Em produção, o npm resolve @trackfw-bin/win32-x64 via
      #   optionalDependencies do shim + seleção por os/cpu. Aqui,
      #   instalamos win32-x64 explicitamente como dependência direta do
      #   projeto de teste — a seleção por plataforma (AC6) não é
      #   reexercitada. Isso restringe a afirmação: o shim é transparente,
      #   dado que o pacote correto está em node_modules.
      #
      # Bin collision declarada: shim e @trackfw-bin/win32-x64 ambos
      #   declaram `"bin": { "trackfw": ... }`. npm coloca o último a ser
      #   instalado em node_modules/.bin/trackfw. Esta sonda sempre invoca
      #   por caminho explícito — não usa .bin/trackfw nem npx — então a
      #   colisão não afeta o resultado. É uma observação de packaging da
      #   opção D: o modelo esbuild não declara `bin` nos pacotes de
      #   plataforma; a opção D declara, o que cria essa colisão.
      #
      # Argumento sobre necessidade de medição x64 vs. extrapolação ARM64:
      #   `stdio: inherit` + `process.exit(result.status)` é comportamento
      #   de libuv/Node, arch-agnostic. A prova ARM64 é evidência forte.
      #   A medição x64 existe porque windows-latest é o alvo publicado do
      #   CI, e mesmo com mecanismo idêntico, um dado empírico no ambiente
      #   de produção vale mais que extrapolação — especialmente após o
      #   episódio do sinal verde medindo outra coisa (2026-09-12).
      # ---------------------------------------------------------------
      - name: "Pergunta 15 — Opcao D: byte-identidade shim vs. nativo em win32/x64 (AC9)"
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          # ── 1. Binário nativo ──────────────────────────────────────────
          # Reusa o exe compilado pela Pergunta 5b se disponível (evita
          # segundo go build); compila do zero se ausente.
          $step5bBin = Join-Path $env:RUNNER_TEMP "probe-bin\trackfw-probe.exe"
          $p15Bin = Join-Path $env:RUNNER_TEMP "p15-native.exe"

          if (Test-Path $step5bBin) {
            Copy-Item $step5bBin $p15Bin -Force
            Write-Host "P15_BUILD_SRC: reutilizado de Pergunta 5b"
          } else {
            Write-Host "P15_BUILD_SRC: compilando agora (Pergunta 5b nao rodou ou falhou)"
            go build -o $p15Bin ./cmd/trackfw
            if ($LASTEXITCODE -ne 0) {
              Write-Host "P15_GUARD_FAIL: BUILD_FAILED"
              exit 1
            }
          }
          $nativeHash = (Get-FileHash $p15Bin -Algorithm SHA256).Hash
          Write-Host "P15_NATIVE_BIN: $p15Bin  SHA256=$nativeHash"

          # ── 2. Preparar pacote win32-x64 com binário ───────────────────
          $pkgWin   = Join-Path $env:GITHUB_WORKSPACE "prototype\packages\trackfw-win32-x64"
          $pkgShim  = Join-Path $env:GITHUB_WORKSPACE "prototype\packages\trackfw-shim"
          $pkgBin   = Join-Path $pkgWin "bin"
          New-Item -ItemType Directory -Force -Path $pkgBin | Out-Null
          Copy-Item $p15Bin (Join-Path $pkgBin "trackfw.exe") -Force
          Write-Host "P15_BIN_COPIED: trackfw.exe em $pkgBin"

          # ── 3. npm pack dos dois pacotes ───────────────────────────────
          $tgzDir = Join-Path $env:RUNNER_TEMP "p15-tarballs"
          New-Item -ItemType Directory -Force -Path $tgzDir | Out-Null

          Push-Location $pkgWin
          npm pack --pack-destination $tgzDir 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) {
            Write-Host "P15_GUARD_FAIL: PACK_FAILED win32-x64"
            Pop-Location; exit 1
          }
          Pop-Location

          Push-Location $pkgShim
          npm pack --pack-destination $tgzDir 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) {
            Write-Host "P15_GUARD_FAIL: PACK_FAILED shim"
            Pop-Location; exit 1
          }
          Pop-Location

          $shimTgz   = (Get-ChildItem $tgzDir -Filter "trackfw-shim-*.tgz" | Select-Object -First 1).FullName
          $win64Tgz  = (Get-ChildItem $tgzDir -Filter "*win32-x64*.tgz"   | Select-Object -First 1).FullName

          if (-not $shimTgz -or -not $win64Tgz) {
            Write-Host "P15_GUARD_FAIL: TARBALL_MISSING shim=$shimTgz win32x64=$win64Tgz"
            exit 1
          }

          # Preflight: o binário ESTÁ no tarball?
          Write-Host "P15_TARBALL_CONTENTS (win32-x64):"
          tar -tzf $win64Tgz | Write-Host
          Write-Host "P15_TARBALL_SIZES: shim=$('{0:N0}' -f (Get-Item $shimTgz).Length)B win32x64=$('{0:N0}' -f (Get-Item $win64Tgz).Length)B"

          # ── 4. Instalar em projeto de teste ────────────────────────────
          # Registry morto (http://127.0.0.1:1) prova que instalação não usa
          # rede: qualquer tentativa falharia com ECONNREFUSED. file: paths
          # resolvem localmente, sem registry.
          # --omit=optional no install do shim: evita timeout por tentativas
          # de conexão ao registry morto para as outras 5 plataformas do
          # optionalDependencies do shim.
          $testDir = Join-Path $env:RUNNER_TEMP "p15-test"
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null

          Write-Host "=== P15-INSTALL: shim (--omit=optional, registry morto) ==="
          Push-Location $testDir
          npm install --ignore-scripts --omit=optional --registry http://127.0.0.1:1 $shimTgz 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) {
            Write-Host "P15_GUARD_FAIL: INSTALL_FAILED shim"
            Pop-Location; exit 1
          }

          Write-Host "=== P15-INSTALL: @trackfw-bin/win32-x64 (registry morto) ==="
          npm install --ignore-scripts --registry http://127.0.0.1:1 $win64Tgz 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) {
            Write-Host "P15_GUARD_FAIL: INSTALL_FAILED win32-x64"
            Pop-Location; exit 1
          }
          Pop-Location

          # ── 5. Guarda de vacuidade + proveniência do hash ─────────────
          $shimJs      = Join-Path $testDir "node_modules\trackfw-shim\bin\trackfw.js"
          $platformBin = Join-Path $testDir "node_modules\@trackfw-bin\win32-x64\bin\trackfw.exe"

          if (-not (Test-Path $shimJs)) {
            Write-Host "P15_GUARD_FAIL: VACUIDADE_SHIM — $shimJs ausente"
            exit 1
          }
          if (-not (Test-Path $platformBin)) {
            Write-Host "P15_GUARD_FAIL: VACUIDADE_BIN — $platformBin ausente"
            exit 1
          }

          $installedHash = (Get-FileHash $platformBin -Algorithm SHA256).Hash
          Write-Host "P15_HASH_NATIVE=$nativeHash"
          Write-Host "P15_HASH_INSTALLED=$installedHash"
          if ($installedHash -ne $nativeHash) {
            Write-Host "P15_GUARD_FAIL: HASH_MISMATCH — binario em node_modules difere do compilado"
            exit 1
          }
          Write-Host "P15_GUARD_OK: shim + binario presentes, hash verificado"

          # ── 6. Floor de ruido: nativo vs. nativo ──────────────────────
          # Se native1 != native2, a saida do comando nao e deterministica
          # e a comparacao shim-vs-nativo e ininterpretavel para esse comando.
          $cmpDir = Join-Path $env:RUNNER_TEMP "p15-cmp"
          New-Item -ItemType Directory -Force -Path $cmpDir | Out-Null

          $floorCmds = @("version")
          foreach ($fc in $floorCmds) {
            $n1 = Join-Path $cmpDir "floor-n1-$fc.bin"
            $n2 = Join-Path $cmpDir "floor-n2-$fc.bin"
            $p1 = Start-Process -FilePath $platformBin -ArgumentList @($fc) -NoNewWindow -PassThru `
                    -RedirectStandardOutput $n1 -Wait
            $p2 = Start-Process -FilePath $platformBin -ArgumentList @($fc) -NoNewWindow -PassThru `
                    -RedirectStandardOutput $n2 -Wait
            fc.exe /b $n1 $n2 | Out-Null
            $noiseResult = if ($LASTEXITCODE -eq 0) { "IDENTICAL" } else { "NONDETERMINISTIC" }
            Write-Host "P15_NOISE_FLOOR [$fc] native_vs_native=$noiseResult"
          }

          # ── 7. Comparacao byte-a-byte: shim vs. nativo ────────────────
          # CWD: raiz do checkout (projeto real trackfw-nul), mesmo padrao
          # da VM ARM64. Captura stdout via Start-Process (sem pipeline
          # PowerShell para nao modificar bytes). fc.exe /b compara binario.
          $cmds = @(
            @{ label = "version";        args = @("version") },
            @{ label = "validate-json";  args = @("validate","--json") },
            @{ label = "status";         args = @("status") },
            @{ label = "context-json";   args = @("context","--json") },
            @{ label = "validate-strict";args = @("validate","--strict") }
          )

          foreach ($c in $cmds) {
            $lbl  = $c.label
            $args = $c.args

            $nOut = Join-Path $cmpDir "native-$lbl.bin"
            $sOut = Join-Path $cmpDir "shim-$lbl.bin"

            $pn = Start-Process -FilePath $platformBin -ArgumentList $args `
                    -NoNewWindow -PassThru -RedirectStandardOutput $nOut -Wait
            $nExit = $pn.ExitCode

            $ps = Start-Process -FilePath "node" `
                    -ArgumentList (@($shimJs) + $args) `
                    -NoNewWindow -PassThru -RedirectStandardOutput $sOut -Wait
            $sExit = $ps.ExitCode

            $nBytes = (Get-Item $nOut).Length
            $sBytes = (Get-Item $sOut).Length

            fc.exe /b $nOut $sOut | Out-Null
            $verdict = if ($LASTEXITCODE -eq 0) { "BYTE_IDENTICAL" } else { "DIVERGE" }
            $exitMatch = if ($nExit -eq $sExit) { "EXIT_MATCH" } else { "EXIT_MISMATCH" }

            Write-Host "P15 [$lbl] native_exit=$nExit shim_exit=$sExit native_bytes=$nBytes shim_bytes=$sBytes $exitMatch $verdict"
          }

          Write-Host "=== P15 CONCLUIDA — buscar linhas P15_ no log para leitura dos resultados ==="

      - name: Registrar duração
        if: always()
        shell: pwsh
        run: |
          $start = [DateTimeOffset]::Parse($env:started)
          $elapsed = [DateTimeOffset]::UtcNow - $start
          $msg = "Duração medida da sonda (workflow windows-probe): $($elapsed.ToString())"
          Write-Host $msg
          if ($env:GITHUB_STEP_SUMMARY) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Tempo da sonda`n`n$msg`n`nLembrete: esta sonda NÃO substitui o job de regressão (windows-full-suites / windows-defect-reproduction em quality.yml) — ver comentário no topo deste workflow." }

      # ---------------------------------------------------------------
      # Residual declarado — o que esta sonda NÃO responde (mesmo lista do
      # ML-0A/Wave 0, §4, para não se perder do roadmap):
      #   - core.symlinks=false real de uma clonagem de terceiro fora deste
      #     runner: a Pergunta 7 mede o comportamento NESTE runner, com o
      #     default do Git aqui — não o de uma máquina de terceiro que
      #     tenha configurado core.symlinks explicitamente.
      #   - console cp1252 REAL, interativo (usuário sentado num
      #     cmd.exe/Windows Terminal): todo stdout aqui passa pelo
      #     redirecionamento próprio do Actions runner, não por um console
      #     interativo de verdade — Pergunta 3/4 medem a aproximação mais
      #     próxima disponível em CI, não o caso relatado na issue.
      #   - Codepage além de cp1252 (cp936, cp1251, etc.) — o runner
      #     hospedado roda locale en-US.
      #   - Developer Mode habilitado — de propósito NÃO habilitado aqui;
      #     é por isso que a Pergunta 2 espera (e reporta, sem falhar) o
      #     erro de privilégio na criação do symlink via os.Symlink.
      # ---------------------------------------------------------------
      - name: Residual declarado (sempre impresso, para ficar no log)
        if: always()
        shell: pwsh
        run: |
          Write-Host "Esta sonda NÃO responde: core.symlinks=false de clone de terceiro fora deste runner; console cp1252 REAL interativo (aqui o stdout é capturado pelo Actions, não por um console interativo); codepage diferente de cp1252; comportamento com Developer Mode habilitado (de propósito não habilitado nesta execução)."
