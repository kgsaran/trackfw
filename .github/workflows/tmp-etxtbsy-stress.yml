name: "tmp: ETXTBSY stress (remove before merge)"

# ARQUIVO TEMPORÁRIO — sai da branch antes do merge (ML-1C, ML-FB).
# Objetivo: medir taxa de Text file busy e exit -1 em ubuntu-latest (multi-core)
# antes e depois da correção do ML-1B (writeExecutableForTest com ForkLock.RLock).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arm: [before, after]
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Materialize before tree
        if: matrix.arm == 'before'
        run: git worktree add --detach /tmp/before origin/main

      - name: Set work directory
        id: workdir
        run: |
          if [ "${{ matrix.arm }}" = "before" ]; then
            echo "dir=/tmp/before" >> "$GITHUB_OUTPUT"
          else
            echo "dir=${{ github.workspace }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe environment
        run: |
          echo "nproc=$(nproc)"
          pwsh --version 2>/dev/null || echo "pwsh: not installed"
          for sh in dash bash zsh pwsh; do
            path=$(command -v "$sh" 2>/dev/null || true)
            if [ -n "$path" ]; then echo "$sh: $path"; else echo "$sh: not found"; fi
          done

      - name: Run full package (contenção real)
        working-directory: ${{ steps.workdir.outputs.dir }}
        run: >
          TRACKFW_DISABLE_EXTERNAL_COMMANDS=1
          go test -count=3 -timeout 30m ./internal/generators/
          > out.log 2>&1 || true

      - name: Run focused TestGuardLineShellMatrix
        working-directory: ${{ steps.workdir.outputs.dir }}
        run: >
          TRACKFW_DISABLE_EXTERNAL_COMMANDS=1
          go test -count=20 -timeout 20m -run 'TestGuardLineShellMatrix'
          ./internal/generators/
          >> out.log 2>&1 || true

      - name: Tabulate results
        working-directory: ${{ steps.workdir.outputs.dir }}
        run: |
          NPROC=$(nproc)
          TFB=$(grep -c "Text file busy" out.log || true)
          MINUS1=$(grep -c "obteve -1" out.log || true)
          FAIL=$(grep -c "^--- FAIL" out.log || true)
          PANIC=$(grep -c "panic: test timed out" out.log || true)
          LINE="ARM=${{ matrix.arm }} SHARD=${{ matrix.shard }} NPROC=${NPROC} TFB=${TFB} MINUS1=${MINUS1} FAIL=${FAIL} PANIC=${PANIC}"
          echo "$LINE"
          echo "$LINE" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etxtbsy-${{ matrix.arm }}-${{ matrix.shard }}
          path: ${{ steps.workdir.outputs.dir }}/out.log
          retention-days: 7
