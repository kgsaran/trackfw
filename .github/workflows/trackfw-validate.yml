name: trackfw validate
on: [push, pull_request]
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go build -o /usr/local/bin/trackfw ./cmd/trackfw
      - run: trackfw validate
